.add{background:#ecfdf5}.del{background:#fef2f2}.chg{background:#fffbeb}
.sub button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 10px;margin-right:6px;cursor:pointer}.sub button.on{background:#111827;color:#fff}

<script>
const D = {"run": "_smoke_soa", "config": {"run_name": "_smoke_soa", "provider": "cctq", "model": "gpt-6.1-sol", "sources": ["arch170", "ranking_v2", "ranking_v3", "dataflip500"], "epochs": 1, "batch_size": 4, "eval_every": 3, "test_repeats": 0, "gate_repeats": 2, "concurrency": 4, "seed": 20261003, "render": "tool", "solve_effort": "low", "summ_effort": "high", "discover_wrong_model": null, "discover_wrong_backend": "api", "solver_backend": "codex", "summ_backend": "claude_code", "summ_model": "claude-opus-5-5", "science": true, "lab_workers": 12, "research_calls": 1, "research_max_cands": 12, "research_effort": "medium", "harness": "c3032484c8", "updated_at": "2026-10-03T17:00:31+00:00"}, "texts": ["CORE RULE (all families, T=256-2048 steps; every task here is under-trained): rank choices by cumulative per-parameter displacement Δ. Adam/AdamW/RMSprop: Δ≈lr·T. Adagrad (zero-init accumulator, steps decay ~lr/√t): Δ≈2·lr·√T. SGD: Δ≈lr·T·|g|/(1−m) with raw grad |g|≈0.01 (bigram LM 0.003, MSE regression with momentum 0.03 — K1019), i.e. plain SGD ≈ Adam at lr/100, SGD m=0.9 ≈ Adam at lr/10. The largest-Δ choice wins 85% of optimizer-only and ~85% of mixed questions (after the lr-ceiling exceptions); a 1.5-3× Δ edge usually beats any architecture advantage. Use architecture rules only to break Δ ties (same optimizer+lr) or in architecture-only questions.", "Adagrad conversion (any family): because Adagrad's step decays as lr/√t, it matches Adam only when its lr is ~√T/2 (8-23×) larger. Same architecture, lr_Adagrad/lr_Adam ≤3× → Adam/AdamW wins 65/70; =10× → coin flip (4-3); ≥30× → Adagrad wins 9/9. Within Adagrad the larger lr always wins (40/41 pairs; lr=3e-3 is never too big — the decay is a built-in anneal). Adagrad at lr≤1e-4 is effectively frozen (Δ≤0.01) and loses to almost any adaptive choice with lr≥3e-5·√T/2.", "SGD (all families): plain SGD (momentum 0) at lr≤3e-3 is nearly frozen (wins ~8% of its appearances; in LMs embedding rows barely move, CE stays ≈ln V). SGD momentum 0.9 behaves like Adam at ~lr/10: so SGD m=0.9 lr 1e-3-3e-3 ≈ Adam 1e-4-3e-4 and is a real contender — it beats Adagrad ≤1e-3, Adam/RMSprop ≤3e-5-1e-4 and unstable RMSprop 3e-3 (e.g. univariate MSE 6e-5 vs 0.03) — but SGD m=0.9 at lr≤3e-4 loses to Adam/RMSprop at the same lr (10× smaller Δ). Family calibration (SGD calibration rule): bigram LM ≈ Adam at lr/30 (weaker), MSE regression ≈ Adam at lr/3 (stronger). Compute Δ with momentum.", "LR-ceiling exceptions to the Δ rule: (a) RMSprop at lr≥1e-3 on MSE regression (no momentum averaging, zero-init square-avg inflates early steps up to ~10×) is noisy/unstable: vs choices with ≥3× smaller Δ it loses 12/27 at 3e-3 and 3/4 at 1e-3 (univariate); prefer Adam/AdamW at the same lr (Adam 3e-3 loses only 2/35) or RMSprop ≤3e-4. (b) Post-LN transformer LMs (nn.TransformerEncoderLayer default, no warmup) with Adam/AdamW/RMSprop lr≥1e-3 lose 14/25 to lr 1e-4-3e-4, worst for d_model=128 or T≥1024; GRU LMs tolerate 1e-3-3e-3 (high lr wins 12/17). (c) On MLP classification and Adam regression, lr 3e-3 is safe — take the larger Δ.", "Second-order optimizer knobs are noise at these budgets: weight decay 0-1e-3 changes loss <1% (same-arch pairs: higher wd 3 wins/10 losses, all within 1%); Adam vs AdamW at equal lr/betas is a coin flip (5-5); beta2 0.95 vs 0.999 is ~even (7-4). Never let these override a lr·T difference; in rankings, order such near-twins by architecture or leave them adjacent.", "MLP architecture default (regression, XOR, spiral, tabular when Δ<0.1): score each MLP = (number of LayerNorm'd blocks) + 1 if residual; pick the highest; break ties by activation on regression (ReLU/LeakyReLU > GELU > SiLU), then greater depth. Picks 91/118 arch-only winners (univariate 28/31, multivariate 28/33). Pairwise more-LN beats less-LN 61-11 (multivariate), 57-12 (univariate), 41-4 (tabular Δ<0.1); on regression LN outranks activation (smooth+more-LN beats ReLU+less-LN 30/41). Mechanism: each unnormalized layer shrinks hidden RMS ~0.5×; LN + identity paths speed an under-trained net 2-3×. Exception: XOR with ≥8 input features at Δ≥0.05 — smooth activation decides (K1018).", "Regression depth × residual (uni/multivariate MSE, any budget): a deeper residual MLP beats a shallower non-residual one 32-2; deep-narrow beats shallow-wide at similar params 70-32 (51-19 when lr·T<0.1); at equal depth extra width is a coin flip (5-5). Oscillatory/composite targets (sin(2πx)…, cos(2π sin…)) amplify the depth advantage: composition of 4-5 normalized residual blocks generates high-frequency curvature that 1-2 layer nets cannot reach within the budget. Non-residual deep stacks without LN are the exception: they attenuate signal and usually lose.", "Activation × task: on MSE regression prefer ReLU/LeakyReLU > GELU > SiLU. Pairwise vs other activations (same optimizer): LeakyReLU wins 51/77, ReLU 42/67, GELU 30/64, SiLU only 29/96. SiLU/GELU have slope ~0.5 near 0 (silu(x)≈x/2), so stacked blocks attenuate signal/gradient and fit kinks/polynomials less precisely. The ranking flips for tabular classification once well-trained (see tabular rule): there GELU/SiLU win 16/16 vs ReLU-family. On XOR/spiral activation is a weak factor — decide by LN/residual/depth.", "Budget × depth reversal on synthetic TABULAR classification (1024 train rows, 2-16 Gaussian features, smooth_additive / piecewise / sparse_interaction rules): when the shared Δ≥0.1 (Δ from the core rule: Adam/RMSprop lr·T, Adagrad 2·lr·√T, SGD ~lr·T/(1−m)/100 — NOT raw lr·T for SGD/Adagrad), the boundary is already learned and test CE is set by overconfidence — prefer SHALLOW (1-3 layers), wider nets with GELU/SiLU and fewer LN: shallower wins 21-5, less-LN 17-6, smooth activation 16/16. When Δ<0.1 the normal rule holds (more LN 41-4, deeper 35-17). This 2-regime rule picks 26/32 tabular arch-only winners. XOR/spiral do NOT reverse.", "XOR and two-spiral classification (zero linear signal, chance CE=ln2≈0.693): loss stays on the chance plateau until weights move well beyond init, so (i) Δ is decisive — choices with Δ≲0.01 sit at 0.65-0.70 and are near-tied; (ii) among equal optimizers, deep RESIDUAL blocks with LN win: deeper+residual beats shallower plain 33-14 on classification, more-LN wins 20-5 on spiral (Δ≥0.01), deeper wins XOR at every budget (26-11). A 1-2 layer plain net rarely escapes the plateau in 256-512 steps. Spiral difficulty scales with turns: 1 turn best CE ~0.001-0.03, 2-2.5 turns ~0.45-0.6, 3 turns ~0.52-0.69 (nearly everything stuck → pick largest Δ).", "Bigram LM architecture (same optimizer): a GRU LM beats a post-LN causal transformer in 20 of 21 same-optimizer pairs, at both weak and strong Δ — rank the GRU first. Mechanism: the task is a first-order lookup P(y|x_t); the GRU maps the current token straight to its output state and its tanh-bounded hidden state gives near-uniform initial logits (CE≈ln V), while the post-LN transformer feeds unit-RMS features to the head (logit std ~0.6, initial CE ~ln V+0.1-0.2) and must learn to ignore attention mixing. Transformer-vs-transformer shape is Δ-dependent (see bigram transformer shape rule): fewer layers only reliably wins at 0.02≤Δ<0.1 (21/21); at Δ≥0.5 prefer smaller d_model.", "When Δs are close (mixed questions, rankings): a ≥4× Δ gap beats architecture (higher Δ wins 35/40 even vs a net with 2+ more LN/residual). Within ~3×, a clearly better MLP (≥2 more LN blocks/residual) wins 11/19 — treat as a toss-up leaning architecture. Δ also saturates: once both Δ≳0.3, extra Δ wins only ~62% (then use lr-ceiling, tabular-overfit and architecture rules). Rankings: sort by log Δ, then architecture; near-chance choices (Δ<~0.005: CE≈ln2 / ln V, MSE≈Var(y)) form a tied bottom block — order them by architecture, not small lr differences.", "Bigram LM optimizer sweet spot: labels are sampled from P(y|x), so gradients carry irreducible noise and the achievable gain is only ~0.1-0.8 nats below ln V. Among choices with Δ≥0.1, prefer the one with Δ nearest ~0.3 (e.g. Adam/AdamW/RMSprop 3e-4 at T=512-1024, Adagrad 3e-3); treat Δ≥1 (lr≥1e-3 at T≥1024, lr 3e-3 at T≥512) as likely overshoot. Below Δ≈0.1 ordinary max-Δ still applies. This 'nearest 0.3' scoring picks 52/66 bigram optimizer/mixed winners vs 47/66 for plain max-Δ; adaptive-transformer winners are mostly lr 3e-4 (22/52). If all Δ<0.02 every LM stays ≈ln V and the GRU wins ties.", "Dataset structure × depth (data-flip cue): the deeper-is-better preference (under Δ<0.1) is strong for smooth/compositional targets — tabular smooth_additive (deeper 24-8), XOR with ≤4 input features (15-4), oscillatory univariate targets — but weak or absent when the rule is piecewise_boundary (5-6) or sparse_interaction (6-3) or XOR has 8-16 distractor features (11-7); there prefer the most-LN candidate regardless of depth, EXCEPT XOR with ≥8 features at Δ≥0.05, where more-LN wins only 5/11 and GELU/SiLU decides (6/6; see XOR-distractor rule). Polynomial/low-frequency univariate targets reach MSE 1e-4-1e-5, so stability (Adam over RMSprop at high lr) decides.", "Residual × depth × task: on regression, depth helps even without residuals (deeper plain beats shallower residual 24-15) because composed nonlinearities are needed for curvature; on classification, depth WITHOUT residual hurts (shallower residual beats deeper plain 19-13) while deeper residual beats shallower plain 33-14. So for CE tasks never pick a deep (≥4) plain stack over a residual one at the same optimizer; for MSE tasks a deep plain stack with ≥2 LN blocks is still competitive. Deep residual MLPs win 53% of their appearances vs 29% for deep plain.", "Capacity is not the bottleneck: at these budgets parameter count and width barely predict the winner — do not pick the 'biggest model'. Pairwise larger-params wins only 37/76 on bigram LMs, ~50% on univariate regression; at equal depth wider MLPs are a coin flip on regression (5-5) and only mildly better on classification (7-2). Datasets are tiny but noiseless (256-1024 rows), and every candidate has ample capacity; what differs is how fast the parameters move (Δ) and how well signal propagates (LN, residual, activation). Use width/params only as the last tie-breaker (and prefer wider only in the tabular Δ≥0.1 regime).", "Bigram LM transformer SHAPE (transformer vs transformer, same optimizer/lr/T) flips with Δ (core-rule units). 0.02≤Δ<0.1: fewest layers wins 21/21 pairs and the larger d_model wins 15/15 (d_model 128 × 1-2 layers, d_ff 256 won 10/10 questions). 0.1≤Δ<0.5: weak (fewer layers 10/17, smaller d_model 9/13). Δ≥0.5 (lr 3e-3 at T≥256, 1e-3 at T≥512): smaller d_model wins 5/6 and fewer layers only 3/10 — wide post-LN overshoots (cf. K1004b); order by d_model ascending, then layers (q_17f213: 32×3<32×4<64×1<64×2). Δ<0.02: all ≈ln V, deeper wins 10/17 (deeper-32 beat 64×1 in q_b66719). Winner-level 20/31 vs 18/31 for pooled 'fewer layers'. GRU still beats all (K1011).", "XOR with ≥8 input features (≥6 pure-noise distractors) once trained (shared Δ≥0.05, e.g. Adam-family lr·T≥0.05): tabular-style reversal — GELU/SiLU beats ReLU/LeakyReLU in 6/6 same-optimizer pairs (3 questions; q_e914b6: 2-layer SiLU w192 1 LN CE 0.11 beat 5-layer 3-LN SiLU 0.17 and residual 2-LN ReLU 0.17), while more-LN wins only 5/11 and deeper 5/10. With ≤4 features keep deeper/more-LN (7/7, 6/7 pairs); for Δ<0.05 the LN/depth rule holds for all XOR (more-LN 7/9 even with distractors). Larger Δ still wins on XOR (6/7 pairs at Δ≥0.05). Small n — use as a tie-breaker override of K1006/K1014 only in this scope.", "SGD gradient-scale calibration for the Δ rule (K1001 assumes raw |g|≈0.01), fit on 368 SGD-vs-adaptive pairs. Bigram LM: use |g|≈0.003 (SGD m=0.9 ≈ Adam at lr/30, plain ≈ lr/300): larger-Δ correct 68/70 vs 63/70 at 0.01; SGD m=0.9 beat Adam/AdamW/RMSprop in only 1/18 LM pairs (1/4 even at nominal Δ parity). MSE regression with momentum 0.9: use |g|≈0.03 (SGD m=0.9 ≈ Adam at lr/3): 59/71 vs 54/71; it wins 11/19 when the adaptive Δ is ≤4× its 0.01-estimate. Classification (131/146) and plain-SGD regression: keep 0.01. Plain SGD wins only 3/141 pairs when the adaptive Δ is >15× larger.", "CORE RULE (all families, T=256-2048; every task is under-trained): rank choices by cumulative per-parameter displacement Δ. Adam/AdamW/RMSprop: Δ≈lr·T. Adagrad: Δ≈2·lr·√T. SGD: Δ≈lr·T·|g|/(1−m), |g|≈0.01 (bigram LM 0.003; MSE+momentum 0.03, K1019). For RANKING questions sort ALL choices by Δ (largest Δ = lowest loss); break Δ ties with architecture rules (MLP: LN/residual score K1006; bigram: GRU>transformer K1011). Corpus pairwise accuracy of Δ order: ratio ≥4× 92% (596/646); 1.5-4× 90% optimizer-only, 73% mixed; <1.5× only 69%. Largest-Δ wins ~85% of optimizer-only/mixed selects (after lr-ceiling exceptions K1004).", "MLP architecture default (regression, XOR, spiral; tabular only when Δ<0.1), same optimizer/lr/T: score each MLP = (# LayerNorm'd blocks) + 1 if residual; higher score = lower loss. Use it as a FULL RANKING rule. Corpus same-optimizer MLP pairs ordered by score: regression 128/150 (85%; gap 1: 61/74, gap≥2: 67/76), spiral 25/31, XOR 25/36, tabular 47/68. A plain stack with ≥2 LN blocks beats a residual no-LN MLP 9/9 (q_33b2d1 exact: 3-LN plain > residual LeakyReLU > 1-LN SiLU > residual SiLU > plain 0-LN). Score ties: on regression break by activation (ReLU/LeakyReLU > GELU > SiLU); depth is a weak tie-break (regression deeper 16/32; tabular/spiral SHALLOWER wins 24/34; XOR deeper 7/10)."], "snaps": [{"label": "kb_0000", "base": "kb_0000", "epoch": 0, "claims": [["K1001", 0.0, 0.0, 0.5, 0, 0, 0, "seed:seed_distill_v1"], ["K1002", 0.0, 0.0, 0.5, 1, 0, 0, "seed:seed_distill_v1"], ["K1003", 0.0, 0.0, 0.5, 2, 0, 0, "seed:seed_distill_v1"], ["K1004", 0.0, 0.0, 0.5, 3, 0, 0, "seed:seed_distill_v1"], ["K1005", 0.0, 0.0, 0.5, 4, 0, 0, "seed:seed_distill_v1"], ["K1006", 0.0, 1.0, 0.3333333333333333, 5, 0, 0, "seed:seed_distill_v1"], ["K1007", 0.0, 0.0, 0.5, 6, 0, 0, "seed:seed_distill_v1"], ["K1008", 0.0, e, CE stays ≈ln V). SGD momentum 0.9 behaves like Adam at ~lr/10: so SGD m=0.9 lr 1e-3-3e-3 ≈ Adam 1e-4-3e-4 and is a real contender — it beats Adagrad ≤1e-3, Adam/RMSprop ≤3e-5-1e-4 and unstable RMSprop 3e-3 (e.g. univariate MSE 6e-5 vs 0.03) — but SGD m=0.9 at lr≤3e-4 loses to Adam/RMSprop at the same lr (10× smaller Δ). Family calibration (SGD calibration rule): bigram LM ≈ Adam at lr/30 (weaker), MSE regression ≈ Adam at lr/3 (stronger). Compute Δ with momentum.\n[K1004] LR-ceiling exceptions to the Δ rule: (a) RMSprop at lr≥1e-3 on MSE regression (no momentum averaging, zero-init square-avg inflates early steps up to ~10×) is noisy/unstable: vs choices with ≥3× smaller Δ it loses 12/27 at 3e-3 and 3/4 at 1e-3 (univariate); prefer Adam/AdamW at the same lr (Adam 3e-3 loses only 2/35) or RMSprop ≤3e-4. (b) Post-LN transformer LMs (nn.TransformerEncoderLayer default, no warmup) with Adam/AdamW/RMSprop lr≥1e-3 lose 14/25 to lr 1e-4-3e-4, worst for d_model=128 or T≥1024; GRU LMs tolerate 1e-3-3e-3 (high lr wins 12/17). (c) On MLP classification and Adam regression, lr 3e-3 is safe — take the larger Δ.\n[K1005] Second-order optimizer knobs are noise at these budgets: weight decay 0-1e-3 changes loss <1% (same-arch pairs: higher wd 3 wins/10 losses, all within 1%); Adam vs AdamW at equal lr/betas is a coin flip (5-5); beta2 0.95 vs 0.999 is ~even (7-4). Never let these override a lr·T difference; in rankings, order such near-twins by architecture or leave them adjacent.\n[K1006] MLP architecture default (regression, XOR, spiral, tabular when Δ<0.1): score each MLP = (number of LayerNorm'd blocks) + 1 if residual; pick the highest; break ties by activation on regression (ReLU/LeakyReLU > GELU > SiLU), then greater depth. Picks 91/118 arch-only winners (univariate 28/31, multivariate 28/33). Pairwise more-LN beats less-LN 61-11 (multivariate), 57-12 (univariate), 41-4 (tabular Δ<0.1); on regression LN outranks activation (smooth+more-LN beats ReLU+less-LN 30/41). Mechanism: each unnormalized layer shrinks hidden RMS ~0.5×; LN + identity paths speed an under-trained net 2-3×. Exception: XOR with ≥8 input features at Δ≥0.05 — smooth activation decides (K1018).\n[K1007] Regression depth × residual (uni/multivariate MSE, any budget): a deeper residual MLP beats a shallower non-residual one 32-2; deep-narrow beats shallow-wide at similar params 70-32 (51-19 when lr·T<0.1); at equal depth extra width is a coin flip (5-5). Oscillatory/composite targets (sin(2πx)…, cos(2π sin…)) amplify the depth advantage: composition of 4-5 normalized residual blocks generates high-frequency curvature that 1-2 layer nets cannot reach within the budget. Non-residual deep stacks without LN are the exception: they attenuate signal and usually lose.\n[K1008] Activation × task: on MSE regression prefer ReLU/LeakyReLU > GELU > SiLU. Pairwise vs other activations (same optimizer): LeakyReLU wins 51/77, ReLU 42/67, GELU 30/64, SiLU only 29/96. SiLU/GELU have slope ~0.5 near 0 (silu(x)≈x/2), so stacked blocks attenuate signal/gradient and fit kinks/polynomials less precisely. The ranking flips for tabular classification once well-trained (see tabular rule): there GELU/SiLU win 16/16 vs ReLU-family. On XOR/spiral activation is a weak factor — decide by LN/residual/depth.\n[K1009] Budget × depth reversal on synthetic TABULAR classification (1024 train rows, 2-16 Gaussian features, smooth_additive / piecewise / sparse_interaction rules): when the shared Δ≥0.1 (Δ from the core rule: Adam/RMSprop lr·T, Adagrad 2·lr·√T, SGD ~lr·T/(1−m)/100 — NOT raw lr·T for SGD/Adagrad), the boundary is already learned and test CE is set by overconfidence — prefer SHALLOW (1-3 layers), wider nets with GELU/SiLU and fewer LN: shallower wins 21-5, less-LN 17-6, smooth activation 16/16. When Δ<0.1 the normal rule holds (more LN 41-4, deeper 35-17). This 2-regime rule picks 26/32 tabular arch-only winners. XOR/spiral do NOT reverse.\n[K1010] XOR and two-spiral classification (zero linear   const sub = [["records", "解题 + 发现（逐题）"], ["summ", "总结者（逐轮）"], ["diff", "KB 变化"], ["sci", "科学总结"]];

}
function recordsTable(E) {

function turns(tr) {

}
function prettyArgs(a) {

}
function recordView(E, r) {

   <details><summary>题目全文（解题者看到的 user/system 原文）</summary><pre>${esc(r.question)}</pre></details></div>

   <details><summary>注入的 KB（快照 ${snap ? snap.label : "?"}，${snap ? snap.claims.filter(c => c[6]).length : "?"} 条，追加在 system prompt 后；内容为英文原文）</summary><pre>${linkC(snap ? snap.render : "")}</pre></details>
   ${r.solver_reasoning ? `<p><b>思维链（luna 为摘要标题，Qwen 为完整思维链）</b></p><pre>${esc(r.solver_reasoning)}</pre>` : `<p class="note">该调用没有返回思维链。</p>`}
   <p><b>完整输出</b> <span class="note">${r.solve_secs} 秒 · ${esc(JSON.stringify(r.solve_usage))}</span></p><pre>${linkC(r.solution)}</pre>

function summView(E) {

/* ---------------- KB diff / snapshot ---------------- */
function diffView(a, b, epoch) {
  const A = snapBy[a], B = snapBy[b];
  if (!A || !B) return `<div class="card">缺少快照 ${a} / ${b}</div>`;
  const ma = Object.fromEntries(A.claims.map(c => [c[0], c])), mb = Object.fromEntries(B.claims.map(c => [c[0], c]));
  const added = B.claims.filter(c => !ma[c[0]]), removed = A.claims.filter(c => !mb[c[0]]);
  const changed = B.claims.filter(c => ma[c[0]] && ma[c[0]][4] !== c[4]);
  const credit = B.claims.filter(c => ma[c[0]] && ma[c[0]][4] === c[4] && (ma[c[0]][1] !== c[1] || ma[c[0]][2] !== c[2]));
  const inR = B.claims.filter(c => c[6] && !(ma[c[0]] && ma[c[0]][6])), outR = A.claims.filter(c => c[6] && !(mb[c[0]] && mb[c[0]][6]));
  const row = (c, cls, extra = "") => `<tr class="${cls}"><td>${linkC(c[0])}</td><td>${c[1]}/${c[2]}</td><td>${c[3].toFixed(2)}</td><td>${extra}${esc(T(c[4]))}</td></tr>`;
  const tb = (rows) => `<table><tr><th>编号</th><th>胜/负</th><th>可信度</th><th>内容</th></tr>${rows || "<tr><td colspan=4>无</td></tr>"}</table>`;
  return `<div class="card kbc"><h3>KB 变化 ${a} → ${b}：${A.claims.length} → ${B.claims.length} 条</h3>
   <p>新增 ${added.length} · 删除或被合并 ${removed.length} · 文本改写 ${changed.length} · 仅胜负计数变化 ${credit.length} · 新进入解题者视野 ${inR.length} · 移出视野 ${outR.length}</p></div>
   <div class="card kbc"><h3>新增</h3>${tb(added.map(c => row(c, "add")).join(""))}</div>
   <div class="card kbc"><h3>删除 / 被合并</h3>${tb(removed.map(c => row(c, "del")).join(""))}</div>
   <div class="card kbc"><h3>文本改写（上：旧，下：新）</h3>${tb(changed.map(c => row(c, "chg", `<div class="note">${esc(T(ma[c[0]][4]))}</div><hr>`)).join(""))}</div>
   <div class="card kbc"><h3>引用记账（胜/负计数变化）</h3><table><tr><th>编号</th><th>之前</th><th>之后</th><th>可信度</th><th>内容</th></tr>${credit.map(c => `<tr><td>${linkC(c[0])}</td><td>${ma[c[0]][1]}/${ma[c[0]][2]}</td><td>${c[1]}/${c[2]}</td><td>${ma[c[0]][3].toFixed(2)}→${c[3].toFixed(2)}</td><td>${esc(T(c[4]).slice(0, 200))}</td></tr>`).join("")}</table></div>
   <div class="card kbc"><h3>解题者视野变化（下一轮注入的 50 条）</h3><p><b>进入</b></p>${tb(inR.map(c => row(c, "add")).join(""))}<p><b>掉出</b></p>${tb(outR.map(c => row(c, "del")).join(""))}</div>`;
}
function kbView() {
  $("side").innerHTML = D.snaps.map(s => `<div class="item ${s.label === state.snap ? "on" : ""}" onclick="state.snap='${s.label}';render()">${s.label} <small>${s.claims.length} 条</small></div>`).join("");
  const S = snapBy[state.snap];
  $("view").innerHTML = `<div class="sub"><button class="${state.sub !== "render" ? "on" : ""}" onclick="state.sub='table';render()">全部条目</button><button class="${state.sub === "render" ? "on" : ""}" onclick="state.sub='render';render()">解题者看到的 KB 原文</button></div>` +
    (state.sub === "render" ? `<div class="card solver"><h3>${S.label} 注入原文（下一轮解题者看到的）</h3><pre class="tall">${linkC(S.render)}</pre></div>` :
    `<div class="card kbc"><h3>${S.label}：${S.claims.length} 条，绿色左边线 = 在解题者视野中（${S.claims.filter(c => c[6]).length} 条）</h3>
     <input type="search" placeholder="搜索内容，例如 ReLU / SiLU / RMSprop" oninput="filt(this.value)">
     <table id="kbt"><tr><th>编号</th><th>可信度</th><th>胜/负</th><th>来源</th><th>内容</th></tr>${S.claims.slice().sort((x, y) => y[3] - x[3]).map(c =>
      `<tr class="${c[6] ? "shown" : ""}" data-t="${esc(T(c[4]).toLowerCase())}"><td>${linkC(c[0])}</td><td><span class="bar"><i style="width:${c[3] * 100}%"></i></span> ${c[3].toFixed(2)}</td><td>${c[1]}/${c[2]}</td><td>${c[5] ? "第 " + c[5] + " 轮" : "种子"}</td><td>${esc(T(c[4]))}</td></tr>`).join("")}</table></div>`);
}
function filt(v) { v = v.toLowerCase(); document.querySelectorAll("#kbt tr[data-t]").forEach(r => r.style.display = r.dataset.t.includes(v) ? "" : "none"); }

/* ---------------- claim history ---------------- */
let claimId = D.snaps.flatMap(s => s.claims)[0]?.[0] || "";
function goClaim(id) { claimId = id; state.tab = "claim"; render(); }
function openClaim(id, ev) {

  card.style.top = Math.min(Math.max((ev?.clientY ?? 80) - 60, 12), Math.max(innerHeight - hh - 12, 12)) + "px";
  card.scrollTop = 0;

document.addEventListener("keydown", e => { if (e.key === "Escape") closePop(); });
function claimView() {

/* ---------------- commits ---------------- */
function commitTable(cs) {
  if (!cs.length) return `<p class="note">无</p>`;
  return `<table><tr><th>commit</th><th>轮次</th><th>操作</th><th>条目</th><th>来源题</th><th>内容 / 理由</th></tr>${cs.map(c => {
    const p = c.payload || {};
    const body = (p.text ? `<b>新内容：</b> ${linkC(p.text)}<br>` : "") + (p.old_text ? `<span class="note"><b>旧内容：</b> ${esc(p.old_text)}</span><br>` : "") +
      (c.op === "credit" ? esc(JSON.stringify(p)) : "") + (c.reason ? `<b>理由：</b> ${linkC(c.reason)}` : "");
    return `<tr class="${c.op === "add" ? "add" : c.op === "delete" ? "del" : ["merge", "revise", "rollback"].includes(c.op) ? "chg" : ""}"><td>${c.commit}</td><td>${c.epoch}</td><td>${c.op}</td><td>${linkC((c.claim_ids || []).join(" "))}${c.new_id ? " → " + linkC(c.new_id) : ""}</td><td>${esc((c.source_question_ids || []).join(" "))}</td><td>${body}</td></tr>`;
  }).join("")}</table>`;
}
function commitView() {
  const ops = [...new Set(D.commits.map(c => c.op))];
  $("side").innerHTML = ["(结构操作)", ...ops].map(o => `<div class="item ${state.op === o ? "on" : ""}" onclick="state.op='${o}';render()">${o} <small>${o.startsWith("(") ? D.commits.filter(c => !["credit", "seed"].includes(c.op)).length : D.commits.filter(c => c.op === o).length}</small></div>`).join("");
  const o = state.op || "(结构操作)";
  const cs = o.startsWith("(") ? D.commits.filter(c => !["credit", "seed"].includes(c.op)) : D.commits.filter(c => c.op === o);
  $("view").innerHTML = `<div class="card"><h3>commit 日志 · ${o}（${cs.length} 条）</h3>${commitTable(cs)}</div>`;
}

function detail(S,id) {
  const raw=S.claimDetails?.[id]||{};
  const meta=Object.fromEntries(Object.entries(raw).filter(([k,v])=>!['text_excerpt','text_complete','text','id','support_count','failure_count','credibility'].includes(k)&&v!=null&&v!==''&&(!Array.isArray(v)||v.length)&&(!(typeof v==='object'&&!Array.isArray(v))||Object.keys(v).length)));
  const evidence=meta&&Object.keys(meta).length?'<details><summary>条件、机制与来源</summary><pre>'+linkC(JSON.stringify(meta,null,2))+'</pre></details>':'';
  return evidence+(raw.report_ids||[]).map(rid=>reportView(S.reports?.[rid])).join('');
}

function reportView(version) {
  const R=D.reports?.[version];
  if(!R)return '';
  const code=Object.entries(R.files||{}).map(([name,f])=>'<a href="'+esc(encodeURI(f.url))+'">'+esc(name)+'</a>').join(' · ');
  return '<details><summary>'+esc(R.id+' · '+R.title)+'</summary><p class="note">发起轮 e'+R.origin_epoch+' · '+esc(R.job_id||'')+' · repo commit '+esc(R.repo_commit)+(R.application_pending?' · 已保存报告，KB 操作待应用':'')+'</p>'+(code?'<p>'+code+'</p>':'')+'<pre class="tall">'+linkC(R.text||'未取得报告原文。')+'</pre></details>';
}

function jobView(jobs) {
  return jobs?.length?table(['任务','角色','发起轮','本轮成员','状态'],jobs.map(j=>'<tr>'+td(esc(j.id))+td(esc(j.kind))+td(j.origin_epoch)+td(esc(j.label||'e'+j.member_epoch))+td(esc(j.status))+'</tr>').join('')):'';
}

function kbView() {
  $('side').innerHTML=D.snaps.map(s=>'<div class="item '+(s.label===state.snap?'on':'')+'" onclick="state.snap=\''+s.label+'\';render()">'+esc(s.label)+' <small>'+(s.totalClaims??s.claims.length)+' 条'+(s.complete===false?' · 摘录':'')+'</small></div>').join('');
  const S=snapBy[state.snap];
  if(!S){$('view').innerHTML=card('未取得此快照','');return;}
  let h='<div class="sub"><button onclick="state.sub=\'table\';render()">全部条目</button><button onclick="state.sub=\'render\';render()">'+(isTool?'可检索的 KB 原文':'解题者看到的 KB 原文')+'</button></div>';
  h+=card(esc(S.label)+' · '+(S.totalClaims??S.claims.length)+' 条'+(S.complete===false?'（摘录）':''),'<p>'+esc(S.note||(S.complete===false?'这里只保存了输出摘录，尚未取得完整快照。':''))+'</p>'+(isTool?'<p class="note">本实验通过工具读取条目；完整 KB 没有常驻解题 prompt。</p>':''),'kbc');
  if(state.sub==='render') h+=card('KB 原文','<pre class="tall">'+linkC(S.render||'未取得原文。')+'</pre>','solver');
  else if(S.claims.length) h+=card('条目内容','<input type="search" placeholder="搜索：LayerNorm / width / Adam" oninput="filt(this.value)">'+table(['编号','引用反馈','胜 / 负','来源','条目正文'],S.claims.map(c=>'<tr data-t="'+esc(T(c[4]).toLowerCase())+'">'+td(linkC(c[0]))+td(num(c[3],2))+td((c[1]??'—')+' / '+(c[2]??'—'))+td(c[5]==null?'—':c[5]?'第 '+c[5]+' 轮':'种子')+td(esc(T(c[4]))+(S.excerptIds?.includes(c[0])?'<div class="note">保存的输出在此截断；未取得完整条目。</div>':'')+detail(S,c[0]))+'</tr>').join('')).replace('<table>','<table id="kbt">')+'<p class="note">引用反馈是解题使用后的表现记账，不是规律真实的概率。</p>','kbc');
  if(S.changeReasons)h+=card('该轮修改理由（保存原文）','<pre class="tall">'+linkC(S.changeReasons)+'</pre>','summ');
  if(state.snap===D.defaultSnap&&Object.keys(D.latest_saved_science||{}).length)h+='<details><summary>最新已保存的 science</summary><p class="note">持续研究的报告版本；KB 修改仍按应用日志登记。历史解题保留各自冻结版本。</p>'+Object.values(D.latest_saved_science).map(reportView).join('')+'</details>';
  $('view').innerHTML=h;
}

function epochView() {
  const E=D.epochs.find(e=>e.epoch===state.epoch)||D.epochs[0];
  if(!E){$('side').innerHTML='';$('view').innerHTML=card('逐轮记录','未取得逐轮记录。');return;}
  const subs=[['records','解题 + 发现（逐题）'],['summ','总结者（逐轮）'],['diff','KB 变化'],['sci','科学总结']];
  if(!subs.some(([k])=>k===state.sub))state.sub='records';
  $('side').innerHTML=D.epochs.map(e=>'<div class="item '+(e.epoch===E.epoch?'on':'')+'" onclick="state.epoch='+e.epoch+';state.q=null;render()">第 '+e.epoch+' 轮 <small>均分 '+num(e.metrics?.mean_score,2)+'</small></div>').join('')+(state.sub==='records'?E.records.map((r,i)=>'<div class="item '+(state.q===i?'on':'')+'" onclick="state.q='+i+';render()">'+esc(r.question_id)+' '+scoreTag(r.score)+'<br><small>'+esc(r.source)+' · '+esc(r.family)+'</small></div>').join(''):'');
  let h='<div class="sub">'+subs.map(([k,v])=>'<button class="'+(state.sub===k?'on':'')+'" onclick="state.sub=\''+k+'\';render()">'+v+'</button>').join('')+'</div>';
  if(state.sub==='records')h+=E.records.length?state.q==null?recordsTable(E):recordView(E,E.records[state.q]):card('逐题记录',esc(E.recordNote||'未取得本轮逐题解题与发现轨迹。'));
  if(state.sub==='summ')h+=summView(E)+(E.summarizerNote?'<p class="note">'+esc(E.summarizerNote)+'</p>':'')+(E.research||[]).map(r=>card(esc(r.file),'<pre>'+esc(r.text||JSON.stringify(r.data,null,2))+'</pre>')).join('')+(E.jobs||[]).filter(j=>j.kind==='research').map(j=>card(esc(j.id)+' · 研究工具日志',turns(D.job_traces?.[j.id]||[]))).join('');
  if(state.sub==='diff')h+=diffView(lab(E.epoch-1),lab(E.epoch));
  if(state.sub==='sci')h+=card('科学总结 · 第 '+E.epoch+' 轮','<pre class="tall">'+linkC(E.science||(E.scienceError?'本轮科学总结未保存成功。':'未取得科学总结原文。'))+'</pre>'+(E.scienceError?'<details><summary>运行错误原文</summary><pre>'+esc(E.scienceError)+'</pre></details>':'')+jobView(E.jobs)+(Object.keys(D.reports||{}).filter(v=>D.reports[v].origin_epoch===E.epoch).map(reportView).join('')),'summ');
  $('view').innerHTML=h;
}

function recordView(E,r) {
  const S=snapBy[r.solver_snapshot||lab(E.epoch-1)], ids=[...new Set([...(r.kb_retrieved||[]),...(r.cited||[])])];
  const brief=(D.config.progressive_disclosure||D.config.render==='brief')?'完整简洁 KB；science 按需展开':isTool?'可选 KB 工具检索':'只读 KB 注入';
  const reportVersions=Object.entries(r.report_versions||{}).map(([id,commit])=>reportView(id+'@'+commit)).join('');
  const rows=ids.map(id=>{const c=S?.claims.find(z=>z[0]===id);return '<tr>'+td(linkC(id))+td(c?esc(T(c[4]))+detail(S,id):'未取得解题时该条目的原文。')+'</tr>';}).join('');
  return card(esc(r.question_id)+' · '+esc(r.source)+' · '+esc(r.family),scoreTag(r.score)+' 预测 <b>'+esc(r.prediction)+'</b> · 答案 <b>'+esc(r.answer)+'</b><details><summary>题目全文</summary><pre>'+esc(r.question)+'</pre></details>')+
    card('① 解题 agent（effort='+(D.config.solve_effort||'low')+'）','<p>'+brief+' · 冻结快照 '+esc(r.solver_snapshot||S?.label||'未取得')+'</p>'+(r.kb_queries?.length?'<pre>'+esc(JSON.stringify(r.kb_queries,null,2))+'</pre>':'')+(r.solver_reasoning?'<details><summary>返回的推理摘要</summary><pre>'+esc(r.solver_reasoning)+'</pre></details>':'')+'<p><b>完整输出</b></p><pre>'+linkC(r.solution||'未取得完整输出。')+'</pre>'+(r.solve_trace?.length?turns(r.solve_trace):'')+table(['检索 / 引用 ID','解题时内容'],rows||'<tr><td colspan=2>没有检索或引用记录。</td></tr>')+(reportVersions?'<details><summary>解题时的 science 版本</summary>'+reportVersions+'</details>':''),'solver')+
    card('② 发现 agent（effort='+esc(r.discover_effort)+'）',turns(r.discover_trace||[])+'<p><b>评论</b></p><pre>'+linkC(r.comment||'—')+'</pre><p><b>猜想</b></p><pre>'+linkC(r.hypothesis||'—')+'</pre>','disc');
}

function diffView(a,b) {
  const A=snapBy[a],B=snapBy[b];
  if(!A||!B||A.complete===false||B.complete===false)return card('KB 变化','需要两份完整快照才能比较 '+esc(a)+' → '+esc(b)+'。当前摘录不用于推算增删。');
  const ma=Object.fromEntries(A.claims.map(c=>[c[0],c])),mb=Object.fromEntries(B.claims.map(c=>[c[0],c]));
  const groups=[['新增',B.claims.filter(c=>!ma[c[0]])],['删除 / 被合并',A.claims.filter(c=>!mb[c[0]])],['文本改写',B.claims.filter(c=>ma[c[0]]&&ma[c[0]][4]!==c[4])]];
  return card('KB 变化 '+esc(a)+' → '+esc(b),A.claims.length+' → '+B.claims.length+' 条','kbc')+groups.map(([title,cs])=>card(title+'（'+cs.length+'）',table(['编号','内容'],cs.map(c=>'<tr>'+td(linkC(c[0]))+td((title==='文本改写'?'<div class="note">'+esc(T(ma[c[0]][4]))+'</div><hr>':'')+esc(T(c[4])))+'</tr>').join('')||'<tr><td colspan=2>无</td></tr>'),'kbc')).join('');
}

function claimRows(id) {
  let last=null;
  return D.snaps.map(S=>{
    const c=S.claims.find(z=>z[0]===id);
    if(!c)return '<tr>'+td(esc(S.label))+'<td colspan=3>'+(S.complete===false?'摘录中未出现，不能判断是否存在。':'不存在')+'</td></tr>';
    const content=c[4]!==last?esc(T(c[4]))+detail(S,id):'<span class="note">文本同上</span>';last=c[4];
    return '<tr>'+td(esc(S.label))+td((c[1]??'—')+' / '+(c[2]??'—'))+td(num(c[3],2))+td(content+(S.excerptIds?.includes(id)?'<p class="note">此条原文被截断。</p>':''))+'</tr>';
  }).join('');
}
function claimView() {
  const ids=[...new Set(D.snaps.flatMap(s=>s.claims.map(c=>c[0])))].sort();
  $('side').innerHTML='<div style="padding:6px"><input type="search" placeholder="K1006" onchange="goClaim(this.value.trim().toUpperCase())"></div>'+ids.map(id=>'<div class="item '+(id===claimId?'on':'')+'" onclick="goClaim(\''+id+'\')">'+id+'</div>').join('');
  const cs=D.commits.filter(c=>(c.claim_ids||[]).includes(claimId)||c.new_id===claimId);
  $('view').innerHTML=card(esc(claimId)+' 在各快照中的状态',table(['快照','胜 / 负','引用反馈','内容'],claimRows(claimId)),'kbc')+card('相关操作',commitTable(cs),'summ');
}
function openClaim(id,ev) {
  const cs=D.commits.filter(c=>c.op!=='credit'&&((c.claim_ids||[]).includes(id)||c.new_id===id));
  $('popc').innerHTML='<h3>'+esc(id)+' '+anchor('查看演化 →','closePop();goClaim(\''+id+'\')')+'<button id="popx" onclick="closePop()">关闭 ×</button></h3>'+table(['快照','胜 / 负','引用反馈','内容'],claimRows(id))+'<h3>相关操作</h3>'+commitTable(cs);
  $('pop').style.display='block';$('popc').style.left=Math.max(12,(innerWidth-$('popc').offsetWidth)/2)+'px';$('popc').style.top='6vh';$('popc').scrollTop=0;
}

function summView(E) {
  const ops=D.commits.filter(c=>(c.origin_epoch??c.epoch)===E.epoch&&!['credit','seed'].includes(c.op));
  return card('③ 总结者 · 第 '+E.epoch+' 轮','<p>保存的 KB 操作理由</p>'+commitTable(ops)+(E.summarizer.length?turns(E.summarizer):'<p class="note">未取得逐步工具轨迹；不能据此判断调用次数。</p>'),'summ');
}

function commitTable(cs) {
  if(!cs.length)return '<p class="note">无</p>';
  return table(['commit','所属轮 / 应用轮','操作','条目','内容 / 理由'],cs.map(c=>{
    const op=c.payload?.operation||c, p=op.payload||{};
    const body=(p.text?'<b>新内容：</b> '+linkC(p.text)+'<br>':'')+(p.old_text?'<span class="note">旧内容：</span> '+esc(p.old_text)+'<br>':'')+linkC(op.reason||c.reason||'')+(c.payload?.conflicts?.length?'<pre>'+esc(JSON.stringify(c.payload.conflicts))+'</pre>':'');
    return '<tr>'+td(esc(c.commit))+td('e'+(c.origin_epoch??c.epoch)+' / e'+(c.applied_epoch??c.epoch))+td(esc(c.op=== 'async_apply'?'async_apply · '+op.op:c.op))+td(linkC((op.claim_ids||[]).join(' ')))+td(body)+'</tr>';
  }).join(''));
}

function promptView() {
  $('side').innerHTML='';
  $('view').innerHTML=(D.settingURL?'<p><a href="'+esc(D.settingURL)+'">当前 setting</a></p>':'')+Object.entries(D.prompts).map(([k,v])=>card(esc(k),'<pre class="tall">'+esc(v)+'</pre>')).join('')+card('运行配置','<pre>'+esc(JSON.stringify(D.config,null,1))+'</pre>');
}

render();
</script>
</body>
</html>
