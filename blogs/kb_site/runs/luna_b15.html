) suffers gradient magnitude collapse near chance initialization (cross-entropy CE ≈ ln(2) ≈ 0.693), producing negligible cumulative parameter displacement despite a high nominal effective learning rate (lr / (1 - momentum) ~ 0.03); sign-normalized adaptive optimizers (Adam at lr ~ 3e-3) maintain per-step updates of scale ~lr, yielding stable cumulative displacement ~lr * T (~3.0) sufficient to escape the chance plateau and fit non-linear decision boundaries.", "For first-order bigram language modeling under short step budgets (T <= ~256 steps), recurrent architectures (such as GRUs with hidden size >= ~64) provide direct parameter capacity to encode vocabulary transition matrices (size V x V), outperforming shallow transformers (depth <= 3) under displacement-limited optimization where constrained parameter updates prevent multi-head self-attention and feedforward layers from efficiently constructing the full token co-occurrence table.", "When fitting smooth periodic or oscillatory regression targets under limited step budgets (T <= ~512 steps), smooth non-monotonic activations (GELU, SiLU) achieve lower test MSE than piecewise-linear activations with derivative discontinuities (such as LeakyReLU), because activation smoothness enables networks to represent continuous higher-order target curvature with higher parameter efficiency than linear spline approximations.", "On pure bigram language modeling tasks where only the immediately preceding token determines the next-token distribution, shallow transformer architectures (1-2 layers) achieve faster cross-entropy reduction under short step budgets (T <= ~500 steps) than deep architectures (3-4 layers), because the target transition law is representable as a direct token-embedding lookup table, making additional layers introduce unnecessary gradient path length and parameter displacement requirements without representational benefit.", "On bigram language modeling tasks under moderate step budgets (T ~ 512 steps), learning fixed transition matrices requires sufficient cumulative parameter displacement in token embeddings and output heads; RMSprop at moderate learning rates (lr ~ 3e-4) achieves enhanced early displacement via zero-initialized square-gradient accumulator amplification (~10x effective step size decay over early steps), outperforming smaller learning rate adaptive optimizers (lr <= ~1e-4) and unaccelerated SGD.", "On non-linear univariate regression tasks under short step budgets (T <= ~256 steps) with unaccelerated SGD at moderate learning rates (lr ~ 3e-3), residual connections enable deeper MLPs (depth >= 4) to achieve lower test MSE than shallower non-residual MLPs (depth 2-3), because identity shortcuts preserve direct gradient pathways (~lr * T * ||grad||) across all layers, preventing the compounding gradient attenuation through sequential weight matrices that restricts early-layer parameter displacement in non-residual networks.", "On smooth additive non-linear classification tasks under moderate step budgets (T ~ 1000 steps) with Adagrad, complete LayerNorm coverage across all residual blocks provides superior gradient stability compared to partial normalization, enabling deeper residual architectures (depth ~ 5 blocks) to achieve lower test cross-entropy than shallower wider networks (depth ~ 2 blocks) despite reduced layer width.", "On bigram language modeling tasks where the target distribution depends strictly on immediate preceding tokens P(y_t | x_{t-1}), recurrent architectures (such as 2-layer GRUs) achieve superior sample efficiency and faster convergence under short step budgets (T <= ~512 steps) compared to transformer architectures, because recurrent hidden state propagation directly captures single-step temporal lookup without requiring learned positional encodings or attention patterns.", "On complex multivariate regression targets with multiplicative and non-linear interactions under moderate step budgets (T ~ 512 steps), RMSprop at standard -4, displacement ~0.02, or momentum SGD with suppressed initial gradients).", "For stationary bigram next-token prediction under moderate step budgets (T ~ 1000 steps), unaccelerated SGD at standard learning rates (lr ~ 3e-3) achieves cumulative parameter displacement of ~lr * T ≈ 3.0, providing sufficient gradient-driven displacement to fit token transition statistics, whereas SGD with momentum at severely reduced base learning rates (lr <= 3e-5, effective lr ~ 3e-4) restricts cumulative displacement to ~0.3, leaving cross-entropy optimization under-converged.", "In causal transformer language models trained on fixed bigram next-token prediction tasks, architectural capacity beyond a baseline threshold (such as 2 vs 4 attention heads or 3 vs 4 layers when total parameter count substantially exceeds vocab_size^2) has a negligible impact on test cross-entropy compared to optimizer parameter displacement, as learning the transition matrix depends primarily on step size rather than excess model depth or head multi-branching.", "On smooth univariate periodic regression tasks under short step budgets (T <= ~256 steps) and small learning rates (lr ~ 1e-4), wider shallow MLPs (depth 2, width 128) equipped with LayerNorm and non-dying activations (LeakyReLU) achieve lower test MSE than deeper narrower MLPs (depth 3, width 64), because greater width increases per-layer representational capacity while shorter depth avoids backpropagation gradient attenuation under limited optimization horizons.", "On continuous regression tasks under limited step budgets (T <= ~256 steps), combining LayerNorm with LeakyReLU activation maintains gradient stability and prevents dead units relative to unnormalized ReLU networks, enabling more consistent per-step parameter updates and lower test MSE across optimization trajectories.", "On short step budgets (T <= ~256 steps) fitting complex non-linear decision boundaries, un-bias-corrected RMSprop at small learning rates (lr ~ 1e-4, alpha ~ 0.99) (lr ~ 1e-4, displacement ~0.1) and displacement-capped optimizers like Adagrad (~2 * lr * sqrt(T) ≈ 0.19).", "Under extreme displacement limitation (cumulative parameter displacement lr * T <= ~0.01) where networks remain trapped near initialization, candidate ranking among residual architectures is governed by gradient flow efficiency: shallow residual MLPs (depth 2-3) achieve lower test loss than deeper residual MLPs (depth >= 5) because backpropagated gradients suffer less cumulative attenuation across fewer layers, whereas deep non-residual MLPs fail entirely due to severe unnormalized gradient decay.", "On smooth 1D periodic regression tasks (e.g., cos(2*pi*x)) under short step budgets (T <= ~256 steps) with adaptive optimizers at standard learning rates (lr ~ 1e-3), shallow non-residual MLPs (2 hidden layers) achieve lower test MSE than single-layer residual MLPs of equal or greater width, because the residual addition pattern (h_out = act(h_in + Linear(norm(h_in)))) constrains hidden representations to additive perturbations of input states, whereas unrestricted feedforward layers can construct the independent phase-shifted oscillatory features required for periodic targets.", "On bigram language modeling tasks with small vocabulary (V ~ 48) under short step budgets (T <= ~256 steps), transformer architectures with depth >= 1 and width d_model >= 64 provide sufficient representational capacity to learn token transition tables P(y|x), rendering architectural variations (depth 1-4, width 64-128) secondary to cumulative parameter displacement in candidate ranking.", "On highly non-linear classification tasks with zero linear baseline signal (such as two-spirals) under short step budgets (T <= ~256 steps), candidate ranking requires both sufficient architectural depth with residual connections and sign-normalized adaptive optimization (RMSprop or Adam achieving cumulative displacement ~lr * T); unaccelerated SGD stalls near chance loss (CE ≈ ln 2) due to near-zero raw gradients regardless of depth, while Adagrad remains displacement-limited (~2 * lr * sqrt(T)).", "On complex univariate oscillatory regression targets (such as frequency-modulated sine waves) under moderate step budgets (T ~ 1000 steps) with identical optimizer displacement (~lr * T ≈ 0.1), single-hidden-layer networks remain representational-capacity-limited even with residual connections; deeper architectures with adequate LayerNorm coverage (depth >= 2) outperform shallow networks by enabling multi-scale feature composition.", "Under displacement-limited Adagrad optimization (cumulative displacement ~2 * lr * sqrt(T) <= ~0.05) on piecewise linear decision boundaries, fitting conditional gating structures requires sufficient architectural depth (depth >= 4 hidden layers); alternating LayerNorm preserves gradient scale through depth, enabling deeper narrower networks to outperform shallower wider networks by maintaining per-layer parameter updates despite step-size decay.", "On smooth non-linear classification tasks with mixed polynomial and oscillatory feature structure under short step budgets (T <= ~256 steps) trained with AdamW at standard learning rates (lr ~ 1e-3, cumulative displacement ~lr * T ≈ 0.26), moderately wide shallow MLPs (width 24-32, depth 2-3) achieve lower test cross-entropy than narrow deep networks (width <= 16, depth >= 5) or single-layer networks of comparable parameter count, because moderate width provides sufficient parallel capacity to simultaneously fit independent non-linear coordinate components while short depth preserves gradient flow without composition bottlenecks.", "On univariate piecewise-smooth regression tasks containing localized gradient discontinuities (such as absolute-value kinks) under short step budgets (T <= ~512 steps) trained with SGD with momentum at moderate learning rates (lr ~ 3e-4), shallow non-residual MLPs (1-2 hidden layers) achieve lower test MSE than shallow residual MLPs of equal width, because residual shortcut connections constrain hidden representations to additive perturbations of input states, whereas unrestricted feedforward layers can directly form localized non-linear basis functions to fit non-smooth target features.", "On tabular classification tasks with smooth additive non-linear target structure under moderate step budgets (T ~ 1024 steps) trained with AdamW at standard learning rates (lr ~ 3e-3), intermediate-width shallow MLPs (width ~64, depth 2 hidden layers) achieve lower test cross-entropy than narrow deep MLPs (width ~32, depth >= 5 hidden layers) of comparable parameter count, because fitting independent coordinate-wise non-linear features benefits from representational width, whereas deep compositions spread gradient updates across many layers, requiring larger per-layer cumulative displacement to achieve effective convergence.", "On non-linear classification tasks requiring multiplicative feature interactions (such as XOR) under moderate step budgets (T ~ 2000 steps), Adagrad requires a learning rate lr >= ~3e-4 to achieve cumulative parameter displacement (~2 * lr * sqrt(T) ≈ 0.027) sufficient to escape chance loss plateaus (CE ≈ 0.693), whereas Adagrad at undersized learning rates (lr <= 1e-4, cumulative displacement <= ~0.009) leaves parameters trapped near initialization.", "For causal transformer language models trained on fixed Markov chain bigram prediction under moderate step budgets (T ~ 1024 steps), model capacity differences (e.g., 1-layer d_model=128 vs multi-layer d_model=64) exert secondary influence on test cross-entropy compared to optimizer cumulative displacement (~lr * T for Adam vs ~2 * lr * sqrt(T) for Adagrad), as all candidate architectures possess sufficient representational capacity to memorize small transition tables (e.g., 24x24), making optimization efficiency the dominant candidate ranking factor.", "On continuous multivariate regression tasks combining periodic and linear target components under moderate step budgets (T ~ 512 steps), sign-normalizing optimizers (AdamW) at standard learning rates (lr ~ 3e-3) achieve cumulative parameter displacement ~lr * T (~1.5), enabling sufficient exploration to fit both oscillatory and linear structure; RMSprop at the same learning rate achieves comparable early displacement via zero-initialized accumulator amplification (~1/sqrt(1-alpha) early step boost) but can exhibit convergence instability, whereas unaccelerated SGD at small learning rates (lr ~ 3e-4) yields negligible displacement (~0.15) and leaves parameters under-trained near initialization.", "On classification tasks with zero linear baseline signal (such as XOR) under short step budgets (T <= ~256 steps) at severely undersized learning rates (lr <= ~3e-5), sign-normalizing optimizers (Adam/AdamW) achieve cumulative parameter displacement ~lr * T (~0.008), which provides an ~8x displacement advantage over Adagrad (~2 * lr * sqrt(T) ≈ 0.001); this additional movement enables the network to begin forming multiplicative feature interactions and escape the chance loss plateau (CE ≈ ln(2) ≈ 0.693), whereas Adagrad remains trapped near initialization.", "On complex multivariate regression tasks combining polynomial and oscillatory target interactions under short step budgets (T <= ~256 steps), fitting non-linear multiplicative structure requires cumulative parameter displacement exceeding ~0.5; RMSprop at standard learning rates (lr ~ 3e-3) achieves this required displacement threshold via zero-initialized accumulator amplification (~lr * T / sqrt(1 - alpha) > 0.77), outperforming undersized AdamW (lr <= ~1e-4, displacement ~0.025) and unaccelerated SGD (lr <= ~3e-4, displacement ~0.077) which remain trapped near initialization.", "On classification tasks with zero linear baseline signal and high-curvature decision boundaries (such as two-spiral patterns) under short step budgets (T <= ~256 steps), sign-normalizing adaptive optimizers (Adam/AdamW) at moderate learning rates ( gets (T <= ~512 steps), sign-normalizing adaptive optimizers (Adam or RMSprop at lr ~ 1e-4) maintain stable per-parameter step sizes yielding cumulative displacement ~lr * T (~0.05) sufficient to fit transition probabilities, whereas SGD with momentum at moderate learning rates (lr ~ 3e-4) suffers from decaying cross-entropy gradient magnitudes during convergence, restricting total parameter movement and leaving test cross-entropy elevated.", "On sequence modeling tasks involving simple transition dynamics (such as learning a fixed bigram transition matrix) under short step budgets (T ~ 512 steps), convergence is dominated by optimizer learning rate and adaptive updates rather than model depth or width; among adaptive optimizers at the same learning rate (lr ~ 1e-4), architectural variations (2-layer vs 3-layer transformers, d_ff = 64 to 256) yield statistically indistinguishable cross-entropy because the task is solved primarily by embedding table movement rather than deep hierarchical feature extraction.", "On non-linear classification tasks with high-curvature decision boundaries (such as the two-spiral problem) under short step budgets (T <= ~256 steps), carving the boundary requires cumulative parameter displacement >= ~0.2; RMSprop at lr ~ 1e-3 achieves effective cumulative displacement of ~0.25-0.40 due to early-step accumulator amplification (~10x step-size boost over initial steps), whereas Adam at undersized learning rates (lr <= ~1e-4) restricts cumulative displacement (~lr * T ≈ 0.026), leaving parameters trapped near the chance loss plateau (CE ≈ ln(2) ≈ 0.693).", "On zero-linear-signal classification tasks requiring multiplicative feature interactions (such as XOR) under short step budgets (T <= ~256 steps), unaccelerated SGD at small learning rates (lr ~ 3e-4) yields cumulative parameter displacement ~lr * T * ||grad|| of only ~0.001-0.01 because raw gradients remain near zero on the chance loss plateau; this movement falls well below the threshold (~0.1-1.0) needed to form multiplicative interactions, leaving models stuck near chance cross-entropy (CE ≈ ln(2) ≈ 0.693) regardless of architectural depth, width, or normalization.", "When all candidate architectures sharing an optimizer configuration stall near the chance loss plateau (CE ≈ ln(2)) due to insufficient cumulative parameter displacement, performance ranking degenerates to random initialization variance across seeds; shallower architectures (e.g., 3 layers vs 5 layers) may exhibit marginally lower loss variance due to fewer parameter initialization samples, but mean loss differences remain within measurement noise (~0.001 cross-entropy).", "In multi-seed benchmark evaluations under short step budgets, architectural candidates that differ only by activations operating near-identically in the active regime (such as ReLU vs LeakyReLU with slope 0.01 in residual streams with predominantly positive pre-activations) produce statistically indistinguishable mean metrics; candidate ranking is instead governed by structural differences in layer normalization or feature representation.", "On low-dimensional piecewise-linear classification tasks (such as a single boundary kink over 4 input features) under short step budgets (T <= ~256 steps), convergence speed is governed by intermediate feature conditioning; inserting LayerNorm before the final hidden layer maintains feature and gradient scales of order ~O(1), ensuring effective parameter displacement (~lr * T) is spent on discriminative directions, whereas un-normalized ReLU residual stacks accumulate large common-mode positive offsets that shift logits equally and consume parameter movement without improving class separation.", "For low-dimensional classification tasks requiring localized boundary fitting, shallow plain MLPs (2 hidden layers) can converge faster than residual architectures (3 residual blocks) under short step budgets (T <= ~256 steps); the additive-perturbation constraint of un-normalized residual blocks can restrict the rapid formation of independent hidden feature directions necessary to represent boundary non-linearities.", "On highly non-linear binary classification tasks (such as two-spirals) under short step budgets (T <= ~256 steps), AdamW at standard learning rates (lr ~ 1e-3) with LayerNorm residual MLPs achieves cumulative parameter displacement (~lr * T ≈ 0.26) sufficient to escape the chance loss plateau (CE ≈ ln(2) ≈ 0.693), whereas Adagrad even at moderate learning rates (lr <= ~3e-3) is capped by accumulator decay to cumulative displacement ~2 * lr * sqrt(T) <= ~0.10 (and ~0.01 at lr ~ 3e-4), leaving parameters trapped near initialization.", "Under default linear initialization, unnormalized ReLU residual blocks (h_out = relu(h_in + Linear(h_in))) preserve and accumulate positive mean activations across depth to yield last-hidden activation sums sum_i |h_i| ~ 0.3 * width, whereas LayerNorm-then-Linear residual blocks constrain pre-activation variance to yield sum_i |h_i| ~ 0.17 * width (for ReLU) or less (for GELU); under displacement-limited optimization, this ~2x feature-norm gap directly scales achievable output displacement per unit weight step.", "Under short step budgets (T <= ~256 steps) with identical model architectures, candidate ranking across sign-normalizing adaptive optimizers (Adam, RMSprop) is dominated by cumulative parameter displacement (~lr * T); an optimizer at lr ~ 1e-3 achieves ~10-30x greater total displacement than one at lr <= 1e-4, and transient early-step accumulator warm-up amplification in RMSprop (~1/sqrt(1-alpha) ≈ 2-3x) is insufficient to overcome a 10x+ learning rate deficit.", "When training residual MLP architectures under severely constrained cumulative parameter displacement (lr * T << 1/sqrt(fan_in)), LeakyReLU(0.01) maintains a larger pre-head activation second moment than GELU by preserving negative and near-zero activations, providing greater logit displacement per unit weight movement and lower cross-entropy when models remain trapped near initialization.", "Under short step budgets (T <= ~512 steps) on under-trained non-linear classification tasks, candidate ranking within the Adagrad optimizer family scales monotonically with learning rate up to the numerical stability threshold (lr ~ 3e-3 on width-192 residual MLPs), where zero-initialized accumulators yield cumulative parameter displacement of ~2 * lr * sqrt(T), providing ~3x greater weight movement than standard learning rates (lr ~ 1e-3).", "For first-order bigram next-token prediction under short step budgets (T <= ~500 steps), shallower transformers (2 layers) with wider embedding dimensions fit the bigram transition table faster than deeper stacks (3-4 layers), because deeper architectures lengthen the embedding-to-head signal path and consume parameter displacement across unnecessary intermediate layers.", "With PyTorch default Linear init (U(-1/sqrt(fan_in), 1/sqrt(fan_in))), a non-residual MLP without normalization shrinks activation RMS by a factor ~1/sqrt(3) ≈ 0.577 per hidden layer (plus a further ~0.5-0.7 from a zero-centered activation), so after 3-4 stacked width-192 layers the last-hidden feature RMS falls to ~0.01-0.05; inserting LayerNorm before each Linear restores per-layer feature RMS to O(0.3-0.4), increasing achievable output-head logit movement (~displacement * sum_i |h_i|) by an order of magnitude under displacement-limited optimizers.", "For 1-D regression targets with amplitude |y| ~ 2 under Adagrad at lr ~ 3e-3 and T ~ 512 steps, per-parameter cumulative displacement is ~2*lr*sqrt(T) ≈ 0.14; a candidate can only reach the target amplitude if displacement * sum_i |h_i| (last-hidden feature L1 norm) exceeds max|y|, which rules out architectures whose features have collapsed to RMS <= ~0.02.", "On multiplicative interaction classification tasks (e.g., s(x) = a·x_i·x_j + b·x_k·x_l) under short step budgets (T <= ~256 steps) with unaccelerated SGD at small learning rates (lr ~ 1e-4), res (2-3 total linear layers) with moderate width (128) achieve better generalization than deeper narrow networks (6 layers, width 64) because under displacement-limited regimes, deeper networks dilute per-layer parameter updates and require more cumulative displacement to propagate effective feature changes from input to output.", "RMSprop (zero-initialized squared-gradient accumulator, alpha=0.99) behaves like a sign-normalized optimizer with per-step displacement ~lr, giving cumulative displacement ~lr*T, i.e. the same scaling as Adam/AdamW; when its learning rate exceeds a competing AdamW run by ~10x, RMSprop wins under identical architecture and short-to-moderate step budgets (T ~ 1e3).", "Under displacement-limited optimization (such as Adagrad where cumulative per-parameter displacement scales as ~2 * lr * sqrt(T)), shallower architectures (3 hidden layers vs 5) with wider final hidden layers (width >= 96 vs <= 64) achieve faster MSE reduction on smooth low-dimensional regression targets, because fewer composed layers minimize per-layer gradient dilution while larger last-hidden feature norms (sum_i |h_i|) maximize output movement per unit displacement, dominating activation function variations.", "For 1-D regression targets with smooth oscillatory functions (such as quadratic plus cosine components), smooth activations (GELU) with wider hidden layers (width >= 32) achieve faster MSE reduction than narrower piecewise-linear activations (width <= 24 with ReLU or LeakyReLU), because smooth nonlinearities require fewer hidden units per oscillation period to approximate continuous target curvature.", "On 1-D regression tasks with target amplitudes significantly exceeding unit variance (|y| >= ~2), unnormalized residual MLPs allow activation and output scales to grow unconstrained to match target range, whereas intermediate LayerNorm forces hidden representations to unit variance and restricts output scale expansion under SGD optimization (T <= ~2000 steps).", "Un function recordsTable(E) {
  return `<div class="card"><h3>第 ${E.epoch} 轮：${E.records.length} 题（点左侧或下表查看完整内容）</h3><table><tr><th>题号</th><th>题源</th><th>得分</th><th>预测 / 答案</th><th>引用</th><th>发现阶段</th><th>评论</th></tr>${E.records.map((r, i) =>
    `<tr><td><a href="#" onclick="state.q=${i};render();return false">${r.question_id}</a></td><td>${r.source}</td><td>${scoreTag(r.score)}</td><td>${esc(r.prediction)}<br><small>${esc(r.answer)}</small></td><td>${linkC((r.cited || []).join(" "))}</td><td>${r.discover_effort}${r.skipped ? " 跳过" : ""} · ${r.discover_trace.length} 轮${r.hypothesis ? " · <b>有猜想</b>" : ""}</td><td>${esc(r.comment || "")}</td></tr>`).join("")}</table></div>`;
}
function turns(tr) {
  return tr.map(t => `<div class="turn"><b>第 ${t.turn + 1} 步</b> <span class="note">${t.secs ?? ""} 秒 · 输入 ${t.usage.prompt_tokens ?? "?"} token · 输出 ${t.usage.completion_tokens ?? "?"} token</span>
   ${t.reasoning ? `<details><summary>思维链</summary><pre>${esc(t.reasoning)}</pre></details>` : ""}
   ${t.content ? `<pre>${linkC(t.content)}</pre>` : ""}
   ${t.calls.map((c, j) => `<div class="call"><span class="nm">${esc(c.name)}</span><pre>${linkC(prettyArgs(c.arguments))}</pre><details ${j < 0 ? "open" : ""}><summary>工具返回</summary><pre>${linkC(t.results[j] ?? "")}</pre></details></div>`).join("")}</div>`).join("");
}
function prettyArgs(a) {
  try { const o = JSON.parse(a); if (o.code) return o.code + (Object.keys(o).length > 1 ? "\n# " + JSON.stringify({...o, code: undefined}) : ""); return JSON.stringify(o, null, 1); } catch (e) { return a; }
}
function recordView(E, r) {
  const snap = snapBy[lab(E.epoch - 1)];
  const cites = (r.cited || []).map(c => { const x = snap && snap.claims.find(z => z[0] === c); return x ? `<tr><td>${linkC(c)}</td><td>${x[3].toFixed(2)}</td><td>${x[1]}/${x[2]}</td><td>${esc(T(x[4]))}</td></tr>` : `<tr><td>${c}</td><td colspan=3>(不在快照中)</td></tr>`; }).join("");
  return `
  <div class="card"><h3>${r.question_id} · ${r.source} · ${r.task} · ${r.family}</h3>${scoreTag(r.score)} 预测 <b>${esc(r.prediction)}</b> · 答案 <b>${esc(r.answer)}</b>${r.inversions != null ? ` · 逆序对 ${r.inversions}` : ""}
   <details><summary>题目全文（解题者看到的 user/system 原文）</summary><pre>${esc(r.question)}</pre></details></div>
  <div class="card solver"><h3>① 解题 agent（effort=low，不给工具）</h3>
   <details><summary>注入的 KB（快照 ${snap ? snap.label : "?"}，${snap ? snap.claims.filter(c => c[6]).length : "?"} 条，追加在 system prompt 后；内容为英文原文）</summary><pre>${linkC(snap ? snap.render : "")}</pre></details>
   ${r.solver_reasoning ? `<p><b>思维链（luna 为摘要标题，Qwen 为完整思维链）</b></p><pre>${esc(r.solver_reasoning)}</pre>` : `<p class="note">该调用没有返回思维链。</p>`}
   <p><b>完整输出</b> <span class="note">${r.solve_secs} 秒 · ${esc(JSON.stringify(r.solve_usage))}</span></p><pre>${linkC(r.solution)}</pre>
   <p><b>引用的条目（解题时的状态）</b></p><table><tr><th>编号</th><th>可信度</th><th>胜/负</th><th>内容</th></tr>${cites || "<tr><td colspan=4>未引用</td></tr>"}</table></div>
  <div class="card disc"><h3>② 发现 agent（effort=${r.discover_effort}${r.skipped ? "，选择跳过" : ""}，${r.discover_trace.length} 轮）</h3>
   ${turns(r.discover_trace)}
   <p><b>评论（comment）</b></p><pre>${linkC(r.comment || "-")}</pre>
   <p><b>猜想（hypothesis）</b></p><pre>${linkC(r.hypothesis || "-")}</pre></div>`;
}
function summView(E) {
  const ops = D.commits.filter(c => c.epoch === E.epoch && !["credit", "seed"].includes(c.op));
  return `<div class="card summ"><h3>③ 总结者 · 第 ${E.epoch} 轮（${E.summarizer.length} 步，effort=xhigh）</h3>
   <p><b>本轮 KB 结构操作</b>（${ops.length}）</p>${commitTable(ops)}
   ${turns(E.summarizer)}</div>`;
}

/* ---------------- KB diff / snapshot ---------------- */
function diffView(a, b, epoch) {
  const A = snapBy[a], B = snapBy[b];
  if (!A || !B) return `<div class="card">缺少快照 ${a} / ${b}</div>`;
  const ma = Object.fromEntries(A.claims.map(c => [c[0], c])), mb = Object.fromEntries(B.claims.map(c => [c[0], c]));
  const added = B.claims.filter(c => !ma[c[0]]), removed = A.claims.filter(c => !mb[c[0]]);
  const changed = B.claims.filter(c => ma[c[0]] && ma[c[0]][4] !== c[4]);
  const credit = B.claims.filter(c => ma[c[0]] && ma[c[0]][4] === c[4] && (ma[c[0]][1] !== c[1] || ma[c[0]][2] !== c[2]));
  const inR = B.claims.filter(c => c[6] && !(ma[c[0]] && ma[c[0]][6])), outR = A.claims.filter(c => c[6] && !(mb[c[0]] && mb[c[0]][6]));
  const row = (c, cls, extra = "") => `<tr class="${cls}"><td>${linkC(c[0])}</td><td>${c[1]}/${c[2]}</td><td>${c[3].toFixed(2)}</td><td>${extra}${esc(T(c[4]))}</td></tr>`;
  const tb = (rows) => `<table><tr><th>编号</th><th>胜/负</th><th>可信度</th><th>内容</th></tr>${rows || "<tr><td colspan=4>无</td></tr>"}</table>`;
  return `<div class="card kbc"><h3>KB 变化 ${a} → ${b}：${A.claims.length} → ${B.claims.length} 条</h3>
   <p>新增 ${added.length} · 删除或被合并 ${removed.length} · 文本改写 ${changed.length} · 仅胜负计数变化 ${credit.length} · 新进入解题者视野 ${inR.length} · 移出视野 ${outR.length}</p></div>
   <div class="card kbc"><h3>新增</h3>${tb(added.map(c => row(c, "add")).join(""))}</div>
   <div class="card kbc"><h3>删除 / 被合并</h3>${tb(removed.map(c => row(c, "del")).join(""))}</div>
   <div class="card kbc"><h3>文本改写（上：旧，下：新）</h3>${tb(changed.map(c => row(c, "chg", `<div class="note">${esc(T(ma[c[0]][4]))}</div><hr>`)).join(""))}</div>
   <div class="card kbc"><h3>引用记账（胜/负计数变化）</h3><table><tr><th>编号</th><th>之前</th><th>之后</th><th>可信度</th><th>内容</th></tr>${credit.map(c => `<tr><td>${linkC(c[0])}</td><td>${ma[c[0]][1]}/${ma[c[0]][2]}</td><td>${c[1]}/${c[2]}</td><td>${ma[c[0]][3].toFixed(2)}→${c[3].toFixed(2)}</td><td>${esc(T(c[4]).slice(0, 200))}</td></tr>`).join("")}</table></div>
   <div class="card kbc"><h3>解题者视野变化（下一轮注入的 50 条）</h3><p><b>进入</b></p>${tb(inR.map(c => row(c, "add")).join(""))}<p><b>掉出</b></p>${tb(outR.map(c => row(c, "del")).join(""))}</div>`;
}
function kbView() {
  $("side").innerHTML = D.snaps.map(s => `<div class="item ${s.label === state.snap ? "on" : ""}" onclick="state.snap='${s.label}';render()">${s.label} <small>${s.claims.length} 条</small></div>`).join("");
  const S = snapBy[state.snap];
  $("view").innerHTML = `<div class="sub"><button class="${state.sub !== "render" ? "on" : ""}" onclick="state.sub='table';render()">全部条目</button><button class="${state.sub === "render" ? "on" : ""}" onclick="state.sub='render';render()">解题者看到的 KB 原文</button></div>` +
    (state.sub === "render" ? `<div class="card solver"><h3>${S.label} 注入原文（下一轮解题者看到的）</h3><pre class="tall">${linkC(S.render)}</pre></div>` :
    `<div class="card kbc"><h3>${S.label}：${S.claims.length} 条，绿色左边线 = 在解题者视野中（${S.claims.filter(c => c[6]).length} 条）</h3>
     <input type="search" placeholder="搜索内容，例如 ReLU / SiLU / RMSprop" oninput="filt(this.value)">
     <table id="kbt"><tr><th>编号</th><th>可信度</th><th>胜/负</th><th>来源</th><th>内容</th></tr>${S.claims.slice().sort((x, y) => y[3] - x[3]).map(c =>
      `<tr class="${c[6] ? "shown" : ""}" data-t="${esc(T(c[4]).toLowerCase())}"><td>${linkC(c[0])}</td><td><span class="bar"><i style="width:${c[3] * 100}%"></i></span> ${c[3].toFixed(2)}</td><td>${c[1]}/${c[2]}</td><td>${c[5] ? "第 " + c[5] + " 轮" : "种子"}</td><td>${esc(T(c[4]))}</td></tr>`).join("")}</table></div>`);
}
function filt(v) { v = v.toLowerCase(); document.querySelectorAll("#kbt tr[data-t]").forEach(r => r.style.display = r.dataset.t.includes(v) ? "" : "none"); }

/* ---------------- claim history ---------------- */
let claimId = "K0134";
function goClaim(id) { claimId = id; state.tab = "claim"; render(); }
function openClaim(id, ev) {
  let rows = "", last = null;
  for (const s of D.snaps) {
    const c = s.claims.find(z => z[0] === id);
    if (!c) { rows += `<tr><td>${s.label}</td><td colspan=3 class="note">不存在</td></tr>`; continue; }
    rows += `<tr class="${c[6] ? "shown" : ""}"><td>${s.label}</td><td>${c[1]}/${c[2]}</td><td><span class="bar"><i style="width:${c[3] * 100}%"></i></span> ${c[3].toFixed(2)}${c[6] ? " · 视野中" : ""}</td><td>${c[4] !== last ? esc(T(c[4])) : '<span class="note">（文本同上）</span>'}</td></tr>`;
    last = c[4];
  }
  const cs = D.commits.filter(c => c.op !== "credit" && ((c.claim_ids || []).includes(id) || c.new_id === id));
  $("popc").innerHTML = `<h3>${esc(id)} 浮动详情 <a href="#" style="font-weight:400;font-size:12px" onclick="closePop();goClaim('${id}');return false">在「单条 claim 演化」页打开 →</a><button id="popx" onclick="closePop()">关闭 ✕</button></h3>
    <table><tr><th>快照</th><th>胜/负</th><th>可信度</th><th>内容（文本变化时显示）</th></tr>${rows || `<tr><td colspan=4 class="note">从未在任何快照中出现</td></tr>`}</table>
    <h3 style="margin-top:10px">结构操作（${cs.length}）</h3>${commitTable(cs)}`;
  const p = $("pop"), card = $("popc");
  p.style.display = "block";
  const w = card.offsetWidth, hh = Math.min(card.offsetHeight, innerHeight * .84);
  card.style.left = Math.min(Math.max((ev?.clientX ?? innerWidth / 2) - w / 2, 12), Math.max(innerWidth - w - 12, 12)) + "px";
  card.style.top = Math.min(Math.max((ev?.clientY ?? 80) - 60, 12), Math.max(innerHeight - hh - 12, 12)) + "px";
  card.scrollTop = 0;
}
function closePop() { $("pop").style.display = "none"; }
document.addEventListener("keydown", e => { if (e.key === "Escape") closePop(); });
function claimView() {
  const ids = [...new Set(D.snaps.flatMap(s => s.claims.map(c => c[0])))].sort();
  $("side").innerHTML = `<div style="padding:6px"><input type="search" placeholder="K0134" onchange="goClaim(this.value.trim().toUpperCase())"></div>` +
    ids.map(i => `<div class="item ${i === claimId ? "on" : ""}" onclick="goClaim('${i}')">${i}</div>`).join("");
  let last = null, rows = "";
  for (const s of D.snaps) {
    const c = s.claims.find(z => z[0] === claimId);
    if (!c) { rows += `<tr><td>${s.label}</td><td colspan=4 class="note">不存在</td></tr>`; continue; }
    rows += `<tr class="${c[6] ? "shown" : ""}"><td>${s.label}</td><td>${c[1]}/${c[2]}</td><td><span class="bar"><i style="width:${c[3] * 100}%"></i></span> ${c[3].toFixed(2)}</td><td>${c[6] ? "视野中" : ""}</td><td>${c[4] !== last ? esc(T(c[4])) : '<span class="note">（文本同上）</span>'}</td></tr>`;
    last = c[4];
  }
  const cs = D.commits.filter(c => (c.claim_ids || []).includes(claimId) || c.new_id === claimId);
  const cr = cs.filter(c => c.op === "credit"), st = cs.filter(c => c.op !== "credit");
  $("view").innerHTML = `<div class="card kbc"><h3>${claimId} 在各快照中的状态</h3><table><tr><th>快照</th><th>胜/负</th><th>可信度</th><th></th><th>内容</th></tr>${rows}</table></div>
   <div class="card summ"><h3>结构操作 commit（${st.length}）</h3>${commitTable(st)}</div>
   <div class="card"><h3>引用记账 commit（${cr.length}）</h3>${commitTable(cr)}</div>`;
}

/* ---------------- commits ---------------- */
function commitTable(cs) {
  if (!cs.length) return `<p class="note">无</p>`;
  return `<table><tr><th>commit</th><th>轮次</th><th>操作</th><th>条目</th><th>来源题</th><th>内容 / 理由</th></tr>${cs.map(c => {
    const p = c.payload || {};
    const body = (p.text ? `<b>新内容：</b> ${linkC(p.text)}<br>` : "") + (p.old_text ? `<span class="note"><b>旧内容：</b> ${esc(p.old_text)}</span><br>` : "") +
      (c.op === "credit" ? esc(JSON.stringify(p)) : "") + (c.reason ? `<b>理由：</b> ${linkC(c.reason)}` : "");
    return `<tr class="${c.op === "add" ? "add" : c.op === "delete" ? "del" : ["merge", "revise", "rollback"].includes(c.op) ? "chg" : ""}"><td>${c.commit}</td><td>${c.epoch}</td><td>${c.op}</td><td>${linkC((c.claim_ids || []).join(" "))}${c.new_id ? " → " + linkC(c.new_id) : ""}</td><td>${esc((c.source_question_ids || []).join(" "))}</td><td>${body}</td></tr>`;
  }).join("")}</table>`;
}
function commitView() {
  const ops = [...new Set(D.commits.map(c => c.op))];
  $("side").innerHTML = ["(结构操作)", ...ops].map(o => `<div class="item ${state.op === o ? "on" : ""}" onclick="state.op='${o}';render()">${o} <small>${o.startsWith("(") ? D.commits.filter(c => !["credit", "seed"].includes(c.op)).length : D.commits.filter(c => c.op === o).length}</small></div>`).join("");
  const o = state.op || "(结构操作)";
  const cs = o.startsWith("(") ? D.commits.filter(c => !["credit", "seed"].includes(c.op)) : D.commits.filter(c => c.op === o);
  $("view").innerHTML = `<div class="card"><h3>commit 日志 · ${o}（${cs.length} 条）</h3>${commitTable(cs)}</div>`;
}

/* ---------------- prompts ---------------- */
function promptView() {
  $("side").innerHTML = "";
  $("view").innerHTML = Object.entries(D.prompts).map(([k, v]) => `<div class="card"><h3>${esc(k)}</h3><pre class="tall">${esc(v)}</pre></div>`).join("") +
    `<div class="card"><h3>运行配置</h3><pre>${esc(JSON.stringify(D.config, null, 1))}</pre></div>`;
}
render();
</script>
</body>
</html>
