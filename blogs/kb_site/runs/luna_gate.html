ative displacement of ~lr * T (~0.077), whereas Adagrad at small learning rates (lr ~ 1e-4) restricts total displacement to ~2 * lr * sqrt(T) (~0.003) and RMSprop at severely reduced learning rates (lr <= 3e-5) yields negligible displacement (~0.008), leaving only the higher-rate adaptive optimizer capable of moving weights sufficiently to begin resolving the boundary.", "For non-linear feature interaction classification tasks (such as XOR) under moderate step budgets (T ~ 1000 steps), RMSprop at moderate learning rates (lr ~ 3e-3) achieves substantially greater cumulative parameter displacement (~lr * T ≈ 3.0) than Adagrad at the same learning rate, because RMSprop maintains an exponential moving average of squared gradients rather than accumulating them indefinitely; Adagrad's per-step step-size decay bounds total displacement to ~2 * lr * sqrt(T) ≈ 0.19, restricting weight movement below the threshold required to form multiplicative feature interactions.", "On smooth univariate regression tasks under plain SGD at moderate learning rates (lr ~ 3e-3) and short step budgets (T <= ~256 steps), shallow-wide MLPs (depth 2-3, width 48-64) achieve faster MSE reduction than deep-narrow MLPs (depth >= 5, width 24-32) of comparable parameter count, because backpropagating gradients through fewer layers preserves larger per-step parameter updates per output unit and mitigates accumulated gradient attenuation.", "Under tight step budgets (T <= ~256 steps) on XOR-like classification tasks requiring non-linear feature composition, AdamW at moderate learning rates (lr ~ 1e-4) achieves cumulative parameter displacement of ~lr * T (~0.026) with adaptive gradient normalization, which is sufficient to escape near-linear initialization and form multiplicative feature interactions, whereas AdamW at severely reduced learning rates (lr <= 3e-5) restricts displacement to ~0.008 (trapping cross-entropy near chance level), and SGD with momentum at reduced base rates (lr ~ 3e-4) suffers from step-size collapse in non-linear regimes due to the lack of per-parameter adaptive scaling.", "On continuous multivariate regression tasks with non-linear target interactions under short step budgets (T <= ~256 steps), unaccelerated SGD at moderate learning rates (lr ~ 3e-3) achieves cumulative parameter displacement of ~lr * T * ||grad|| (~0.4-1.6 for initial gradient norms ~0.5-2.0), outperforming adaptive optimizers at 10x smaller learning rates (lr ~ 3e-4), where Adagrad bounds displacement to ~2 * lr * sqrt(T) (~0.01) and RMSprop yields ~lr * T (~0.08), enabling SGD at lr ~ 3e-3 to fit complex target structure when adaptive optimizers operate in a displacement-limited regime.", "On non-linear classification tasks (such as XOR) under short step budgets (T <= ~256 steps), Adagrad at moderate learning rates (lr ~ 1e-3) achieves faster cross-entropy reduction than RMSprop at the same nominal learning rate or SGD with momentum at reduced base rates (lr <= 3e-4), because Adagrad's per-parameter adaptive scaling maintains stable effective displacement (~2 * lr * sqrt(T) ≈ 0.032) sufficient to escape initialization and form multiplicative feature terms, whereas RMSprop can suffer from early update instability and momentum SGD at reduced base rates yields insufficient cumulative displacement.", "In deep feedforward MLPs trained under tight parameter displacement budgets (such as Adagrad at lr <= ~1e-4, T <= ~512 steps), residual connections without LayerNorm preserve forward activation scale and backward gradient flow across layers (scaling as ~1 + O(1) per block), whereas plain non-residual stacks suffer geometric signal attenuation (~0.5-0.6x per layer); deep unnormalized residual architectures therefore achieve substantially larger total parameter-gradient L1 norms, enabling faster output head shift toward target statistics.", "For continuous regression targets with a non-zero mean (E[y] != 0), initial MSE reduction under short step budgets (T <= ~500 steps) is dominated by shifting the network output prediction from initialization (~0) toward E[y], reducing baseline MSE from E[y]^2 + Var(y) down to Var(y); architectures or optimizers that generate insufficient cumulative output displacement fail to shift the prediction mean and remain trapped near the trivial initial MSE baseline.", "On classification tasks with zero linear baseline signal (such as XOR), raw output gradients near chance initialization are near zero, causing unaccelerated SGD or SGD with momentum at moderate learning rates (lr <= ~1e-3) to stall on the chance loss plateau (CE ≈ ln 2); adaptive optimizers (Adam/RMSprop) maintain per-parameter effective step sizes of scale ~lr regardless of raw gradient magnitude, driving cumulative parameter displacement sufficient to break symmetry and form multiplicative feature interactions.", "Under short step budgets (T <= ~256 steps) with aggressive adaptive learning rates (e.g., Adam at lr ~ 3e-3), residual shortcuts combined with LayerNorm stabilize large per-step parameter updates and prevent logit variance explosion, yielding lower test cross-entropy than an identically wide plain, unnormalized feedforward architecture.", "On low-dimensional piecewise-linear decision boundaries trained on small datasets (N <= ~1000 samples) under short step budgets (T <= ~256 steps), representational capacity saturates at shallow depths (2 hidden layers); adding deeper residual blocks provides no incremental fitting benefit while increasing depth-coordination optimization noise and overfitting, resulting in higher test cross-entropy.", "For multiplicative (XOR-like) interaction targets learned near initialization under short step budgets (T <= ~256 steps), early progress depends on the second-order Taylor expansion coefficient of the activation function at the origin; activations with higher origin curvature like GELU (GELU''(0) ≈ 0.80) generate a ~1.6x stronger quadratic response than SiLU (SiLU''(0) = 0.5), enabling faster initial cross-entropy reduction.", "On small transformer language models (d_model <= 128, depth <= 4) trained under short step budgets (T <= ~256 steps), candidate performance is dominated by cumulative parameter displacement (~lr * T) rather than minor architectural differences: higher adaptive learning rates (AdamW lr ~ 3e-3, displacement ~0.8) enable logits to sharpen toward true target distributions significantly faster than lower learning rates (lr <= ~3e-4, displacement <= ~0.08).", "Under small adaptive learning rates (Adam/AdamW lr <= ~3e-5) and short-to-moderate step budgets (T <= ~1000 steps), cumulative parameter displacement is constrained to ~lr * T (<= ~0.03), leaving networks operating near initialization where output change is governed by NTK magnitude; deep residual MLPs with LayerNorm accumulate activation scale along skip paths and preserve gradient flow, yielding a larger effective NTK and faster early cross-entropy reduction than non-residual or shallow architectures.", "For targets whose decision boundaries depend on per-sample feature magnitude (such as quadratic interactions), applying LayerNorm directly in the main feedforward path of non-residual MLPs removes sample scale information and retards early feature learning, whereas residual architectures preserve unnormalized magnitude signals along skip connections to maintain scale sensitivity.", "When fitting smooth continuous regression targets under short step budgets (T <= ~512 steps), smooth activations (GELU or SiLU) achieve lower MSE than piecewise-linear activations (ReLU) at matched width and optimizer settings, because smooth activations approximate continuous curvature with fewer effective parameter updates and produce smoother gradient trajectories.", "For non-linear classification tasks with high-curvature decision boundaries (such as two-spiral patterns) under moderate step budgets (T <= ~1000 steps), carving the boundary requires cumulative parameter displacement ~lr * T ~ 1.0; sign-normalizing optimizers (Adam/AdamW) at standard learning rates (lr ~ 1e-3) achieve this required displacement, whereas severely undersized learning rates or decaying optimizers (e.g., Adagrad at lr <= ~3e-5 with displacement ~2 * lr * sqrt(T) <= ~0.01) leave the network stuck near initialization at chance cross-entropy (ln(2) ≈ 0.693).", "Under default PyTorch uniform linear initialization (weight variance Var(W) = 1 / (3 * fan_in)), each unnormalized non-residual hidden layer attenuates activation variance by fan_in * Var(W) * E[act_gain] <= ~1/3, causing plain stacks of depth >= 3 to exponentially collapse output feature norm ||h_last|| to near zero; residual shortcuts combined with LayerNorm prevent activation decay, maintaining unit-scale feature norm ||h_last||^2 ~ O(width) per unit.", "Under unaccelerated SGD at fixed small learning rates (lr <= ~1e-3, T <= ~256 steps) in the near-initialization regime, early function-space learning speed is governed by the output-head NTK scale ||h_last||^2 = width * E[h^2]; non-contractive activation functions (LeakyReLU/ReLU with E[h^2] ~ 0.25) combined with LayerNorm yield ~3-5x larger feature norms and per-step logit updates than magnitude-shrinking activations (SiLU/GELU with E[h^2] ~ 0.05-0.1), even when the latter operate at larger hidden width.", "On token-level sequence or bigram language modeling tasks under short step budgets (T <= ~512 steps), standard adaptive learning rates (Adam lr >= ~3e-4) produce sufficient cumulative parameter displacement (~lr * T) to learn conditional token mappings and drive test cross-entropy well below the uniform baseline ln(V), whereas unaccelerated or low-learning-rate optimizers (SGD with momentum or Adagrad at lr <= ~1e-4, whose per-step effective update decays as ~lr / sqrt(t)) fail to overcome initial logit scale, leaving test cross-entropy stuck near the uniform entropy baseline ln(V).", "In deep unnormalized MLPs (depth >= 4) with standard initialization, raw backpropagated gradient magnitudes attenuate exponentially with depth, causing SGD or momentum SGD at small learning rates (effective lr <= ~3e-4) to update deeper hidden layers orders of magnitude less than the output head; per-parameter normalized optimizers (Adam, RMSprop, Adagrad) overcome depth-wise gradient decay by applying updates of magnitude ~lr per step uniformly across all layers, yielding significantly larger useful feature displacement.", "When fitting continuous MSE targets with a large constant offset, per-step output-space displacement for SGD scales with the L2 norm of parameter sensitivities (lr_eff * error * sum_i (df/d_theta_i)^2), whereas for sign-normalized adaptive optimizers it scales with the L1 norm (lr * sum_i |df/d_theta_i|); in multi-layer networks with moderate-to-large layer widths (width >= 64), the L1 norm sum substantially exceeds the L2 sum, allowing normalized optimizers to align the target mean significantly faster than small-learning-rate momentum SGD.", "Under short step budgets (T <= ~256 steps), Adagrad initialized with zero accumulators yields cumulative per-parameter displacement of ~2 * lr * sqrt(T) (achieving ~0.03 at lr ~ 1e-3), outperforming tiny-learning-rate RMSprop or Adam (lr <= ~3e-5, cumulative displacement ~lr * T <= ~0.008) by providing ~4x greater total parameter movement to escape near-initialization loss plateaus.", "On small (width <= 32) residual MLPs equipped with LayerNorm trained under short step budgets (T <= ~256 steps), Adam or AdamW at elevated learning rates (lr ~ 3e-3) remains numerically stable and yields ~3x larger cumulative parameter displacement (~lr * T ≈ 0.77) than standard learning rates (lr ~ 1e-3), accelerating cross-entropy reduction on complex non-linear decision boundaries where under-training is the primary bottleneck.", "On radially-structured 2-D classification tasks where decision boundaries depend jointly on angle and radius ||x||, non-residual LayerNorm architectures normalize away per-sample activation scale at every layer, retarding feature learning; residual architectures with LayerNorm preserve activation magnitude along the shortcut path, achieving faster cross-entropy reduction under short step budgets (T <= ~256 steps).", "When fitting continuous regression targets with large constant offsets (|E[y]| >= ~4) under short step budgets (T <= ~256 steps), candidate ranking across identical architectures is governed by cumulative parameter displacement (~lr * T for sign-normalized adaptive optimizers); Adam or AdamW at elevated learning rates (lr ~ 3e-3, cumulative displacement ~ 0.77) substantially outperforms undersized adaptive optimizers (lr <= 1e-4) or small-lr momentum SGD by enabling rapid output bias alignment.", "On XOR-like classification tasks trained with wide (width >= 128) residual GELU MLPs, random feature projections at initialization span a sufficient quadratic subspace for the readout layer; under an effective learning rate of lr_eff ≈ lr / (1 - m) ~ 1e-3, the final linear layer aligns within ~10^2 steps (at rate ~ lr_eff * E[||h||^2]), escaping chance cross-entropy (ln 2 ≈ 0.693) even prior to substantial hidden-layer feature learning.", "In narrow-input (1-D) MLPs trained under small learning rate adaptive optimization (Adam/AdamW lr <= ~1e-4, T <= ~1000 steps), LayerNorm after the first hidden layer rescales post-activation features to unit standard deviation (~2x the scale of unnormalized default initialization), boosting downstream pre-activations and output-head gradient magnitudes to accelerate early MSE reduction without destroying 1-D input spatial representation.", "For O(1)-magnitude regression targets under short step budgets (T <= ~256 steps), wide ReLU networks (width >= 128) produce large last-layer feature norms (||h||^2 ~ 10-100) and correspondingly large raw MSE gradients; SGD with momentum (m ~ 0.9, effective lr ~ lr / (1-m) ~ 0.03) within the heavy-ball stability bound (lr < 2(1+m) / (2||h||^2)) achieves ~100x larger per-step parameter displacement than small-learning-rate adaptive optimizers (Adam or RMSprop at lr <= ~3e-5), dominating early loss reduction.", "For smooth low-order univariate regression targets under short step budgets (T <= ~1000 steps) with adaptive optimizers at standard learning rates (lr ~ 1e-3), initial convergence is limited by optimization speed rather than approximation capacity; shallow wide networks (1-2 hidden layers, width >= 128) achieve faster MSE reduction than deeper stacks by minimizing depth coordination overhead and gradient attenuation while providing sufficient breakpoint coverage.", "When fitting smooth, low-order additive functions of a few input coordinates under short step budgets (T <= ~512 steps), shallow wide networks (1-2 hidden layers, width >= 64) with smooth activations (SiLU or GELU) achieve faster loss reduction than deep narrow ReLU stacks, because smooth activations approximate continuous curvature with fewer parameter updates while shallow wide layers shorten gradient propagation paths.", "In deep residual networks (depth >= 4 blocks) with pre-layer normalization, applying ReLU after each residual addition repeatedly clips negative activation components and discards per-sample feature magnitude; for magnitude-dependent targets containing quadratic components, this progressive signal degradation slows early cross-entropy reduction relative to shallower architectures that preserve signed feature magnitude.", "In unnormalized residual MLP stacks using sub-unit smooth activations (SiLU or GELU) after the residual addition, per-block activation RMS contracts by ~0.6-0.8x per block as activation gain dominates residual branch growth, causing deep unnormalized stacks (depth >= 4) to deliver significantly smaller feature magnitudes to the output head and achieve slower function displacement under short step budgets (T <= ~256 steps) than normalized residual blocks.", "For 1-D continuous regression targets with multi-period oscillations (e.g., y = x - cos(4*pi*x)), deep residual MLPs with smooth activations (SiLU, depth >= 4 blocks) achieve faster MSE reduction under short step budgets (T <= ~256 steps) than shallow non-residual MLPs (depth <= 2), because composed residual depth accelerates fitting high-frequency spectral components while identity shortcuts maintain well-conditioned gradient flow.", "In low-dimensional regression tasks (e.g., 1-D inputs where per-sample activation magnitude carries signal), placing LayerNorm inside residual branches (h = x + act(Linear(LayerNorm(x)))) preserves input scale information via the identity shortcut path, outperforming plain non-residual MLPs where full LayerNorm strips per-sample magnitude across layers and retards early convergence under short step budgets (T <= ~256 steps).", "In deep unnormalized ReLU MLPs (depth >= 4) initialized with PyTorch default uniform scaling, forward activation scale contracts across layers (std shrinking by ~2-2.5x per layer), causing raw backpropagated gradients in early layers to decay exponentially; under short step budgets (T <= ~256 steps), unaccelerated or momentum SGD stalls after fitting the output head/bias, whereas adaptive optimizers (Adam/AdamW) update all parameter layers at scale ~lr regardless of gradient magnitude, driving substantially faster loss reduction.", "On continuous MSE regression targets with small batch sizes (batch size <= 16) under short step budgets (T <= ~256 steps), AdamW at standard learning rates (lr ~ 1e-3) outperforms both Adagrad (lr <= 3e-4) and momentum-free RMSprop (lr ~ 3e-3): Adagrad's accumulator growth decays effective step sizes to ~2 * lr / sqrt(T), yielding insufficient cumulative parameter displacement (~0.01), while momentum-free RMSprop exhibits high update variance that induces step-to-step oscillations and degrades test MSE.", "Under sign-normalizing adaptive optimization at small learning rates (Adam/RMSprop at lr <= ~3e-5, T <= ~2000 steps) where cumulative per-parameter displacement is bounded by ~lr * T (<~0.1), network function-space displacement scales with the total initial L1 parameter sensitivity sum sum_p |df/dp|; architectures with deeper residual stacks, higher total parameter counts, and larger hidden activation magnitudes produce greater output change per step to accelerate target mean offset alignment.", "In residual MLP architectures with pre-LayerNorm residual branches of the form h = act(x + Linear(LayerNorm(x))), LayerNorm standardizes branch inputs so that post-activation feature RMS accumulates across stacked residual blocks up to std ~ 1.0 (compared to std ~ 0.3-0.5 in unnormalized residual blocks), enlarging output-head weight gradients (df/dW_out = h) and accelerating initial bias and mean alignment under short step budgets (T <= ~2000 steps).", "On classification tasks with unnormalized input features spanning wide spatial ranges (such as 2-D spirals with input radius r >> 1), unaccelerated SGD at moderate learning rates (lr ~ 3e-3) produces ill-conditioned, highly anisotropic updates that stall near chance loss (CE ≈ ln 2), whereas sign-normalizing adaptive optimizers (Adam/AdamW at lr ~ 3e-4) decouple update scales from feature input magnitudes, accumulating uniform parameter displacement (~lr * T ≈ 0.3 over T ≈ 1000 steps) to rapidly fit non-linear decision boundaries.", "When comparing Adagrad (learning rate lr_g, zero-initialized accumulator) against sign-normalized Adam or AdamW (learning rate lr_a), Adagrad produces larger initial per-step updates (~lr_g / sqrt(t)), but sign-normalized Adam overtakes Adagrad in cumulative parameter displacement after t* ≈ (2 * lr_g / lr_a)^2 steps; for step budgets T > t* on under-trained tasks, Adam achieves greater cumulative parameter displacement and lower final loss.", "In PyTorch RMSprop with zero-initialized average squared gradient accumulators (smoothing alpha ~ 0.99), effective step sizes during the first t <= ~1/(1-alpha) steps are amplified by up to ~1/sqrt(1-alpha) (e.g., ~10x on step 1), causing total parameter displacement over short step budgets (T <= ~256 steps) to exceed nominal sign-normalized displacement (lr * T) and outpace Adagrad's decaying cumulative displacement (~2 * lr * sqrt(T)).", "When training Transformer architectures from scratch under short step budgets (T <= ~500 steps), plain or momentum SGD at standard learning rates (lr <= ~1e-3) stalls because post-LayerNorm and softmax gradients are small and highly heterogeneous across layers, whereas parameter-normalized adaptive optimizers (Adam, RMSprop, Adagrad) update all parameter layers uniformly at effective scale ~lr per step regardless of raw gradient magnitude, dominating early loss reduction.", "Under unaccelerated or momentum SGD with short step budgets (T <= ~500 steps), shallow residual MLPs (1-2 hidden blocks) achieve faster loss reduction than deeper non-residual MLPs of comparable parameter count, because residual skip connections mitigate multi-layer gradient attenuation and bypass the slow, sequential layer-by-layer feature alignment required by deep non-residual networks.", "On continuous 1-D regression targets under short step budgets (T <= ~500 steps) with SGD optimization, smooth activations (SiLU or GELU) achieve faster loss reduction than ReLU activations because smooth functions provide non-zero gradients across the entire input domain, avoiding the zero-gradient dead zones that retard feature adaptation in ReLU units with negative pre-activations.", "Under unaccelerated SGD with small learning rates (lr <= ~3e-4) and short step budgets (T <= ~1000 steps), network training remains in a near-linear regime where output readout convergence follows a time constant of ~1 / (2 * lr * ||h||^2), where ||h||^2 is the squared norm of the final hidden representation; architectures with larger last-layer feature norms achieve proportionally faster early loss reduction.", "For MLPs operating on unnormalized inputs with large feature scale (input radius ||x|| >= ~10), hidden LayerNorm rescales internal activation magnitudes and conditions per-layer gradients, enabling deep narrow architectures (depth >= 4, width <= 16) to remain numerically stable and trainable at elevated learning rates (lr >= ~3e-3) where unnormalized residual stacks suffer scale propagation instabilities under short step budgets (T <= ~512 steps).", "When training residual MLPs at elevated learning rates (AdamW lr >= ~3e-3), normalization coverage within the residual stack dictates update stability: each additional LayerNorm-equipped block bounds activation scale growth along the residual path and maintains conditioned per-layer gradient magnitudes—particularly in blocks near the output head—reducing seed-to-seed loss variance and improving mean cross-entropy compared to less-normalized residual stacks of equal depth.", "On noiseless deterministic target functions, overparameterized residual MLPs (width >= 256, depth 3-4) do not suffer from capacity-driven overfitting under moderate training durations (~30 epochs); instead, additional normalized residual depth enhances boundary-curvature modeling capacity, enabling steady reductions in test cross-entropy without generalization degradation.", "Under short optimization budgets (T <= ~300 steps) with Adam-family optimizers, reducing the second-moment decay parameter from standard beta2 = 0.999 to beta2 ~ 0.95 shortens the variance estimator warmup horizon from ~1000 steps (~1/(1 - beta2)) to ~20 steps, accelerating early per-parameter step size calibration and yielding faster initial loss reduction.", "On bigram next-token prediction tasks using transformer language models under short step budgets (T <= ~256 steps), candidate progress is governed by parameter displacement speed in token embeddings and output heads; sign-normalized adaptive optimizers (Adam/AdamW at lr ~ 3e-4) achieve cumulative parameter displacement of ~lr * T, outperforming Adagrad (whose displacement decays as ~2 * lr * sqrt(T)) and momentum SGD (whose updates scale with raw cross-entropy gradients that shrink once logits match the unigram marginal distribution).", "For simple bigram next-token prediction tasks under short step budgets (T <= ~500 steps), variations in small transformer architecture (2 vs 4 layers, d_ff of 64 vs 128, 2 vs 4 attention heads) exert second-order effects on loss reduction relative to optimizer choice and effective step size, because the underlying task requires only a low-rank mapping from input token embeddings to output logits.", "Under fixed optimizer, learning rate, and step budgets (T <= ~2000 steps), candidate ranking among deep narrow MLPs (depth >= 4, width <= 24) is dominated by macro-architectural conditioning (such as residual paths or overall depth), whereas minor variations like activation choice (ReLU vs LeakyReLU with slope 0.01) or the specific layer position of a single omitted LayerNorm exert second-order effects that do not reliably differentiate performance.", "On small tabular datasets (~1000 samples) under short step budgets (T <= ~2000 steps), repeated LayerNorm applications across a deep, narrow, non-residual MLP (depth >= 4, width <= 24) discard per-example activation scale magnitude at each stage and compound gradient attenuation, yielding slower convergence on smooth decision boundaries compared to a shallow wide single-hidden-layer network (width >= 64).", "When fitting low-dimensional multiplicative feature interactions (such as XOR boundaries) under short step budgets (T <= ~256 steps) with adaptive optimizers, moderate-depth unnormalized MLPs (2-3 hidden layers, width 64-128) achieve faster cross-entropy reduction than deeper unnormalized stacks (depth >= 4), because 2-3 layers provide sufficient composed nonlinearity to express product interactions while avoiding the cumulative per-layer activation shrinkage (~0.5-0.6x per unnormalized layer under default initialization) that degrades early logit scale in deeper stacks.", "Under short step budgets (T <= ~256 steps) on curved low-dimensional decision boundaries, a single residual block (1 hidden layer with skip connection) achieves slower loss reduction than a depth-2 plain MLP of comparable width, because the single residual block contains fewer trainable non-linear feature transformations, resulting in smaller cumulative logit displacement despite its identity shortcut path.", "When cumulative parameter displacement under sign-normalized adaptive optimizers (~lr * T) greatly exceeds the initialization weight scale (~1 / sqrt(width)), further elevating the learning rate (e.g., from lr ~ 1e-3 to 3e-3 under small batch sizes <= 16) yields no additional convergence speed and instead increases gradient-noise-driven logit overconfidence and update instability, degrading test cross-entropy on small training datasets (~1k rows).", "In classification tasks under tight step budgets (T <= ~512 steps), larger initialization-time feature norms inflate initial random logit variance, adding approximately Var(delta_logit) / 8 to initial cross-entropy above the uniform baseline ln(2); high-feature-scale architectures (such as deep residual MLPs with LayerNorm) achieve lower final cross-entropy only when their larger logit displacement per step (~lr * ||h_last||_1) overcomes this initial entropy penalty within the step budget.", "Under short step budgets (T <= ~500 steps) on token-embedding models, unaccelerated plain SGD (momentum = 0) at low-to-moderate learning rates (lr <= ~3e-3) suffers from sparse embedding updates (gradients occur only when tokens appear in batch), restricting cumulative parameter displacement along the embedding-to-head path to a small fraction of lr * T and leaving output logits stuck near the uniform-chance baseline (cross-entropy ≈ ln(V)).", "In pre-norm residual GELU blocks with default initialization, LayerNorm injects a branch with stable fixed-point activation scale (std ≈ 0.4), whereas unnormalized (Identity-norm) residual blocks contract the stream by ~0.7x per block due to non-linear activation decay; consequently, architectures with more interleaved LayerNorm blocks maintain higher final-layer feature norms (||h_last||) and output sensitivity than stacks with consecutive unnormalized residual blocks.", "Under short step budgets (T <= ~256 steps) on smooth continuous regression targets, smooth activations (SiLU/GELU) in moderate-depth MLPs fit target function curvature faster per step than shallow ReLU networks, because bounded parameter displacement (~lr * T) prevents ReLU kink locations (x = -b/w) from migrating significantly from initialization, restricting ReLU networks to reweighting a fixed piecewise-linear basis while smooth activations inherently express continuous second-order derivatives.", "In plain (non-residual) MLPs with default linear initialization (where activation variance attenuates by ~1/3 per unnormalized layer), interleaving LayerNorm layers (e.g., every 2 layers) restores unit feature scale and prevents exponential gradient decay, enabling deep networks (depth >= 5) under short step budgets (T <= ~256 steps) to leverage greater cumulative parameter depth for larger output function displacement per step than shallow architectures.", "When training Transformer language models with small batch sizes (batch size <= 32) under short step budgets (T <= ~256 steps), RMSprop without momentum (beta1 = 0) exhibits high update variance that destabilizes LayerNorm and attention mechanisms, whereas Adam with standard momentum (beta1 = 0.9) smooths gradient trajectories to achieve faster and more stable cross-entropy reduction at the same nominal learning rate (lr ~ 1e-3).", "On short-context bigram next-token prediction tasks where optimal predictions depend only on the immediately preceding token, architectural variations in attention head partitioning (e.g., 2 vs 4 heads at fixed hidden dimension d_model = 128) exert negligible influence on attainable test cross-entropy; candidate performance under short step budgets (T <= ~256 steps) is dominated by optimizer dynamics rather than head count.", "When fitting simple, low-frequency continuous targets under tight step budgets (T <= ~256 steps), extra depth in residual MLPs (e.g., depth 4 vs depth 1 residual blocks) provides negligible representational benefit while diluting per-layer optimization signals, resulting in slower early loss reduction compared to shallow residual architectures at matched width.", "On first-order bigram next-token prediction tasks under short step budgets (T <= ~1000 steps, no warmup), recurrent architectures (GRU, LSTM) achieve faster cross-entropy reduction than multi-layer post-LayerNorm transformers at comparable effective learning rates, because recurrent models inject the current token directly into the per-position output state without the optimization overhead of preserving residuals through attention/FFN mixing layers or learning to suppress historical context.", "Under sign-normalized adaptive optimizers (Adam/AdamW with step size ~lr), per-step scalar output displacement scales as ~lr * sum_theta |df/dtheta|; for networks composed of W x W hidden weight matrices, each block contributes proportionally to the gradient L1 norm sum, so stacking k residual hidden blocks yields approximately k times the function-space step of a single block of comparable width, enabling deeper multi-block architectures to achieve faster early loss reduction under short step budgets (T <= ~256 steps) where under-training is the binding constraint.", "In smooth regression tasks with constant target offsets under short step budgets (T <= ~256 steps), Adam at standard learning rates (lr ~ 1e-3) absorbs the target mean offset within the first few dozen steps (offset divided by per-step output displacement), causing candidate ranking at budget end to be determined by the rate of subsequent non-linear shape-fitting, which favors architectures and optimizers providing larger stable effective function-space step sizes.", "For highly curved decision boundaries (such as 2-D spiral classification) with unnormalized inputs under short step budgets (T <= ~500 steps), unaccelerated or low-learning-rate momentum SGD (effective lr <= ~3e-4) stalls near the chance plateau where raw gradients are small, whereas sign-normalized adaptive optimizers (Adam, RMSprop) generate cumulative parameter displacement (~lr * T) independent of raw gradient scale to reshape the decision boundary.", "When training on unnormalized inputs of large scale (radius up to ~20) under short step budgets (T <= ~256 steps), applying LayerNorm before every hidden Linear layer stabilizes activations to O(1) scale, enabling adaptive optimizers (e.g., RMSprop, Adam) to run stably at elevated learning rates (lr ~ 3e-3) and maximize cumulative parameter displacement without exploding or propagating unnormalized input projections.", "For target functions with zero linear component (e.g., pure multiplicative feature interactions y = 1[a*x_i*x_j + b*x_j*x_k > 0]), initial progress depends on the richness of non-linear feature representations; two stacked non-linear blocks construct a higher-order interaction basis than a single residual block, whose identity shortcut biases readout activations toward uninformative first-layer linear projections.", "Under short step budgets (T <= ~256 steps) on residual MLPs with LayerNorm where under-training is the primary constraint, unaccelerated SGD at learning rates below the stability threshold (lr <= ~3e-3) exhibits monotonically decreasing test loss as learning rate increases, because larger stable learning rates maximize cumulative parameter displacement (~lr * T * ||grad||) without inducing numerical instability.", "In under-trained regimes on non-linearly separable parity tasks (e.g., XOR) where all candidates remain near chance loss (CE ≈ ln 2), candidate ranking is determined by cumulative parameter displacement relative to initialization weight scale (~1/sqrt(fan_in)); sign-normalized adaptive updates (Adam/AdamW) achieving cumulative displacement of ~20% or more of the initialization scale (~lr * T / (1/sqrt(fan_in)) >= ~0.2) begin breaking architectural symmetry and produce measurable loss reduction below chance, outperforming SGD settings whose raw gradients decay through unnormalized deep layers.", "On balanced binary classification tasks with cross-entropy loss, initial output-layer gradients are O(1) per sample (|p - y| ≈ 0.5), preventing SGD with momentum from becoming displacement-starved; over moderate step budgets (T >= ~1000 steps), momentum SGD maintains a non-decaying per-step displacement of ~ (lr / (1 - m)) * ||g||, whereas Adagrad's per-step displacement decays to ~ lr / sqrt(T) and cumulative displacement saturates at ~ 2 * lr * sqrt(T), allowing momentum SGD at effective learning rates lr / (1 - m) >= 10x Adagrad's decayed step size to achieve substantially greater parameter displacement and boundary fitting.", "In architectures with LayerNorm preceding hidden activations, linear weight scale invariance amplifies the effective gradient update step on preceding weight matrices by ~1 / ||W_row||^2 (typically ~2-4x for standard initialization at width 64-128); under moderate step budgets (T <= ~2000 steps), this normalization-induced learning rate amplification enables momentum SGD at nominal learning rates (lr ~ 1e-3) to achieve sufficient cumulative parameter displacement to outperform deeper residual networks paired with step-decaying optimizers (such as Adagrad).", "When training on unnormalized inputs of large scale (radius up to ~10) without input normalization, last-layer feature energy sum_i h_i^2 reaches O(10^2-10^3), setting output-head curvature L ~ sum_i h_i^2 / 4 and lowering the SGD stability threshold lr_eff < 2/L to <= ~0.01; momentum SGD with effective learning rate lr / (1-m) exceeding this bound causes seed-dependent oscillations or divergence whose extreme penalties dominate seed-averaged loss metrics.", "Cumulative per-parameter displacement under sign-normalizing adaptive optimizers (Adam or AdamW) scales as ~lr * T and must be evaluated relative to layer initialization scale ~1/sqrt(fan_in); an optimization regime is only under-trained when lr * T << 1/sqrt(fan_in), whereas lr * T >= 1/sqrt(fan_in) provides sufficient parameter displacement (~0.1 for fan_in = 32-64) to escape initialization and fit non-linear decision boundaries.", "For classification targets defined by piecewise-linear or hinge decision boundaries (e.g., sign-switched linear conditions y = 1 iff x_j > |x_i|), networks with exact piecewise-linear activations (ReLU) represent boundary kinks directly with fewer active parameters than smooth activations (SiLU or GELU) of equal width, achieving faster cross-entropy reduction under constrained step budgets (T <= ~1000 steps).", "Under displacement-limited optimization (such as Adagrad at small learning rates lr <= ~3e-4 over short step budgets T <= ~512 steps) where cumulative per-parameter displacement (~2 * lr * sqrt(T)) remains far below initialization scale (~1/sqrt(width)), candidates cannot perform feature learning; model ranking is then governed by output logit movement per unit weight displacement (~displacement * sum_i |h_i|), favoring architectures that maintain larger last-hidden-layer feature norms.", "On smooth 1-D regression tasks under adaptive optimization (Adam or AdamW at lr ~ 3e-4 over T <= ~2000 steps), per-step output displacement scales with last-layer hidden width as ~lr * sum_i |h_i| ~ lr * W; wider hidden layers (width >= 128) fit target amplitudes faster than narrower architectures (width <= 64) at equal depth.", "In residual architectures where activations wrap the block sum (act(x + F(x))), smooth activations (SiLU or GELU) preserve signal propagation across both positive and negative activation regimes better than piecewise-linear activations with negative clipping (LeakyReLU or ReLU), accelerating convergence on smooth oscillatory targets under moderate step budgets (T <= ~2000 steps).", "For scalar-input regression under moderate step budgets (T <= ~2000 steps), deep unnormalized plain MLPs (depth >= 5) initialized with scalar projections suffer from ill-conditioned rank-1 feature representations and gradient attenuation, underperforming shallower wide residual or normalized MLPs (depth 2-3, width >= 96) of equivalent parameter count.", "When fitting complex non-linear decision boundaries under short step budgets (T <= ~256 steps), candidate ranking across adaptive optimizers is governed by cumulative parameter displacement (~lr * T for Adam vs ~2 * lr * sqrt(T) for Adagrad); higher adaptive learning rates (lr ~ 3e-3 vs 1e-4) and reduced second-moment decay (beta2 ~ 0.95) maximize early parameter displacement to escape the chance classification plateau.", "Under tight step budgets (T <= ~256 steps), plain non-residual ReLU stacks attenuate hidden activation norms exponentially with depth (~0.4x per layer), reducing readout feature norms and per-step logit displacement (~lr * ||h_last||_1), whereas residual skip connections maintain activation scales, enabling significantly faster cross-entropy reduction at equal optimizer settings.", "Fitting target functions containing high-frequency components (such as 2*pi sinusoids) requires growing first-layer weights to magnitude ~2*pi from initialization (~1/sqrt(fan_in)); under short step budgets (T <= ~1000 steps), sign-normalized adaptive optimizers with learning rates lr >= ~1e-3 accumulate the required cumulative displacement (~lr * T >= ~3), whereas SGD variants stall on small MSE gradients after fitting low-frequency and mean offset terms.", "Under tight step budgets (T <= ~256 steps) on continuous MSE regression tasks with identical architectures, candidate ranking is governed by cumulative parameter displacement: sign-normalized adaptive optimizers (Adam or AdamW) achieve displacement ~lr * T, zero-initialized Adagrad is capped at ~2 * lr * sqrt(T), and unaccelerated SGD is constrained by shrinking raw MSE gradients after initial output head alignment, requiring sign-normalized adaptive optimizers to escape initialization and fit non-linear target structure.", "When training sequence models with softmax cross-entropy over moderate vocabularies under moderate step budgets (T <= ~2000 steps), momentum SGD at small nominal learning rates (lr <= ~3e-4, effective lr ~ lr / (1-m) <= ~3e-3) stalls near the unigram marginal-entropy plateau because raw cross-entropy gradients decay rapidly once output biases align with token frequencies, whereas sign-normalized adaptive optimizers maintain constant per-step updates (~lr) to learn conditional token transitions.", "In 1-D input regression tasks under short step budgets (T <= ~256 steps) where internal representations operate near initialization (cumulative displacement ~lr * T << 1), the first projection layer nn.Linear(1, W) with standard initialization acts as a random feature basis whose capacity to represent non-linear function kinks scales with hidden width W; wider first layers (width >= 96 vs width <= 64) provide a richer random basis that achieves lower fitting error without requiring substantial hidden weight movement.", "Under short step budgets (T <= ~256 steps) with small adaptive learning rates (lr <= ~3e-4), shallow additive residual blocks preserve the input-projected random feature basis along skip paths directly to the readout head while adding non-linear capacity, outperforming deeper non-residual architectures whose stacked randomly initialized linear transformations attenuate and scramble unadapted features before parameter displacement is sufficient to retrain them.", "For low-dimensional or scalar-input MLPs under short optimization budgets (T <= ~256 steps), applying LayerNorm across hidden channels removes amplitude and magnitude information from sample features without delivering the gradient-conditioning benefits it provides in deep high-dimensional networks, slowing early function approximation relative to unnormalized residual blocks.", "Under small cumulative parameter displacement (~lr * T <= ~0.03) on continuous targets dominated by smooth additive or near-linear terms, minimal non-linear feature learning occurs and early loss reduction is driven by fitting a linear readout of random features; wider hidden representations (width >= 96) achieve faster loss reduction than deeper architectures by providing a higher-capacity random feature space for rapid readout alignment.", "In sign-normalized adaptive optimizers (Adam or AdamW), reducing second-moment decay (beta2 from 0.999 to 0.95) accelerates variance calibration only during initial steps (t <= ~20) but does not increase asymptotic per-step parameter displacement (~lr); under short step budgets (T <= ~256 steps), a lower learning rate with reduced beta2 (e.g., lr ~ 3e-4, beta2 = 0.95) cannot compensate for a higher learning rate (lr ~ 1e-3, beta2 = 0.999).", "In residual MLP architectures, applying smooth non-monotonic activations (such as SiLU) after residual addition preserves activation signs across the residual stream and maintains active gradient flow through all blocks, whereas rectified activations (such as LeakyReLU or ReLU) zero out negative contributions and contract effective gradient magnitude at the output head; under short step budgets (T <= ~256 steps) where feature learning is minimal, sign preservation primarily improves convergence speed via larger early head gradients.", "RMSprop at elevated learning rates (lr ~ 3e-3) on a single-layer post-LayerNorm transformer with a low-entropy target (such as a bigram transition table) remains numerically stable over short step budgets (T <= ~256 steps), whereas instability risk from elevated learning rates increases primarily with depth (>= 4 post-LN blocks) and longer optimization horizons.", "Under short step budgets (T <= ~256 steps) on MSE regression tasks with a non-zero target mean (|E[y]| ~ 1), optimizer ranking is governed by cumulative output-bias displacement: momentum SGD achieves displacement of ~ (lr / (1 - m)) * T * ||grad|| (e.g., effective lr ~ 0.03 driving bias alignment within tens of steps), sign-normalized adaptive optimizers achieve ~ lr * T, and unaccelerated SGD achieves ~ lr * T * ||grad||, with optimizers providing cumulative displacement <= ~0.05 remaining stuck near initialization.", "For bigram next-token prediction under moderate step budgets (T ~ 2000 steps), Adagrad with zero-initialized accumulators yields cumulative parameter displacement of ~2 * lr * sqrt(T); at standard learning rates (lr ~ 3e-3) this achieves ~0.27 displacement, which is sufficient to fit low-rank token-embedding-to-head mappings, whereas reduced learning rates (lr <= 3e-5) bound displacement to ~0.003, leaving test cross-entropy stuck near the uniform entropy baseline ln(V).", "On classification tasks with zero linear baseline signal (such as XOR), Adam or AdamW at standard learning rates (lr ~ 1e-3) achieves cumulative parameter displacement of ~lr * T (~2.0 over T ~ 2000 steps) sufficient to fully escape the chance loss plateau and drive test cross-entropy well below 0.2, whereas reduced learning rates (lr ~ 3e-4) restrict cumulative displacement to ~0.6, leaving the model mid-transition at the budget limit.", "Under short step budgets (T <= ~256 steps) on continuous MSE regression tasks, sign-normalized adaptive optimizers without momentum (such as RMSprop and Adam/AdamW) produce per-parameter updates of scale ~lr, making their cumulative parameter displacement ratio equal to their learning rate ratio (e.g., AdamW at lr ~ 1e-4 yielding ~3.3x the displacement of RMSprop at lr ~ 3e-5); both dominate small-learning-rate momentum SGD whose updates are further constrained by shrinking raw MSE gradients.", "For univariate targets with multiple oscillations (e.g., cos(k*pi*x)*x with k >= 4) trained under short step budgets (T <= ~512 steps) and small adaptive learning rates (lr ~ 3e-4, cumulative displacement ~lr*T ~ 0.15), single-hidden-layer networks cannot generate high input frequencies because first-layer weights require large growth from O(1) default initialization; deeper residual stacks (depth >= 4) equipped with LayerNorm synthesize high-frequency curvature through non-linear layer composition, fitting oscillatory targets faster than shallow (1-2 layer) architectures of comparable parameter count.", "For highly curved decision boundaries requiring many sign changes (such as 2-D spirals) trained with adaptive optimizers under short step budgets (T <= ~512 steps), deep normalized networks (depth >= 4 with LayerNorm and smooth GELU or SiLU activations) provide significantly higher decision boundary curvature capacity per step than single-hidden-layer architectures, achieving faster cross-entropy reduction and escaping chance-level plateaus.", "In residual MLPs with 1-D inputs, identity skip paths preserve O(1) input features directly to the output head, allowing smooth univariate regression targets to be fitted with minimal parameter displacement (cumulative delta_w ~ lr * T <= ~0.01 under T <= ~256 steps, lr <= ~3e-5) compared to deep non-residual stacks whose input dependence is attenuated across non-linear layers.", "Small post-LayerNorm transformers (d_model <= 32, depth <= 4) remain numerically stable at elevated Adam learning rates (lr ~ 3e-3) when beta2 is reduced to ~0.95, as faster second-moment adaptation damps early gradient spikes; under short step budgets (T <= ~1000 steps), optimization progress is dominated by avoiding under-training (lr <= 1e-4) rather than lr-induced instability.", "Under unaccelerated SGD at small learning rates (lr <= ~3e-4) and short step budgets (T <= ~256 steps), network parameters remain trapped in the lazy/NTK regime near initialization, where function-space loss reduction is approximately proportional to lr * T times the projection of the target function onto the dominant eigen-directions of the initial Neural Tangent Kernel.", "For classification targets with zero linear baseline signal (such as XOR-like sign(x_i * x_j) labels) operating in the lazy regime (T <= ~256 steps, lr <= ~3e-4), degree-1 linear feature components carry zero signal, making functional progress depend on the degree-2 (interaction) spectral mass of the Neural Tangent Kernel; deep plain MLPs with pre-Linear LayerNorm pass signals through successive non-linearities without identity shortcuts, generating higher relative degree-2 kernel mass than unnormalized residual MLPs whose skip paths concentrate kernel mass on linear directions.", "At fixed hidden width and optimizer step size in the lazy regime (T <= ~256 steps), the trace of the initial Neural Tangent Kernel scales approximately with the number of parameter layers contributing non-vanishing Jacobians, enabling deeper normalized architectures (e.g., 5-block vs 3-block MLPs) to achieve greater function-space output displacement per step.", "Under Adam or AdamW optimization under short step budgets (T <= ~512 steps), inserting LayerNorm within hidden blocks conditions per-layer gradient scales and maintains uniform effective step sizes across units, providing a modest secondary convergence advantage over unnormalized residual blocks of matched width when primary architectural choices (activation function and hidden width) are held identical.", "In unnormalized MLPs under default linear initialization (where post-activation feature variance attenuates by ~1/3 per unnormalized layer), residual skip connections preserve feature scale across layers and maintain ~2-3x larger final-layer activation magnitude sum_i |h_i| than plain blocks, increasing output-head leverage and achievable output displacement per step (delta_out <= lr * T * sum_i |h_i|) under short step budgets (T <= ~512 steps).", "For continuous regression tasks under tight step budgets (T <= ~256 steps), shallow residual MLPs (2 hidden layers) with a single LayerNorm placed on the initial hidden layer achieve faster loss reduction than unnormalized or multi-normalized deeper architectures (3+ layers), because minimal normalization overhead stabilizes early gradient flow without allocating limited parameter updates across multiple scale and shift parameters.", "On smooth additive non-linear classification tasks under displacement-limited optimization (such as Adagrad over T <= ~256 steps with cumulative displacement ~ 2*lr*sqrt(T) <= ~0.1), moderate-depth residual MLPs (2-3 hidden layers, width >= 64) with complete LayerNorm coverage achieve superior test cross-entropy compared to deeper narrow networks (depth >= 5) or partially normalized configurations, because additive decision boundaries do not require deep composition and complete normalization preserves gradient flow without spreading weight displacement across unnecessary layers.", "In residual MLPs trained under moderate optimization budgets (T ~ 1000 steps), applying LayerNorm to a sufficient proportion of residual blocks (such as 2 out of 3 blocks) provides necessary activation stabilization, whereas sparse normalization coverage in deeper networks (such as 1 out of 5 blocks) allows variance accumulation across unnormalized skip paths, degrading convergence rate and test cross-entropy on non-linear classification tasks.", "On smooth 1D regression tasks with oscillatory and multiplicative structure (such as cos(2*pi*x)*(x+1)) under moderate step budgets (T ~ 1000 steps) and standard adaptive learning rates (lr ~ 3e-3, cumulative displacement ~lr * T ≈ 3.0), moderate-depth residual MLPs (depth ~ 3, width ~ 16) achieve superior target fitting compared to shallow wide networks (depth 1, lacking compositional depth) or deep non-residual networks (depth >= 4, impaired gradient flow), because compositional depth combined with residual skip connections enables efficient hierarchical feature representation.", "Under short step budgets (T <= ~256 steps) on complex non-linear classification tasks (such as a 3-turn spiral), candidate ranking across residual architectures using adaptive optimizers is governed by cumulative parameter displacement (~lr * T); an order-of-magnitude higher learning rate (lr ~ 3e-3 vs ~3e-4) yields ~10x larger cumulative displacement (~0.77 vs ~0.08), dominating cross-entropy reduction by enabling parameters to escape the chance loss plateau (CE ≈ ln(2) ≈ 0.693).", "On classification tasks with zero linear baseline signal (such as XOR) under short step budgets (T <= ~256 steps), sign-normalizing adaptive optimizers (Adam or AdamW) at moderate learning rates (lr ~ 3e-4) achieve cumulative parameter displacement (~lr * T ≈ 0.077) nearly two orders of magnitude larger than Adagrad at severely undersized learning rates (lr <= ~3e-5, displacement ~ 2 * lr * sqrt(T) ≈ 0.001), providing sufficient parameter movement to escape the chance loss plateau (CE ≈ 0.693) and form multiplicative feature interactions.", "On continuous MSE regression tasks with large constant target offsets under moderate step budgets (T <= ~1000 steps), momentum SGD (m = 0.9) achieves a ~10x effective learning rate amplification (lr_eff = lr / (1 - m)) over unaccelerated SGD at the same nominal learning rate, yielding substantially greater cumulative parameter displacement and rapid output bias alignment that dominates minor regularization variations (such as weight decay 1e-4 vs 1e-3).", "On sparse multiplicative classification tasks (such as products of 2-3 active features) under moderate step budgets (T ~ 2000 steps) with standard adaptive learning rates (AdamW lr ~ 1e-3, cumulative displacement ~lr * T ≈ 2.0), depth 3-4 unnormalized MLPs achieve superior test cross-entropy compared to shallow depth-2 networks or residual MLPs, because compositional depth without residual shortcuts enables effective construction of multiplicative feature hierarchies without a direct token-embedding lookup table, making additional layers introduce unnecessary gradient path length and parameter displacement requirements without representational benefit.", "On bigram language modeling tasks under moderate step budgets (T ~ 512 steps), learning fixed transition matrices requires sufficient cumulative parameter displacement in token embeddings and output heads; RMSprop at moderate learning rates (lr ~ 3e-4) achieves enhanced early displacement via zero-initialized square-gradient accumulator amplification (~10x effective step size decay over early steps), outperforming smaller learning rate adaptive optimizers (lr <= ~1e-4) and unaccelerated SGD.", "On non-linear univariate regression tasks under short step budgets (T <= ~256 steps) with unaccelerated SGD at moderate learning rates (lr ~ 3e-3), residual connections enable deeper MLPs (depth >= 4) to achieve lower test MSE than shallower non-residual MLPs (depth 2-3), because identity shortcuts preserve direct gradient pathways (~lr * T * ||grad||) across all layers, preventing the compounding gradient attenuation through sequential weight matrices that restricts early-layer parameter displacement in non-residual networks.", "On smooth additive non-linear classification tasks under moderate step budgets (T ~ 1000 steps) with Adagrad, complete LayerNorm coverage across all residual blocks provides superior gradient stability compared to partial normalization, enabling deeper residual architectures (depth ~ 5 blocks) to achieve lower test cross-entropy than shallower wider networks (depth ~ 2 blocks) despite reduced layer width.", "On bigram language modeling tasks where the target distribution depends strictly on immediate preceding tokens P(y_t | x_{t-1}), recurrent architectures (such as 2-layer GRUs) achieve superior sample efficiency and faster convergence under short step budgets (T <= ~512 steps) compared to transformer architectures, because recurrent hidden state propagation directly captures single-step temporal lookup without requiring learned positional encodings or attention patterns.", "On complex multivariate regression targets with multiplicative and non-linear interactions under moderate step budgets (T ~ 512 steps), RMSprop at standard learning rates (lr ~ 1e-4) achieves cumulative parameter displacement of ~lr * T (~0.05-0.08, accelerated by early-step accumulator amplification), enabling sufficient feature movement to fit target structure, whereas RMSprop at severely reduced learning rates (lr <= 3e-5) restricts cumulative displacement to ~0.015-0.025, leaving parameters trapped near initialization with insufficient capacity to fit non-linear feature interactions.", "On smooth univariate periodic regression tasks (e.g., sin(2*pi*x)) under short step budgets (T <= ~256 steps) and small learning rates (lr ~ 1e-4), moderately shallow networks (2-3 hidden layers) achieve lower test MSE than both deep architectures (depth >= 5 layers) and single-layer networks, because moderate depth provides sufficient non-linear expressiveness while maintaining short gradient paths that allow parameters across all layers to achieve effective cumulative displacement (~lr * T ≈ 0.026), whereas deeper architectures suffer from attenuated per-layer displacement.", "On complex non-linear multivariate regression under moderate step budgets (T ~ 512 steps), Adam at standard learning rates (lr ~ 1e-3) with reduced second-moment decay (beta2 ~ 0.95) balances cumulative parameter displacement (~lr * T ≈ 0.5) with per-parameter adaptive step-size control, outperforming both unaccelerated SGD (which stalls after initial output-bias alignment due to vanishing MSE gradients) and elevated-rate RMSprop (lr ~ 3e-3), whose larger nominal displacement (~1.5) risks generalization degradation without Adam's momentum gradient smoothing.", "On complex non-linear decision boundaries under moderate step budgets (T ~ 1000 steps), optimizer cumulative parameter displacement dominates architectural depth; a shallow single-hidden-layer normalized network paired with strong adaptive optimizers (RMSprop or Adam at lr ~ 1e-3, displacement ~1.0) outperforms deeper multi-layer networks paired with displacement-limited optimizers (Adagrad at lr ~ 3e-4, displacement ~0.02, or momentum SGD with suppressed initial gradients).", "For stationary bigram next-token prediction under moderate step budgets (T ~ 1000 steps), unaccelerated SGD at standard learning rates (lr ~ 3e-3) achieves cumulative parameter displacement of ~lr * T ≈ 3.0, providing sufficient gradient-driven displacement to fit token transition statistics, whereas SGD with momentum at severely reduced base learning rates (lr <= 3e-5, effective lr ~ 3e-4) restricts cumulative displacement to ~0.3, leaving cross-entropy optimization under-converged.", "In causal transformer language models trained on fixed bigram next-token prediction tasks, architectural capacity beyond a baseline threshold (such as 2 vs 4 attention heads or 3 vs 4 layers when total parameter count substantially exceeds vocab_size^2) has a negligible impact on test cross-entropy compared to optimizer parameter displacement, as learning the transition matrix depends primarily on step size rather than excess model depth or head multi-branching.", "On smooth univariate periodic regression tasks under short step budgets (T <= ~256 steps) and small learning rates (lr ~ 1e-4), wider shallow MLPs (depth 2, width 128) equipped with LayerNorm and non-dying activations (LeakyReLU) achieve lower test MSE than deeper narrower MLPs (depth 3, width 64), because greater width increases per-layer representational capacity while shorter depth avoids backpropagation gradient attenuation under limited optimization horizons.", "On continuous regression tasks under limited step budgets (T <= ~256 steps), combining LayerNorm with LeakyReLU activation maintains gradient stability and prevents dead units relative to unnormalized ReLU networks, enabling more consistent per-step parameter updates and lower test MSE across optimization trajectories.", "On short step budgets (T <= ~256 steps) fitting complex non-linear decision boundaries, un-bias-corrected RMSprop at small learning rates (lr ~ 1e-4, alpha ~ 0.99) produces initial step amplification that yields cumulative parameter displacement of ~lr * T / sqrt(1 - alpha) (~0.03), placing it intermediate between severely restricted optimizers (displacement <= ~0.008) and standard-rate Adam with reduced second-moment decay (beta2 ~ 0.95, displacement ~0.08) which achieves sufficient parameter movement to escape the chance classification plateau.", "On zero-linear-signal classification tasks (such as XOR) under short step budgets (T <= ~256 steps), RMSprop at small learning rates (lr ~ 3e-5) with zero-initialized squared-gradient accumulators achieves effective cumulative parameter displacement (~0.015-0.020) via early-step accumulator amplification, substantially outperforming Adagrad at similar or higher learning rates (lr ~ 3e-5 to 1e-4, displacement ~0.001-0.003), as breaking initialization symmetry to form multiplicative feature interactions requires exceeding a minimal parameter movement threshold.", "For shallow, narrow MLPs (depth 2-3, width <= 32) on non-linear binary classification with piecewise feature interactions under short step budgets (T <= ~256 steps) trained with Adam at standard learning rates (lr ~ 1e-3), architectures combining residual connections and LayerNorm achieve lower test cross-entropy than plain feedforward architectures of identical depth and width, because LayerNorm stabilizes pre-activation distributions against gradient saturation while residual paths enable incremental feature updates to escape near-chance loss plateaus.", "On complex multivariate regression tasks with non-linear multiplicative and oscillatory interactions under moderate step budgets (T ~ 1000 steps), AdamW at standard learning rates (lr ~ 1e-3) with reduced second-moment decay (beta2 ~ 0.95) achieves cumulative parameter displacement ~lr * T (~1.0) and rapid adaptation (~T / (1 / (1 - beta2)) ≈ 50 adaptation cycles), enabling sufficient weight movement and per-parameter calibration to outperform undersized learning rates (lr ~ 1e-4, displacement ~0.1) and displacement-capped optimizers like Adagrad (~2 * lr * sqrt(T) ≈ 0.19).", "Under extreme displacement limitation (cumulative parameter displacement lr * T <= ~0.01) where networks remain trapped near initialization, candidate ranking among residual architectures is governed by gradient flow efficiency: shallow residual MLPs (depth 2-3) achieve lower test loss than deeper residual MLPs (depth >= 5) because backpropagated gradients suffer less cumulative attenuation across fewer layers, whereas deep non-residual MLPs fail entirely due to severe unnormalized gradient decay.", "On smooth 1D periodic regression tasks (e.g., cos(2*pi*x)) under short step budgets (T <= ~256 steps) with adaptive optimizers at standard learning rates (lr ~ 1e-3), shallow non-residual MLPs (2 hidden layers) achieve lower test MSE than single-layer residual MLPs of equal or greater width, because the residual addition pattern (h_out = act(h_in + Linear(norm(h_in)))) constrains hidden representations to additive perturbations of input states, whereas unrestricted feedforward layers can construct the independent phase-shifted oscillatory features required for periodic targets.", "On bigram language modeling tasks with small vocabulary (V ~ 48) under short step budgets (T <= ~256 steps), transformer architectures with depth >= 1 and width d_model >= 64 provide sufficient representational capacity to learn token transition tables P(y|x), rendering architectural variations (depth 1-4, width 64-128) secondary to cumulative parameter displacement in candidate ranking.", "On highly non-linear classification tasks with zero linear baseline signal (such as two-spirals) under short step budgets (T <= ~256 steps), candidate ranking requires both sufficient architectural depth with residual connections and sign-normalized adaptive optimization (RMSprop or Adam achieving cumulative displacement ~lr * T); unaccelerated SGD stalls near chance loss (CE ≈ ln 2) due to near-zero raw gradients regardless of depth, while Adagrad remains displacement-limited (~2 * lr * sqrt(T)).", "On complex univariate oscillatory regression targets (such as frequency-modulated sine waves) under moderate step budgets (T ~ 1000 steps) with identical optimizer displacement (~lr * T ≈ 0.1), single-hidden-layer networks remain representational-capacity-limited even with residual connections; deeper architectures with adequate LayerNorm coverage (depth >= 2) outperform shallow networks by enabling multi-scale feature composition.", "Under displacement-limited Adagrad optimization (cumulative displacement ~2 * lr * sqrt(T) <= ~0.05) on piecewise linear decision boundaries, fitting conditional gating structures requires sufficient architectural depth (depth >= 4 hidden layers); alternating LayerNorm preserves gradient scale through depth, enabling deeper narrower networks to outperform shallower wider networks by maintaining per-layer parameter updates despite step-size decay.", "On smooth non-linear classification tasks with mixed polynomial and oscillatory feature structure under short step budgets (T <= ~256 steps) trained with AdamW at standard learning rates (lr ~ 1e-3, cumulative displacement ~lr * T ≈ 0.26), moderately wide shallow MLPs (width 24-32, depth 2-3) achieve lower test cross-entropy than narrow deep networks (width <= 16, depth >= 5) or single-layer networks of comparable parameter count, because moderate width provides sufficient parallel capacity to simultaneously fit independent non-linear coordinate components while short depth preserves gradient flow without composition bottlenecks.", "On univariate piecewise-smooth regression tasks containing localized gradient discontinuities (such as absolute-value kinks) under short step budgets (T <= ~512 steps) trained with SGD with momentum at moderate learning rates (lr ~ 3e-4), shallow non-residual MLPs (1-2 hidden layers) achieve lower test MSE than shallow residual MLPs of equal width, because residual shortcut connections constrain hidden representations to additive perturbations of input states, whereas unrestricted feedforward layers can directly form localized non-linear basis functions to fit non-smooth target features.", "On tabular classification tasks with smooth additive non-linear target structure under moderate step budgets (T ~ 1024 steps) trained with AdamW at standard learning rates (lr ~ 3e-3), intermediate-width shallow MLPs (width ~64, depth 2 hidden layers) achieve lower test cross-entropy than narrow deep MLPs (width ~32, depth >= 5 hidden layers) of comparable parameter count, because fitting independent coordinate-wise non-linear features benefits from representational width, whereas deep compositions spread gradient updates across many layers, requiring larger per-layer cumulative displacement to achieve effective convergence.", "On non-linear classification tasks requiring multiplicative feature interactions (such as XOR) under moderate step budgets (T ~ 2000 steps), Adagrad requires a learning rate lr >= ~3e-4 to achieve cumulative parameter displacement (~2 * lr * sqrt(T) ≈ 0.027) sufficient to escape chance loss plateaus (CE ≈ 0.693), whereas Adagrad at undersized learning rates (lr <= 1e-4, cumulative displacement <= ~0.009) leaves parameters trapped near initialization.", "For causal transformer language models trained on fixed Markov chain bigram prediction under moderate step budgets (T ~ 1024 steps), model capacity differences (e.g., 1-layer d_model=128 vs multi-layer d_model=64) exert secondary influence on test cross-entropy compared to optimizer cumulative displacement (~lr * T for Adam vs ~2 * lr * sqrt(T) for Adagrad), as all candidate architectures possess sufficient representational capacity to memorize small transition tables (e.g., 24x24), making optimization efficiency the dominant candidate ranking factor.", "On continuous multivariate regression tasks combining periodic and linear target components under moderate step budgets (T ~ 512 steps), sign-normalizing optimizers (AdamW) at standard learning rates (lr ~ 3e-3) achieve cumulative parameter displacement ~lr * T (~1.5), enabling sufficient exploration to fit both oscillatory and linear structure; RMSprop at the same learning rate achieves comparable early displacement via zero-initialized accumulator amplification (~1/sqrt(1-alpha) early step boost) but can exhibit convergence instability, whereas unaccelerated SGD at small learning rates (lr ~ 3e-4) yields negligible displacement (~0.15) and leaves parameters under-trained near initialization.", "On classification tasks with zero linear baseline signal (such as XOR) under short step budgets (T <= ~256 steps) at severely undersized learning rates (lr <= ~3e-5), sign-normalizing optimizers (Adam/AdamW) achieve cumulative parameter displacement ~lr * T (~0.008), which provides an ~8x displacement advantage over Adagrad (~2 * lr * sqrt(T) ≈ 0.001); this additional movement enables the network to begin forming multiplicative feature interactions and escape the chance loss plateau (CE ≈ ln(2) ≈ 0.693), whereas Adagrad remains trapped near initialization.", "On complex multivariate regression tasks combining polynomial and oscillatory target interactions under short step budgets (T <= ~256 steps), fitting non-linear multiplicative structure requires cumulative parameter displacement exceeding ~0.5; RMSprop at standard learning rates (lr ~ 3e-3) achieves this required displacement threshold via zero-initialized accumulator amplification (~lr * T / sqrt(1 - alpha) > 0.77), outperforming undersized AdamW (lr <= ~1e-4, displacement ~0.025) and unaccelerated SGD (lr <= ~3e-4, displacement ~0.077) which remain trapped near initialization.", "On classification tasks with zero linear baseline signal and high-curvature decision boundaries (such as two-spiral patterns) under short step budgets (T <= ~256 steps), sign-normalizing adaptive optimizers (Adam/AdamW) at moderate learning rates (lr ~ 3e-4) achieve cumulative parameter displacement ~lr * T (~0.08) regardless of gradient scale, breaking initialization symmetry to begin carving non-linear features; in contrast, SGD with momentum at identical base learning rates produces displacement scaling with raw gradient magnitude (~ (lr / (1 - m)) * T * ||grad||), which stalls near zero when initialization gradients are small, leaving the network trapped at the chance loss plateau (CE ≈ ln(2) ≈ 0.693).", "On 1-D smooth regression targets (such as low-order sinusoidal functions) trained under short step budgets (T <= ~256 steps) with identical adaptive optimizers (Adam or AdamW at lr ~ 1e-3), candidate ranking is dominated by hidden layer width rather than depth; the initial linear projection Linear(1, W) constructs W distinct univariate basis functions phi_i(x) = activation(w_i * x + b_i), yielding roughly monotonic reductions in test MSE as hidden width W increases across the range 32 to 128.", "When fitting smooth 1-D continuous targets under short step budgets (T <= ~256 steps), identity-skip residual blocks preserve direct univariate feature paths to the output head while shortening effective gradient propagation, achieving faster MSE reduction than deeper non-residual stacks (depth >= 4 hidden layers) where signals must traverse multiple un-updated non-linear transformations.", "Under displacement-limited step budgets (lr <= ~3e-5, effective lr ~ 3e-4 over T <= ~1024 steps) with unnormalized MSE loss, output-head dynamics approximate linear regression on random features where per-step eigendirection contraction scales with last-hidden-layer activation energy E[||h||^2]; architectures that preserve activation scale across layers (such as Le
