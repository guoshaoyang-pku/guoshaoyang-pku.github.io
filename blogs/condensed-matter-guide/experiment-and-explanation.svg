<title>从实验信号到可检验的物理解释</title><style>svg{font-family:"PingFang SC","Noto Sans CJK SC","Hiragino Sans GB",Arial,sans-serif;background:#faf9f5}.shape{fill:#fff;stroke:#c5c3ba;stroke-width:1.1}.orange .shape{fill:#f9eee7;stroke:#d97757}.blue .shape{fill:#eef3f8;stroke:#6a9bcc}.green .shape{fill:#f1f4ed;stroke:#788c5d}text{fill:#141413}.t{font-size:18px;font-weight:500}.s{font-size:14px;fill:#5e5d59}.xs{font-size:13px;fill:#5e5d59}.ink{fill:#141413}.orange-ink{fill:#9e4a31}.connector{stroke:#939186;stroke-width:1.25;fill:none}.secondary{stroke:#b0aea5;stroke-dasharray:4 5}.orange-line{stroke:#d97757;stroke-width:1.7;fill:none}.blue-line{stroke:#6a9bcc;stroke-width:1.7;fill:none}.green-line{stroke:#788c5d;stroke-width:1.7;fill:none}.export-title{font-size:25px;font-weight:600}.export-source{font-size:11px;fill:#5e5d59}</style><rect x="0" y="-66" width="712.0" height="684.0" fill="#faf9f5" /><text x="20" y="-27" class="export-title">从实验信号到可检验的物理解释</text><defs><marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#939186" /></marker></defs>
<g class="node"><rect class="shape" x="18" y="18" width="201" height="93" rx="5" /><text class="t" x="36" y="50">制备与表征</text><text class="s" x="36" y="77">样品、栅极、接触、结构</text><text class="xs" x="36" y="97">知道实际测的是什么</text></g>
<g class="node"><rect class="shape" x="257" y="18" width="199" height="93" rx="5" /><text class="t" x="275" y="50">改变实验条件</text><text class="s" x="275" y="77">电场、磁场、温度、光</text><text class="xs" x="275" y="97">控制系统受到的扰动</text></g>
<g class="node blue"><rect class="shape" x="494" y="18" width="200" height="93" rx="5" /><text class="t" x="512" y="50">读出信号</text><text class="s" x="512" y="77">电流、电压、吸收、电容</text><text class="xs" x="512" y="97">测量有误差与器件影响</text></g>
<path class="connector" d="M219 64H245" marker-end="url(#arrow3)" /><path class="connector" d="M456 64H482" marker-end="url(#arrow3)" /><path class="connector" d="M594 111V162H357V190" marker-end="url(#arrow3)" />
<g class="node blue"><rect class="shape" x="154" y="202" width="404" height="94" rx="5" /><text class="t" x="176" y="235">找到可重复的现象</text><text class="s" x="176" y="261">峰、平台、高阻区、临界温度、对称性变化</text><text class="xs" x="176" y="281">“出现异常”还不是“知道是哪一种相”</text></g>
<path class="connector" d="M280 296V338H179V365" marker-end="url(#arrow3)" /><path class="connector" d="M436 296V338H537V365" marker-end="url(#arrow3)" />
<g class="node orange"><rect class="shape" x="18" y="377" width="318" height="107" rx="5" /><text class="t" x="39" y="410">理论与计算提出候选机制</text><text class="s" x="39" y="437">模型 → 内部状态 → 多个观测预测</text><text class="xs" x="39" y="465">同一信号可以有不同来源</text></g>
<g class="node green"><rect class="shape" x="375" y="377" width="319" height="107" rx="5" /><text class="t" x="396" y="410">实验设计判别测量</text><text class="s" x="396" y="437">第二种探针、新条件、新样品</text><text class="xs" x="396" y="465">检验没有参与拟合的预测</text></g>
