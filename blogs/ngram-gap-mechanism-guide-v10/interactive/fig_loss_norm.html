const STATE = {loss:'both', branch:'bigram', normOn:{gate_rms:true, table_rms:true, gated_rms:true}};
const EPOCH = DATA.epoch_boundaries; const ONSET = DATA.gap_onset;
const $=s=>document.querySelector(s);
const NORM_META = {
  gate_rms:  {label:'gate_rms (gate 幅度)',      color:'#353d79', axis:'right'},
  table_rms: {label:'table content RMS (raw)',   color:'#b67524', axis:'right'},
  gated_rms: {label:'gated value RMS (注入)',    color:'#236b70', axis:'right'},
};
function renderBtns(sel,st){document.querySelectorAll(sel+' .btn').forEach(b=>b.classList.toggle('active',b.dataset.v===STATE[st]));}
function renderNormSeries(){
  const el=$('#norm-series'); el.innerHTML='';
  Object.entries(NORM_META).forEach(([k,m])=>{
    const w=document.createElement('label'); w.className='sit';
    const c=document.createElement('input'); c.type='checkbox'; c.checked=STATE.normOn[k];
    c.onchange=()=>{STATE.normOn[k]=c.checked;render();};
    const s=document.createElement('span'); s.className='ssw'; s.style.background=m.color;
    const t=document.createElement('span'); t.textContent=m.label;
    w.appendChild(c);w.appendChild(s);w.appendChild(t); el.appendChild(w);
  });
}
function lossCurves(){
  if(STATE.loss==='train') return [{pts:DATA.loss.train,color:'#2d6f9f',dash:'none',axis:'left',label:'train'}];
  if(STATE.loss==='val')   return [{pts:DATA.loss.val,color:'#c4493d',dash:'none',axis:'left',label:'val'}];
  if(STATE.loss==='gap'){
    const tr=new Map(DATA.loss.train.map(p=>[p[0],p[1]]));
    const g=DATA.loss.val.filter(p=>tr.has(p[0])).map(p=>[p[0],p[1]-tr.get(p[0])]);
    return [{pts:g,color:'#c4493d',dash:'none',axis:'left',label:'gap'}];
  }
  return [{pts:DATA.loss.train,color:'#2d6f9f',dash:'none',axis:'left',label:'train'},
          {pts:DATA.loss.val,color:'#c4493d',dash:'5 3',axis:'left',label:'val'}];
}
function render(){
  const svg=$('#chart'); const W=960,H=480, PL=58,PR=58,PT=34,PB=52;
  const xlo=0,xhi=1000;
  const lcurves=lossCurves();
  const branch=STATE.branch; const norms=DATA.norms[branch];
  const ncurves=[];
  Object.entries(NORM_META).forEach(([k,m])=>{
    if(STATE.normOn[k] && norms[k].length) ncurves.push({pts:norms[k],color:m.color,dash:'none',axis:'right',label:m.label});
  });
  // ranges
  const lvals=lcurves.flatMap(c=>c.pts.map(p=>p[1]));
  const nvals=ncurves.flatMap(c=>c.pts.map(p=>p[1]));
  let llo=Math.min(...lvals),lhi=Math.max(...lvals); let lp=(lhi-llo)*0.08||0.5; llo-=lp;lhi+=lp;
  if(STATE.loss==='gap'){llo=Math.min(0,llo);}
  let nlo=Math.min(0,...nvals),nhi=Math.max(...nvals); let np=(nhi-nlo)*0.08||0.05; nlo-=np;nhi+=np;
  if(!isFinite(nlo)){nlo=0;nhi=1;}
  const sx=x=>PL+(x-xlo)/(xhi-xlo)*(W-PL-PR);
  const syl=y=>PT+(1-(y-llo)/(lhi-llo))*(H-PT-PB);
  const syn=y=>PT+(1-(y-nlo)/(nhi-nlo))*(H-PT-PB);
  let s=`<rect width="${W}" height="${H}" fill="#fffdf8"/>`;
  // left y grid
  const nl=5;
  for(let i=0;i<=nl;i++){const v=llo+(lhi-llo)*i/nl;const y=syl(v);
    s+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#ece5d8"/>`;
    s+=`<text x="${PL-6}" y="${y+3}" text-anchor="end" font-size="10" fill="#686d73">${v.toFixed(2)}</text>`;}
  // right y ticks
  for(let i=0;i<=nl;i++){const v=nlo+(nhi-nlo)*i/nl;const y=syn(v);
    s+=`<text x="${W-PR+6}" y="${y+3}" text-anchor="start" font-size="10" fill="#9a8a5a">${v.toFixed(3)}</text>`;}
  // x ticks
  for(let x=0;x<=1000;x+=200){s+=`<line x1="${sx(x)}" y1="${H-PB}" x2="${sx(x)}" y2="${H-PB+4}" stroke="#c8c1b6"/>`;
    s+=`<text x="${sx(x)}" y="${H-PB+16}" text-anchor="middle" font-size="10" fill="#686d73">${x}</text>`;}
  EPOCH.forEach((b,i)=>{s+=`<line x1="${sx(b)}" y1="${PT}" x2="${sx(b)}" y2="${H-PB}" stroke="#8a8176" stroke-dasharray="4 3"/>`;
    s+=`<text x="${sx(b)}" y="${PT-5}" text-anchor="middle" font-size="9.5" fill="#8a8176">e${i+2}</text>`;});
  if(ONSET){s+=`<line x1="${sx(ONSET)}" y1="${PT}" x2="${sx(ONSET)}" y2="${H-PB}" stroke="#c4493d" stroke-dasharray="2 3" opacity=".7"/>`;
    s+=`<text x="${sx(ONSET)}" y="${H-PB+30}" text-anchor="middle" font-size="9" fill="#c4493d">gap onset</text>`;}
  if(llo<0&&lhi>0)s+=`<line x1="${PL}" y1="${syl(0)}" x2="${W-PR}" y2="${syl(0)}" stroke="#232426" stroke-width="0.8"/>`;
  s+=`<line x1="${PL}" y1="${PT}" x2="${PL}" y2="${H-PB}" stroke="#c8c1b6"/>`;
  s+=`<line x1="${W-PR}" y1="${PT}" x2="${W-PR}" y2="${H-PB}" stroke="#c8c1b6"/>`;
  s+=`<line x1="${PL}" y1="${H-PB}" x2="${W-PR}" y2="${H-PB}" stroke="#c8c1b6"/>`;
  s+=`<text x="${(PL+W-PR)/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="#686d73">training step</text>`;
  s+=`<text x="14" y="${(PT+H-PB)/2}" text-anchor="middle" font-size="11" fill="#2d6f9f" transform="rotate(-90 14 ${(PT+H-PB)/2})">loss (左轴)</text>`;
  s+=`<text x="${W-8}" y="${(PT+H-PB)/2}" text-anchor="middle" font-size="11" fill="#9a8a5a" transform="rotate(90 ${W-8} ${(PT+H-PB)/2})">n-gram norm (右轴)</text>`;
  // norm curves (right axis, behind)
  ncurves.forEach(c=>{
    if(c.pts.length<2)return;
    s+=`<polyline points="${c.pts.map(p=>sx(p[0]).toFixed(1)+','+syn(p[1]).toFixed(1)).join(' ')}" fill="none" stroke="${c.color}" stroke-width="2.2" stroke-linejoin="round" opacity="0.85"/>`;
  });
  // loss curves (left axis, front)
  lcurves.forEach(c=>{
    if(c.pts.length<2)return;
    const d=c.dash==='none'?'':` stroke-dasharray="${c.dash}"`;
    s+=`<polyline points="${c.pts.map(p=>sx(p[0]).toFixed(1)+','+syl(p[1]).toFixed(1)).join(' ')}" fill="none" stroke="${c.color}" stroke-width="1.9" stroke-linejoin="round"${d}/>`;
  });
  svg.innerHTML=s+'</svg>';
  // legend
  let lg='';
  if(STATE.loss==='both') lg+='<span><i class="lw" style="background:#2d6f9f"></i>train loss</span><span><i class="lw" style="background:repeating-linear-gradient(90deg,#c4493d 0 5px,transparent 5px 9px)"></i>val loss</span>';
  else {const col=STATE.loss==='gap'?'#c4493d':(STATE.loss==='train'?'#2d6f9f':'#c4493d');lg+=`<span><i class="lw" style="background:${col}"></i>${STATE.loss}</span>`;}
  Object.entries(NORM_META).forEach(([k,m])=>{if(STATE.normOn[k]&&DATA.norms[STATE.branch][k].length)lg+=`<span><i class="lw" style="background:${m.color}"></i>${m.label}</span>`;});
  lg+='<span style="margin-left:6px;color:#8a8176">┊ epoch</span><span style="color:#c4493d">┊ gap onset</span>';
  $('#legend').innerHTML=lg;
  $('#note').innerHTML = `当前 context = <b>${STATE.branch}</b>。<b>左轴 loss / 右轴 n-gram norm（双轴）</b>。${STATE.branch==='unigram'?'unigram 的 table = token embedding 维度的 value table，频次即 token 频次（Zipf）。':'table content RMS 在训练中持续增长（raw value norm），gate 部分调节，<b>gated value RMS（注入）= gate × table</b> 才是真正加到 value head 的量。'}判据：注入 norm 的增长时点是否与 gap 爆发对齐——对齐则支持"table 累积 pattern 经 gate 通道被放大"的机理。`;
  renderRateTab();
}
function renderRateTab(){
  const eb=[0,...EPOCH,1000]; const wins=[[eb[0],eb[1]],[eb[1],eb[2]],[eb[2],eb[3]]];
  const branch=STATE.branch; const norms=DATA.norms[branch];
  function rate(arr,lo,hi){const pts=arr.filter(p=>p[0]>=lo&&p[0]<=hi);if(pts.length<2)return null;const[a,b]=pts;return (b[1]-a[1])/(b[0]-a[0]);}
  function gapMax(lo,hi){const tr=new Map(DATA.loss.train.map(p=>[p[0],p[1]]));const g=DATA.loss.val.filter(p=>tr.has(p[0])&&p[0]>=lo&&p[0]<=hi).map(p=>p[1]-tr.get(p[0]));return g.length?Math.max(...g):null;}
  let rows=[['epoch','gate_rms Δ/step','table RMS Δ/step','gated RMS Δ/step','该 epoch max gap']];
  wins.forEach((w,i)=>{
    rows.push([`epoch ${i+1}`,
      rate(norms.gate_rms,...w)?.toExponential(2)??'—',
      rate(norms.table_rms,...w)?.toExponential(2)??'—',
      rate(norms.gated_rms,...w)?.toExponential(2)??'—',
      gapMax(...w)?.toFixed(3)??'—']);
  });
  $('#ratetab').innerHTML = '<thead><tr>'+rows[0].map(h=>`<th>${h}</th>`).join('')+'</tr></thead><tbody>'+
    rows.slice(1).map(r=>'<tr>'+r.map((c,i)=>`<td class="${i?'tdnum':''}">${c}</td>`).join('')+'</tr>').join('')+'</tbody>';
}
document.querySelectorAll('#loss-btns .btn').forEach(b=>b.onclick=()=>{STATE.loss=b.dataset.v;renderBtns('#loss-btns','loss');render();});
document.querySelectorAll('#branch-btns .btn').forEach(b=>b.onclick=()=>{STATE.branch=b.dataset.v;renderBtns('#branch-btns','branch');render();});
const svgEl=$('#chart');const tip=$('#tip');
svgEl.addEventListener('mousemove',e=>{
  const r=svgEl.getBoundingClientRect();const W=960,PL=58,PR=58;const sc=W/r.width;
  const xstep=(e.clientX-r.left)/sc; if(xstep<PL||xstep>W-PR){tip.classList.remove('show');return;}
  const xs=(xstep-PL)/(W-PL-PR)*1000;
  const near=(arr)=>{let b=null;arr.forEach(p=>{if(!b||Math.abs(p[0]-xs)<Math.abs(b[0]-xs))b=p;});return b;};
  let rows=[];
  lossCurves().forEach(c=>{const b=near(c.pts);if(b)rows.push({label:c.label,color:c.color,val:b[1],step:b[0]});});
  Object.entries(NORM_META).forEach(([k,m])=>{if(STATE.normOn[k]&&DATA.norms[STATE.branch][k].length){const b=near(DATA.norms[STATE.branch][k]);if(b)rows.push({label:m.label,color:m.color,val:b[1],step:b[0]});}});
  if(!rows.length){tip.classList.remove('show');return;}
  rows.sort((a,b)=>b.val-a.val);
  tip.innerHTML=`<b>step ≈ ${rows[0].step}</b><br>`+rows.map(r=>`<span style="display:inline-block;width:9px;height:9px;background:${r.color};border-radius:2px;margin-right:5px"></span>${r.label}: <b>${r.val.toFixed(3)}</b>`).join('<br>');
  tip.classList.add('show');
  let tx=e.clientX-tip.offsetWidth-10,ty=e.clientY-tip.offsetHeight-10;
  if(tx<0)tx=e.clientX+10; if(ty<0)ty=e.clientY+10;
  tip.style.left=tx+'px';tip.style.top=ty+'px';
});
svgEl.addEventListener('mouseleave',()=>tip.classList.remove('show'));
$('#setting-line').textContent = DATA.setting + ' · epoch 边界 ' + JSON.stringify(EPOCH) + ' · gap onset step ' + ONSET;
renderNormSeries(); render();
</script></body></html>
