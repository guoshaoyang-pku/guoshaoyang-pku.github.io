<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Graphene Autolab 目标架构</title>
  <desc id="desc">文献现象变成带条件的研究问题。样品参数进入各自的 AB 或 MATBG Hamiltonian，运行控制进入查询接口。模拟与低温仪器是两个并行后端，使用共同的行动和观测描述。现有证据先产生候选解释，系统在新查询前冻结预测，再由独立批评器检验并更新知识图。</desc>
  <defs>
    <style>
      .ink{fill:#182b3a}.muted{fill:#51616d}.small{font:15px -apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',Arial,sans-serif}.body{font:17px -apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',Arial,sans-serif}.title{font:600 25px -apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',Arial,sans-serif}.lane{fill:#f7fafb;stroke:#d4dde3;stroke-width:1.5}.node{fill:#fff;stroke:#9fb2bc;stroke-width:1.5}.accent{fill:#e8f2f5;stroke:#176484;stroke-width:1.8}.warm{fill:#fff5ee;stroke:#c46f45;stroke-width:1.8}.arrow{fill:none;stroke:#51616d;stroke-width:2;marker-end:url(#arr)}.loop{fill:none;stroke:#c46f45;stroke-width:2.2;marker-end:url(#arrWarm)}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#51616d"/></marker>
    <marker id="arrWarm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c46f45"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#fff"/>
  <text x="48" y="42" class="title ink">Graphene Autolab：从论文现象到可检验的统一图景</text>
  <text x="48" y="68" class="small muted">一条物理链路，接入多个模型和两个并行执行后端；每次结论都带有条件、预测和证据。</text>

  <rect x="32" y="96" width="1136" height="92" rx="12" class="lane"/>
  <text x="52" y="122" class="body ink" font-weight="600">文献与问题层</text>
  <rect x="52" y="136" width="184" height="35" rx="7" class="node"/><text x="144" y="159" text-anchor="middle" class="small ink">论文 / 数据 / 条件</text>
  <rect x="288" y="136" width="184" height="35" rx="7" class="accent"/><text x="380" y="159" text-anchor="middle" class="small ink">claim：现象主张</text>
  <rect x="524" y="136" width="184" height="35" rx="7" class="accent"/><text x="616" y="159" text-anchor="middle" class="small ink">signatures：判别观测</text>
  <rect x="760" y="136" width="184" height="35" rx="7" class="warm"/><text x="852" y="159" text-anchor="middle" class="small ink">protocol：扫描计划</text>
  <path d="M236 153h46M472 153h46M708 153h46" class="arrow"/>
  <text x="980" y="143" class="small muted">例如：R(T)、R(B)、</text><text x="980" y="165" class="small muted">量子振荡共同判别机制</text>

  <rect x="32" y="210" width="530" height="188" rx="12" class="lane"/>
  <text x="52" y="236" class="body ink" font-weight="600">器件状态（制备后固定）</text>
  <text x="52" y="259" class="small muted">样品参数决定可达的物理，不能用 gate 扫描补出来。</text>
  <rect x="52" y="278" width="142" height="41" rx="7" class="node"/><text x="123" y="304" text-anchor="middle" class="small ink">AB 堆垛 / 层距</text>
  <rect x="210" y="278" width="142" height="41" rx="7" class="node"/><text x="281" y="304" text-anchor="middle" class="small ink">介电环境 / 栅距</text>
  <rect x="368" y="278" width="142" height="41" rx="7" class="node"/><text x="439" y="304" text-anchor="middle" class="small ink">无序 / SOC / 邻层</text>
  <text x="52" y="353" class="small muted">样品身份写入每个结果；不同器件仍可共享同一研究协议。</text>

  <rect x="586" y="210" width="582" height="188" rx="12" class="lane"/>
  <text x="606" y="236" class="body ink" font-weight="600">实验控制（运行时可调）</text>
  <text x="606" y="259" class="small muted">控制条件进入一次查询；模拟和真机共享 action / observation 描述。</text>
  <rect x="606" y="278" width="88" height="41" rx="7" class="accent"/><text x="650" y="304" text-anchor="middle" class="small ink">n</text>
  <rect x="708" y="278" width="88" height="41" rx="7" class="accent"/><text x="752" y="304" text-anchor="middle" class="small ink">D</text>
  <rect x="810" y="278" width="88" height="41" rx="7" class="accent"/><text x="854" y="304" text-anchor="middle" class="small ink">T</text>
  <rect x="912" y="278" width="88" height="41" rx="7" class="accent"/><text x="956" y="304" text-anchor="middle" class="small ink">B</text>
  <rect x="1014" y="278" width="88" height="41" rx="7" class="accent"/><text x="1058" y="304" text-anchor="middle" class="small ink">I</text>
  <text x="606" y="353" class="small muted">保留全局覆盖，把预算放到不确定度和模型分歧最大的区域。</text>

  <rect x="32" y="420" width="1136" height="175" rx="12" class="lane"/>
  <text x="52" y="446" class="body ink" font-weight="600">模型、观测与执行层</text>
  <rect x="52" y="462" width="150" height="58" rx="7" class="node"/><text x="127" y="483" text-anchor="middle" class="small ink">Hamiltonian 家族</text><text x="127" y="505" text-anchor="middle" class="small muted">AB/Bernal · MATBG</text>
  <rect x="222" y="462" width="150" height="58" rx="7" class="node"/><text x="297" y="483" text-anchor="middle" class="small ink">求解器</text><text x="297" y="505" text-anchor="middle" class="small muted">单粒子 · Hartree–Fock</text>
  <rect x="392" y="462" width="150" height="58" rx="7" class="node"/><text x="467" y="483" text-anchor="middle" class="small ink">模拟观测</text><text x="467" y="505" text-anchor="middle" class="small muted">能谱 · 响应 · 序参量</text>
  <path d="M202 491h20M372 491h20M542 491h48" class="arrow"/>
  <rect x="590" y="444" width="558" height="38" rx="7" class="accent"/><text x="869" y="469" text-anchor="middle" class="small ink">共同 action / observation schema（单位、控制、观测定义）</text>
  <rect x="590" y="505" width="252" height="54" rx="7" class="accent"/><text x="716" y="528" text-anchor="middle" class="small ink">simulation backend</text><text x="716" y="548" text-anchor="middle" class="small muted">批量计算 · 缓存 · 断点</text>
  <rect x="896" y="505" width="252" height="54" rx="7" class="warm"/><text x="1022" y="528" text-anchor="middle" class="small ink">cryostat backend（未来）</text><text x="1022" y="548" text-anchor="middle" class="small muted">标定 · 几何 · 接触 · 散射</text>
  <path d="M869 482v23M869 482h-153v23M869 482h153v23" class="arrow"/>
  <path d="M510 319v91H40v81h12M1102 319h56v111h-68v14" class="arrow"/>
  <text x="606" y="582" class="small muted">样品参数进入模型，控制量进入查询；模拟与仪器并行执行，比较结果需做物理量转换。</text>

  <rect x="32" y="617" width="1136" height="111" rx="12" class="lane"/>
  <text x="52" y="643" class="body ink" font-weight="600">自主研究与证据回路</text>
  <rect x="52" y="657" width="145" height="36" rx="7" class="accent"/><text x="124" y="680" text-anchor="middle" class="small ink">现有证据</text>
  <rect x="222" y="657" width="175" height="36" rx="7" class="warm"/><text x="309" y="680" text-anchor="middle" class="small ink">候选解释 + 判别动作</text>
  <rect x="422" y="657" width="145" height="36" rx="7" class="node"/><text x="494" y="680" text-anchor="middle" class="small ink">冻结预测</text>
  <rect x="592" y="657" width="145" height="36" rx="7" class="node"/><text x="664" y="680" text-anchor="middle" class="small ink">执行新查询</text>
  <rect x="762" y="657" width="175" height="36" rx="7" class="node"/><text x="849" y="680" text-anchor="middle" class="small ink">独立反驳 / 伪象检查</text>
  <rect x="962" y="657" width="186" height="36" rx="7" class="node"/><text x="1055" y="680" text-anchor="middle" class="small ink">知识图更新</text>
  <path d="M197 675h25M397 675h25M567 675h25M737 675h25M937 675h25" class="loop"/>
  <path d="M1055 657C1055 635 124 635 124 657" class="loop"/>
  <text x="52" y="716" class="small muted">prototype：主动采样 → 温度机制判别 → 冻结关系 → 留出切片；未知失配 → 新模型假设 → 新条件反证。</text>
</svg>
