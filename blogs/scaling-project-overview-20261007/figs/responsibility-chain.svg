<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" role="img"><style>text{font-family:PingFang SC,Noto Sans CJK SC,Arial,sans-serif;fill:#141413}</style><circle cx="22" cy="37" r="4" fill="#d97757"/><path d="M22 47v46" stroke="#b0aea5" fill="none"/><text x="45" y="42" font-size="19" font-weight="600">近打平的概率</text><text x="45" y="70" font-size="15">零附近密度、固定形状</text><text x="364" y="56" font-size="15" style="fill:#5e5d59">不能单独识别任务难度</text><circle cx="22" cy="115" r="4" fill="#d97757"/><path d="M22 125v46" stroke="#b0aea5" fill="none"/><text x="45" y="120" font-size="19" font-weight="600">最终任务响应</text><text x="45" y="148" font-size="15">选择差异是否传到 CE</text><text x="364" y="134" font-size="15" style="fill:#5e5d59">普通任务可改变幂次</text><circle cx="22" cy="193" r="4" fill="#d97757"/><path d="M22 203v46" stroke="#b0aea5" fill="none"/><text x="45" y="198" font-size="19" font-weight="600">实际优化时钟</text><text x="45" y="226" font-size="15">参数度量、补偿与历史</text><text x="364" y="212" font-size="15" style="fill:#5e5d59">同一静态函数可不同速</text><circle cx="22" cy="271" r="4" fill="#d97757"/><text x="45" y="276" font-size="19" font-weight="600">长期误差主导</text><text x="45" y="304" font-size="15">其他剩余与交互消退</text><text x="364" y="290" font-size="15" style="fill:#5e5d59">自然整网仍未完成</text></svg>