<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" role="img"><style>text{font-family:PingFang SC,Noto Sans CJK SC,Arial,sans-serif;fill:#141413}</style><path d="M0 11H700" stroke="#e8e6dc"/><text x="8" y="34" font-size="18" font-weight="600">输出响应</text><text x="154" y="34" font-size="16">这次 loss 怎样改变？</text><text x="154" y="59" font-size="14" style="fill:#5e5d59">一阶、二阶、实测高阶</text><path d="M0 75H700" stroke="#e8e6dc"/><text x="8" y="98" font-size="18" font-weight="600">当前来源</text><text x="154" y="98" font-size="16">哪些动作提供了收益？</text><text x="154" y="123" font-size="14" style="fill:#5e5d59">温度、形状、其余参数</text><path d="M0 139H700" stroke="#e8e6dc"/><text x="8" y="162" font-size="18" font-weight="600">剩余误差</text><text x="154" y="162" font-size="16">充分补偿后还剩多少？</text><text x="154" y="187" font-size="14" style="fill:#5e5d59">共同最低值、温度剩余、其他剩余</text></svg>