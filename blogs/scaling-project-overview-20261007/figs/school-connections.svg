<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" role="img"><style>text{font-family:PingFang SC,Noto Sans CJK SC,Arial,sans-serif;fill:#141413}</style><path d="M14 38H685" stroke="#e8e6dc"/><text x="20" y="32" font-size="17">数据／曝光</text><text x="205" y="32" font-size="16">哪些输入被训练，以及它们怎样影响别的输入</text><path d="M14 92H685" stroke="#e8e6dc"/><text x="20" y="86" font-size="17">NTK／表示</text><text x="205" y="86" font-size="16">参数运动如何改变输出，表示是否持续变化</text><path d="M14 146H685" stroke="#e8e6dc"/><text x="20" y="140" font-size="17">冷边界／Liu</text><text x="205" y="140" font-size="16">近打平的选择如何留下真实任务误差</text><path d="M14 200H685" stroke="#e8e6dc"/><text x="20" y="194" font-size="17">分辨率／谱</text><text x="205" y="194" font-size="16">容量与采样限制了哪些可学习结构</text><text x="20" y="265" font-size="17" style="fill:#d97757">共同读出：同一标签、同一干预的逐 token 响应与未来风险</text></svg>