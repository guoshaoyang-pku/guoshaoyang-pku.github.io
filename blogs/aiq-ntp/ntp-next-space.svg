y="260" font-size="20" style="fill:#376f96" font-weight="400" text-anchor="start">64 / 128 / 256</text><text x="586" y="283" font-size="16" style="fill:#5e5d59" font-weight="400" text-anchor="start">Teacher 与所有候选共享词表；teacher 总参数严格小于所有候选</text><rect x="280" y="313" width="230" height="84" rx="9" fill="white" stroke="#d7d4c9" stroke-width="1"/><text x="296" y="362.0" font-size="20" style="fill:#376f96" font-weight="400" text-anchor="start">生成机制</text><path d="M220 268 H250 V355.0 H280" fill="none" stroke="#376f96" stroke-width="1.6"/><path d="M510 355.0 L563 355.0" fill="none" stroke="#376f96" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="570" y="313" width="930" height="84" rx="9" fill="white" stroke="#d7d4c9" stroke-width="1"/><text x="586" y="341" font-size="20" style="fill:#376f96" font-weight="400" text-anchor="start">残差系数0 / .25 / 1 × 历史full / 4 / 8 / 16 × 位置none / sinusoidal</text><text x="586" y="364" font-size="16" style="fill:#5e5d59" font-weight="400" text-anchor="start">24个机制组合，新增组合仅过静态合法性门槛</text><rect x="280" y="414" width="230" height="66" rx="9" fill="white" stroke="#d7d4c9" stroke-width="1"/><text x="296" y="454.0" font-size="20" style="fill:#376f96" font-weight="400" text-anchor="start">合法 Teacher 数</text><path d="M220 268 H250 V447.0 H280" fill="none" stroke="#376f96" stroke-width="1.6"/><path d="M510 447.0 L563 447.0" fill="none" stroke="#376f96" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="570" y="414" width="930" height="66" rx="9" fill="white" stroke="#d7d4c9" stroke-width="1"/><text x="586" y="442" font-size="20" style="fill:#376f96" font-weight="400" text-anchor="start">12,096 个配置，含词表</text><text x="586" y="465" font-size="16" style="fill:#5e5d59" font-weight="400" text-anchor="start">V64、V128各3744；V256为4608。小候选参数门槛过滤大teacher。</text><path d="M260 507 L1500 507" fill="none" stroke="#d7d4c9" stroke-width="1.6"/><rect x="280" y="540" width="230" height="66" rx="9" fill="white" stroke="#d7d4c9" stroke-width="1"/><text x="296" y="5