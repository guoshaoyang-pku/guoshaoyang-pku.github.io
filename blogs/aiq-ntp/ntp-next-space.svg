400" text-anchor="start">同长 / 输入×2 / 输出×2</text><text x="586" y="753" font-size="16" style="fill:#5e5d59" font-weight="400" text-anchor="start">默认训练与评测长度相同。泛化题才改变长度；样本独立。</text><rect x="280" y="783" width="230" height="66" rx="9" fill="white" stroke="#d7d4c9" stroke-width="1"/><text x="296" y="823.0" font-size="20" style="fill:#4c6a34" font-weight="400" text-anchor="start">优化器与更新</text><path d="M220 718 H250 V816.0 H280" fill="none" stroke="#4c6a34" stroke-width="1.6"/><path d="M510 816.0 L563 816.0" fill="none" stroke="#4c6a34" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="570" y="783" width="930" height="66" rx="9" fill="white" stroke="#d7d4c9" stroke-width="1"/><text x="586" y="811" font-size="20" style="fill:#4c6a34" font-weight="400" text-anchor="start">8档AdamW × steps300 / 700 / 1400</text><text x="586" y="834" font-size="16" style="fill:#5e5d59" font-weight="400" text-anchor="start">lr1e-4 / 3e-4 / 6e-4 / 1e-3，wd0 / .01；batch16、FP32固定</text><rect x="280" y="864" width="230" height="66" rx="9" fill="white" stroke="#d7d4c9" stroke-width="1"/><text x="296" y="904.0" font-size="20" style="fill:#4c6a34" font-weight="400" text-anchor="start">题目 setting 数</text><path d="M220 718 H250 V897.0 H280" fill="none" stroke="#4c6a34" stroke-width="1.6"/><path d="M510 897.0 L563 897.0" fill="none" stroke="#4c6a34" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="570" y="864" width="930" height="66" rx="9" fill="white" stroke="#d7d4c9" stroke-width="1"/><text x="586" y="892" font-size="20" style="fill:#4c6a34" font-weight="400" text-anchor="start">979,776 个数据条件 → 23,514,624 个训练条件</text><text x="586" y="915" font-size="16" style="fill:#5e5d59" font-weight="400" text-anchor="start">每个条件可生成一组候选比较；seed、选项排列、题目格式均不乘入。</text><path d="M260 958 L1500 958" fill="none" stroke="#d7d4c9" stroke-width="1.6"/><rect x="280" y="995" width="255" height="88" rx="9" fill="white" stroke="#aa4e35" stroke-width="1.5"/><text x="296" y="1046.0" font-size="20" style="fill:#aa4e35" font-we