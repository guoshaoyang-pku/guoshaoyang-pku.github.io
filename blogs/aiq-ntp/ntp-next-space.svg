<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 1800" width="1540" height="1800" role="img" aria-label="下一步有限设计空间，尚未实测"><title>下一步有限设计空间，尚未实测</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#5e5d59"/></marker></defs><rect width="1540" height="1800" fill="#faf9f5"/><style>text{font-family:PingFang SC,Hiragino Sans GB,Arial,sans-serif;fill:#141413}</style><text x="28" y="38" font-size="20" style="fill:#5e5d59" font-weight="400" text-anchor="start">分叉为允许值；每次训练固定一组 teacher、数据与预算。</text><rect x="30" y="235" width="190" height="66" rx="9" fill="white" stroke="#376f96" stroke-width="1.5"/><text x="46" y="263" font-size="20" style="fill:#376f96" font-weight="600" text-anchor="start">Teacher</text><text x="46" y="286" font-size="16" style="fill:#5e5d59" font-weight="400" text-anchor="start">冻结的生成模型</text><rect x="30" y="685" width="190" height="66" rx="9" fill="white" stroke="#4c6a34" stroke-width="1.5"/><text x="46" y="713" font-size="20" style="fill:#4c6a34" font-weight="600" text-anchor="start">数据</text><text x="46" y="736" font-size="16" style="fill:#5e5d59" font-weight="400" text-anchor="start">随机前缀 → 续写</text><rect x="30" y="1154" width="190" height="66" rx="9" fill="white" stroke="#aa4e35" stroke-width="1.5"/><text x="46" y="1182" font-size="20" style="fill:#aa4e35" font-weight="600" text-anchor="start">Candidates</text><text x="46" y="1205" font-size="16" style="fill:#5e5d59" font-weight="400" text-anchor="start">从头训练的模型</text><path d="M125 301 L125 669" fill="none" stroke="#5e5d59" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M125 751 L125 1138" fill="none" stroke="#5e5d59" stroke-width="1.6" marker-end="url(#arrow)"/><text x="141" y="483" font-size="18" style="fill:#5e5d59" font-weight="400" text-anchor="start">生成</text><text x="141" y="943" font-size="18" style="fill:#5e5d59" font-weight="400" text-anchor="start">拟合</text><rect x="280" y="70" width="230" height="66" rx