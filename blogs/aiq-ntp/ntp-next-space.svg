220 1187 H250 V1325 H280" fill="none" stroke="#aa4e35" stroke-width="1.6"/><path d="M535 1325 L563 1325" fill="none" stroke="#aa4e35" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="570" y="1281" width="270" height="88" rx="9" fill="white" stroke="#d7d4c9" stroke-width="1"/><text x="586" y="1309" font-size="20" style="fill:#aa4e35" font-weight="400" text-anchor="start">容量</text><text x="586" y="1332" font-size="16" style="fill:#5e5d59" font-weight="400" text-anchor="start">宽128 / 160 / 192</text><text x="586" y="1354" font-size="16" style="fill:#5e5d59" font-weight="400" text-anchor="start">层1 / 2 / 3</text><rect x="880" y="1281" width="270" height="88" rx="9" fill="white" stroke="#d7d4c9" stroke-width="1"/><text x="896" y="1309" font-size="20" style="fill:#aa4e35" font-weight="400" text-anchor="start">RNN 核心</text><text x="896" y="1332" font-size="16" style="fill:#5e5d59" font-weight="400" text-anchor="start">全局 tanh / ReLU</text><text x="896" y="1354" font-size="16" style="fill:#5e5d59" font-weight="400" text-anchor="start">正交循环初始化</text><rect x="1190" y="1281" width="310" height="88" rx="9" fill="white" stroke="#d7d4c9" stroke-width="1"/><text x="1206" y="1309" font-size="20" style="fill:#aa4e35" font-weight="400" text-anchor="start">重复 RNN → 输出头</text><text x="1206" y="1332" font-size="16" style="fill:#5e5d59" font-weight="400" text-anchor="start">层间参数独立</text><text x="1206" y="1354" font-size="16" style="fill:#5e5d59" font-weight="400" text-anchor="start">循环状态按样本重置</text><path d="M840 1325 L873 1325" fill="none" stroke="#aa4e35" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M1150 1325 L1183 1325" fill="none" stroke="#aa4e35" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="280" y="1424" width="255" height="88" rx="9" fill="white" stroke="#aa4e35" stroke-width="1.5"/><text x="296" y="1475.0" font-size="20" style="fill:#aa4e35" font-weight="600" text-anchor="start">对角 SSM · 42 / 62</text><path d="M220 1187 H250 V1468 H280" fill="none" stroke="#aa4e35" stroke-width="1.6"/><path d="M535 1468 L563 1468" fill="none" stroke="#aa4e35" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="570" y="1424" width="270" height="88" rx="9" fill="white" stroke="#d7d4c9" stroke-width="1"/><text x="586" y="1452" font-size="20" style="fill:#aa4e35" font-weight="400" text-anchor="start">容量</text><text x="586" y="1475" font-size="16" style="fill:#5e5d59" font-weight="400" text-anchor="start">宽96 / 128 / 160</text><text x="586" y="1497" font-size="16" style="fill:#5e5d59" font-weight="400" text-anchor="start">层1 / 2 / 3</text><rect x="880" y="1424" width="270" height="88" rx="9" fill="white" stroke="#d7d4c9" stroke-width="1"/><text x="896" y="1452" font-size="20" style="fill:#aa4e35" font-weight="400" text-anchor="start">对角状态空间核心</text><text x="896" y="1475" font-size="16" style="fill:#5e5d59" font-weight="400" text-anchor="start">state8 / 16 / 32</text><text x="896" y="1497" font-size="16" style="fill:#5e5d59" font-weight="400" text-anchor="start">初始化fast / 128 / slow</text><rect x="1190" y="1424" width="310" height="88" rx="9" fill="white" stroke="#d7d4c9" stroke-width="1"/><text x="1206" y="1452" font-size="20" style="fill:#aa4e35" font-weight="400" text-anchor="start">SSM → FFN + 残差</text><text x="1206" y="1475" font-size="16" style="fill:#5e5d59" font-weight="400" text-anchor="start">FF比例1 / 2 / 4；GELU / SiLU</text><text x="1206" y="1497" font-size="16" style="fill:#5e5d59" font-weight="400" text-anchor="start">42架构＋20初始化变体</text><path d="M840 1468 L873 1468" fill="none" stroke="#aa4e35" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M1150 1468 L1183 1468" fill="none" stroke="#aa4e35" stroke-width="1.6" marker-end="url(#arrow)"/><text x="280" y="1572" font-size="19" style="fill:#aa4e35" font-weight="600" text-anchor="start">164 个架构模板 / 184 个完整模型 setting；相对所属 anchor 最多两轴，禁止全笛卡尔积。</text><text x="280" y="1611" font-size="17" style="fill:#5e5d59" font-weight="400" text-anchor="start">原四个anchor保留hash；effective context256。全局激活统一、残差保留、完整单轴与两轴组。</text><text x="280" y="1650" font-size="18" style="fill:#5e5d59" font-weight="400" text-anchor="start">每份数据条件：184 模型 × 24 训练计划 = 4,416 候选训练方案。</text><text x="280" y="1689" font-size="17" style="fill:#5e5d59" font-weight="400" text-anchor="start">steps默认；时间预算同硬件对齐；FLOPs正式计数覆盖后启用。这三路不混乘。</text><text x="280" y="1745" font-size="18" style="fill:#5e5d59" font-weight="400" text-anchor="start">下一步方案仅证明实现支持和静态合法，尚未证明学习稳定或高质量题目产率。</text></svg>