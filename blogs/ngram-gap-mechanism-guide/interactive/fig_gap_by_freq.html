<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>n-gram 频次分桶：train / val / gap</title>
<style>
:root{--bg:#fffdf8;--ink:#232426;--muted:#686d73;--line:#c8c1b6;--grid:#ece5d8;
--train:#2d6f9f;--val:#c4493d;--gap:#c4493d;--epoch:#8a8176;--panel:#f0eee7;--anchor:#353d79;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);
font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;}
.wrap{max-width:1000px;margin:0 auto;padding:14px 12px 36px}
h1{font-size:19px;margin:0 0 4px}h2{font-size:14px;color:var(--muted);font-weight:500;margin:0 0 14px}
.controls{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;background:var(--panel);
border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0}
.group{display:flex;flex-direction:column;gap:6px}
.grp-label{font-size:11px;color:var(--anchor);font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{font-size:12px;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:#fffdf8;
color:var(--muted);cursor:pointer;font-family:inherit;transition:.12s}
.btn:hover{border-color:var(--anchor);color:var(--ink)}
.btn.active{background:var(--anchor);color:#fff;border-color:var(--anchor)}
.hint{font-size:11.5px;color:var(--muted);line-height:1.6;margin:8px 2px}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin:10px 2px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:16px;height:3px;border-radius:2px}
.bins{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 2px;max-height:118px;overflow:auto}
.binit{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;cursor:pointer;user-select:none;color:var(--muted)}
.binit input{cursor:pointer;margin:0}
.bsw{width:13px;height:13px;border-radius:3px;border:1px solid rgba(0,0,0,.12)}
#chart{width:100%;height:auto;display:block;background:#fffdf8;border:1px solid var(--line);border-radius:8px}
.note{font-size:12px;color:var(--muted);line-height:1.6;background:var(--panel);border-left:3px solid var(--anchor);
border-radius:6px;padding:10px 12px;margin:10px 0}
.tip{position:absolute;background:rgba(35,36,38,.96);color:#fff;padding:8px 11px;border-radius:6px;
font-size:11.5px;pointer-events:none;opacity:0;transition:opacity .12s;z-index:50;max-width:280px;line-height:1.5}
.tip.show{opacity:1}.tip b{color:#ffd9a8}
</style></head><body><div class="wrap">
<h1>n-gram context 频次分桶：train / val / gap 损失曲线</h1>
<h2>实验 baseline_current（current shell + current-style grouping + bigram+trigram RMSProp，seed42，1000 step）· 频次 = 每个 context 在单 train epoch 内的离线精确命中次数</h2>

<div class="controls">
  <div class="group"><div class="grp-label">曲线 (curve)</div>
    <div class="btns" id="curve-btns">
      <button class="btn" data-v="train">train loss</button>
      <button class="btn" data-v="val">val loss</button>
      <button class="btn active" data-v="both">train + val</button>
      <button class="btn" data-v="gap">gap (val−train)</button>
    </div></div>
  <div class="group"><div class="grp-label">指标 (metric)</div>
    <div class="btns" id="metric-btns">
      <button class="btn active" data-v="per_token">per-token loss</button>
      <button class="btn" data-v="total">总贡献 = frac × loss</button>
    </div></div>
  <div class="group"><div class="grp-label">context</div>
    <div class="btns" id="branch-btns">
      <button class="btn active" data-v="bigram">bigram</button>
      <button class="btn" data-v="trigram">trigram</button>
    </div></div>
</div>
<div class="hint" id="hint"></div>
<div class="bins" id="bins"></div>
<div class="legend" id="legend"></div>
<svg id="chart" viewBox="0 0 940 470"></svg>
<div class="note" id="note"></div>
<div class="tip" id="tip"></div>
</div>

}
function render(){
  const svg=$('#chart'); const W=940,H=470, PL=62,PR=18,PT=38,PB=52;
  const xlo=0, xhi=1000;
  const branch=DATA.branches[STATE.branch];
  const labels=Object.keys(branch.buckets).filter(l=>!STATE.hidden.has(l));
  // gather all pts
  let all=[];
  const drawn=[]; // {lab,color,curves:[{pts,color,dash}]}
  labels.forEach(lab=>{
    const cs=seriesFor(lab); const b=branch.buckets[lab];
    cs.forEach(c=>all=all.concat(c.pts));
    drawn.push({lab,color:b.color,curves:cs});
  });
  // y range
  let ylo=Math.min(0,...all.map(p=>p[1])), yhi=Math.max(...all.map(p=>p[1]));
  if(!isFinite(ylo)){ylo=0;yhi=1;}
  const pad=(yhi-ylo)*0.08||0.5; ylo-=pad; yhi+=pad;
  if(STATE.metric==='total'){ ylo=Math.min(0,ylo); }
  const sx=x=>PL+(x-xlo)/(xhi-xlo)*(W-PL-PR);
  const sy=y=>PT+(1-(y-ylo)/(yhi-ylo))*(H-PT-PB);
  let s=`<rect width="${W}" height="${H}" fill="#fffdf8"/>`;
  // grid + y ticks
  const ny=5;
  for(let i=0;i<=ny;i++){const v=ylo+(yhi-ylo)*i/ny; const y=sy(v);
    s+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#ece5d8" stroke-width="1"/>`;
    s+=`<text x="${PL-8}" y="${y+3}" text-anchor="end" font-size="10" fill="#686d73">${v.toFixed(STATE.metric==='total'?3:2)}</text>`;}
  // x ticks
  for(let x=0;x<=1000;x+=200){s+=`<line x1="${sx(x)}" y1="${H-PB}" x2="${sx(x)}" y2="${H-PB+4}" stroke="#c8c1b6"/>`;
    s+=`<text x="${sx(x)}" y="${H-PB+16}" text-anchor="middle" font-size="10" fill="#686d73">${x}</text>`;}
  // epoch boundaries + onset
  EPOCH.forEach((b,i)=>{s+=`<line x1="${sx(b)}" y1="${PT}" x2="${sx(b)}" y2="${H-PB}" stroke="#8a8176" stroke-width="1" stroke-dasharray="4 3"/>`;
    s+=`<text x="${sx(b)}" y="${PT-6}" text-anchor="middle" font-size="9.5" fill="#8a8176">e${i+2}</text>`;});
  if(ONSET){s+=`<line x1="${sx(ONSET)}" y1="${PT}" x2="${sx(ONSET)}" y2="${H-PB}" stroke="#c4493d" stroke-width="1" stroke-dasharray="2 3" opacity=".7"/>`;
    s+=`<text x="${sx(ONSET)}" y="${H-PB+30}" text-anchor="middle" font-size="9" fill="#c4493d">gap onset</text>`;}
  // zero axis
  if(ylo<0&&yhi>0){s+=`<line x1="${PL}" y1="${sy(0)}" x2="${W-PR}" y2="${sy(0)}" stroke="#232426" stroke-width="1"/>`;}
  s+=`<line x1="${PL}" y1="${PT}" x2="${PL}" y2="${H-PB}" stroke="#c8c1b6"/>`;
  s+=`<line x1="${PL}" y1="${H-PB}" x2="${W-PR}" y2="${H-PB}" stroke="#c8c1b6"/>`;
  // axis labels
  s+=`<text x="${(PL+W-PR)/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="#686d73">training step</text>`;
  s+=`<text x="16" y="${(PT+H-PB)/2}" text-anchor="middle" font-size="11" fill="#686d73" transform="rotate(-90 16 ${(PT+H-PB)/2})">${curveYlabel()}</text>`;
  // draw curves: per label, use label color but distinguish train/val by dash
  drawn.forEach(d=>{
    d.curves.forEach(c=>{
      if(c.pts.length<2) return;
      let d_attr = c.dash==='none'?'':` stroke-dasharray="${c.dash}"`;
      // bucket color for 'both' mode would collide; use curve color, bucket shown in legend/checkbox
      s+=`<polyline points="${c.pts.map(p=>sx(p[0]).toFixed(1)+','+sy(p[1]).toFixed(1)).join(' ')}" fill="none" stroke="${c.color}" stroke-width="1.7" stroke-linejoin="round"${d_attr} opacity="0.92"/>`;
    });
  });
  s+=`</svg>`;
  svg.innerHTML=s;
  // legend
  const lg=$('#legend'); lg.innerHTML='';
  if(STATE.curve==='both'){
    lg.innerHTML='<span><i class="sw" style="background:#2d6f9f"></i>train</span><span><i class="sw" style="background:#c4493d;border-top:2px dashed #c4493d"></i>val</span>';
  } else {
    const col=STATE.curve==='gap'?'#c4493d':(STATE.curve==='train'?'#2d6f9f':'#c4493d');
    lg.innerHTML=`<span><i class="sw" style="background:${col}"></i>${STATE.curve}</span>`;
  }
  lg.innerHTML+='<span style="margin-left:8px;color:#8a8176">┊ epoch 边界</span><span style="color:#c4493d">┊ gap onset</span>';
  // hint + note
  const brLabel=STATE.branch;
  $('#hint').innerHTML = STATE.curve==='gap'
    ? `当前：每个频次桶的 <b>gap = val − train per-token loss</b>。${STATE.metric==='total'?'总贡献 = frac × gap（衡量该桶对整体 gap 的贡献量级）。':'正值=val 高于 train（过拟合），0 线已固定为坐标轴。'}`
    : STATE.curve==='both'
      ? `当前：<b>train（蓝实线）与 val（红虚线）</b>同图，频次桶用复选框开关。${STATE.metric==='total'?'总贡献 = frac × loss。':''}`
      : `当前：${STATE.curve} loss 按频次桶分解。${STATE.metric==='total'?'总贡献 = frac × loss（该桶对总 loss 的贡献）。':'per-token loss = 该桶内每个 token 的平均 loss。'}`;
  $('#note').innerHTML = brLabel==='trigram'
    ? `<b>trigram</b>：频次 = 每个 trigram context 在单 train epoch 内的离线精确命中次数（GlobalNgramFrequencyIndex，train-only 定义）。由于 trigram 组合空间远大于 train 文本，<b>novel 桶（train 中从未出现的 context）在 val 上占比约 30%</b>——这是 val 翘起的主要来源。所有频段（1/2/3/4/5/6-10/…）均有数据。`
    : `<b>bigram</b>：拥有完整频段。novel 桶（train-freq=0）仅 val 存在（train 中按定义无 novel context），val novel 占比约 4%。频次定义与 trigram 一致：单 train epoch 内每个 context 的离线精确命中次数。`;
}
// wire buttons
document.querySelectorAll('#curve-btns .btn').forEach(b=>b.onclick=()=>{STATE.curve=b.dataset.v;renderButtons('#curve-btns','curve');render();});
document.querySelectorAll('#metric-btns .btn').forEach(b=>b.onclick=()=>{STATE.metric=b.dataset.v;renderButtons('#metric-btns','metric');render();});
document.querySelectorAll('#branch-btns .btn').forEach(b=>b.onclick=()=>{STATE.branch=b.dataset.v;renderBins();render();});
// tooltip on hover
const svgEl=$('#chart'); const tip=$('#tip');
svgEl.addEventListener('mousemove',e=>{
  const r=svgEl.getBoundingClientRect();
  const xpix=e.clientX-r.left; const ypix=e.clientY-r.top;
  const W=940,PL=62,PR=18; const scale=W/r.width;
  const xstep=(xpix/scale-PL)/(W-PL-PR)*1000;
  if(xstep<0||xstep>1000){tip.classList.remove('show');return;}
  // find nearest step present
  const branch=DATA.branches[STATE.branch];
  const labels=Object.keys(branch.buckets).filter(l=>!STATE.hidden.has(l));
  let rows=[];
  labels.forEach(lab=>{
    const b=branch.buckets[lab]; const cs=seriesFor(lab);
    cs.forEach(c=>{
      // nearest pt
      let best=null;
      c.pts.forEach(p=>{if(!best||Math.abs(p[0]-xstep)<Math.abs(best[0]-xstep))best=p;});
      if(best) rows.push({lab, color:c.color, val:best[1], step:best[0],
        kind: c.dash==='none'?(STATE.curve==='both'?'train':STATE.curve):'val'});
    });
  });
  if(!rows.length){tip.classList.remove('show');return;}
  rows.sort((a,b)=>b.val-a.val);
  const top=rows.slice(0,8);
  let html=`<b>step ≈ ${top[0].step}</b><br>`+top.map(r=>`<span style="display:inline-block;width:10px;height:10px;background:${r.color};border-radius:2px;margin-right:5px"></span>${r.lab} ${r.kind}: <b>${r.val.toFixed(3)}</b>`).join('<br>');
  tip.innerHTML=html; tip.classList.add('show');
  const tw=tip.offsetWidth, th=tip.offsetHeight;
  let tx=e.clientX-tw-10, ty=e.clientY-th-10;
  if(tx<0)tx=e.clientX+10; if(ty<0)ty=e.clientX+10;
  tip.style.left=tx+'px'; tip.style.top=ty+'px';
});
svgEl.addEventListener('mouseleave',()=>tip.classList.remove('show'));
renderBins(); render();
</script></body></html>
