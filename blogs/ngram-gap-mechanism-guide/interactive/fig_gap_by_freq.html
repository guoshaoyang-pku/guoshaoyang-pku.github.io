<title>n-gram 频次分桶：train / val / gap</title>
<style>
:root{--bg:#fffdf8;--ink:#232426;--muted:#686d73;--line:#c8c1b6;--grid:#ece5d8;

.note{font-size:12px;color:var(--muted);line-height:1.6;background:var(--panel);border-left:3px solid var(--anchor);

function seriesFor(lab){
  const b=DATA.branches[STATE.branch].buckets[lab];
  const frac = STATE.branch==='bigram' ? (STATE.curve==='val'?b.val_frac:b.train_frac) : b.train_frac;
  // for trigram train_frac ~ val_frac (same definition); use train_frac as canonical
  const fr = b.train_frac.length?b.train_frac:(b.val_frac.length?b.val_frac:[]);
  function mk(arr){ if(STATE.metric==='per_token') return arr;

    const fm=new Map(fr.map(p=>[p[0],p[1]]));
    return arr.filter(p=>fm.has(p[0])).map(p=>[p[0], p[1]*fm.get(p[0])]);
  }
  if(STATE.curve==='train') return [{pts:mk(b.train_per_token),color:'#2d6f9f',dash:'none'}];
  if(STATE.curve==='val')   return [{pts:mk(b.val_per_token),color:'#c4493d',dash:'none'}];
  if(STATE.curve==='gap')   return [{pts:mk(b.gap_per_token),color:'#c4493d',dash:'none'}];

    ? `当前：每个频次桶的 <b>gap = val − train per-token loss</b>。${STATE.metric==='total'?'总贡献 = frac × gap（衡量该桶对整体 gap 的贡献量级）。':'正值=val 高于 train（过拟合），0 线已固定为坐标轴。'}`
    : STATE.curve==='both'
      ? `当前：<b>train（实线）与 val（虚线）</b>同图，曲线按频次桶着色。${STATE.metric==='total'?'总贡献 = frac × loss。':''}`
      : `当前：${STATE.curve} loss 按频次桶分解。${STATE.metric==='total'?'总贡献 = frac × loss（该桶对总 loss 的贡献）。':'per-token loss = 该桶内每个 token 的平均 loss。'}`;
  $('#note').innerHTML = brLabel==='trigram'
    ? `<b>trigram 注意</b>：频次以 context <i>hash row</i> 的离线命中次数定义。trigram 的 2M-row hash 表存在碰撞，使最低 row 频次约为 15，因此 1-5 / 6-10 / novel 桶在结构上为空（图中无这些曲线），最低有效桶为 11-20。bigram 的碰撞足迹更小，拥有完整频段（含 novel）。`
    : `<b>bigram</b>：拥有完整频段。novel 桶仅 val 存在（train 中按定义无 novel context）。频次定义与 trigram 一致：单 train epoch 内每个 context hash 的离线命中次数。`;
}
// wire buttons
document.querySelectorAll('#curve-btns .btn').forEach(b=>b.onclick=()=>{STATE.curve=b.dataset.v;renderButtons('#curve-btns','curve');render();});
document.querySelectorAll('#metric-btns .btn').forEach(b=>b.onclick=()=>{STATE.metric=b.dataset.v;renderButtons('#metric-btns','metric');render();});
document.querySelectorAll('#branch-btns .btn').forEach(b=>b.onclick=()=>{STATE.branch=b.dataset.v;renderBins();render();});
// tooltip on hover
const svgEl=$('#chart'); const tip=$('#tip');
svgEl.addEventListener('mousemove',e=>{
  const r=svgEl.getBoundingClientRect();
  const xpix=e.clientX-r.left; const ypix=e.clientY-r.top;
  const W=940,PL=62,PR=18; const scale=W/r.width;
  const xstep=(xpix/scale-PL)/(W-PL-PR)*1000;
  if(xstep<0||xstep>1000){tip.classList.remove('show');return;}
  // find nearest step present
  const branch=DATA.branches[STATE.branch];
  const labels=Object.keys(branch.buckets).filter(l=>!STATE.hidden.has(l));
  let rows=[];
  labels.forEach(lab=>{
    const b=branch.buckets[lab]; const cs=seriesFor(lab);
    cs.forEach(c=>{
      // nearest pt
      let best=null;
      c.pts.forEach(p=>{if(!best||Math.abs(p[0]-xstep)<Math.abs(best[0]-xstep))best=p;});
      if(best) rows.push({lab, color:b.color, val:best[1], step:best[0],
        kind: c.dash==='none'?(STATE.curve==='both'?'train':STATE.curve):'val'});
    });
  });
  if(!rows.length){tip.classList.remove('show');return;}
  rows.sort((a,b)=>b.val-a.val);
  const top=rows.slice(0,8);
  let html=`<b>step ≈ ${top[0].step}</b><br>`+top.map(r=>`<span style="display:inline-block;width:10px;height:10px;background:${r.color};border-radius:2px;margin-right:5px"></span>${r.lab} ${r.kind}: <b>${r.val.toFixed(3)}</b>`).join('<br>');
  tip.innerHTML=html; tip.classList.add('show');
  const tw=tip.offsetWidth, th=tip.offsetHeight;
  let tx=e.clientX-tw-10, ty=e.clientY-th-10;
  if(tx<0)tx=e.clientX+10; if(ty<0)ty=e.clientX+10;
  tip.style.left=tx+'px'; tip.style.top=ty+'px';
});
svgEl.addEventListener('mouseleave',()=>tip.classList.remove('show'));
renderBins(); render();
</script></body></html>
