const STATE = {curve:'gap', shell:'nanogpt_original'};
const $=s=>document.querySelector(s);
const EPOCHS=[337,686]; // epoch boundaries (both shells use 1 shard tr1)
function renderBtns(sel,st){document.querySelectorAll(sel+' .btn').forEach(b=>b.classList.toggle('active',b.dataset.v===STATE[st]));}
function seriesColor(key){return key.includes('exp4')?'#236b70':key.includes('exp5')?'#6b8f3f':'#c4493d';}
function seriesDash(key){return key.includes('baseline')||(!key.includes('exp4')&&!key.includes('exp5'))?'5 3':'none';}
function activeRuns(){
  const out=[{key:'baseline',label:DATA.baselines[STATE.shell].label,curves:DATA.baselines[STATE.shell].curves||[]}];
  // current_shell baseline has no curves (only gaps); for nanogpt_original we have curves
  for(const r of DATA.runs){
    const isCurrent = r.key.includes('_current');
    if((STATE.shell==='current_shell')===isCurrent) out.push({key:r.key,label:r.label,curves:r.curves});
  }
  return out;
}
function renderLine(){
  const svg=$('#line'); const W=640,H=340,PL=52,PR=14,PT=28,PB=46;
  const runs=activeRuns();
  const field=STATE.curve;
  let all=[];
  runs.forEach(r=>all=all.concat(r.curves.map(p=>p[field])));
  let ylo=Math.min(0,...all), yhi=Math.max(...all);
  if(!isFinite(ylo)){ylo=0;yhi=1;}
  const pad=(yhi-ylo)*0.08||0.5; ylo-=pad; yhi+=pad;
  const xlo=0,xhi=1000;
  const sx=x=>PL+(x-xlo)/(xhi-xlo)*(W-PL-PR);
  const sy=y=>PT+(1-(y-ylo)/(yhi-ylo))*(H-PT-PB);
  let s=`<rect width="${W}" height="${H}" fill="#fffdf8"/>`;
  for(let i=0;i<=4;i++){const v=ylo+(yhi-ylo)*i/4;const y=sy(v);
    s+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#ece5d8"/>`;
    s+=`<text x="${PL-6}" y="${y+3}" text-anchor="end" font-size="9.5" fill="#686d73">${v.toFixed(2)}</text>`;}
  for(let x=0;x<=1000;x+=200){s+=`<line x1="${sx(x)}" y1="${H-PB}" x2="${sx(x)}" y2="${H-PB+4}" stroke="#c8c1b6"/>`;
    s+=`<text x="${sx(x)}" y="${H-PB+15}" text-anchor="middle" font-size="9.5" fill="#686d73">${x}</text>`;}
  EPOCHS.forEach((b,i)=>{s+=`<line x1="${sx(b)}" y1="${PT}" x2="${sx(b)}" y2="${H-PB}" stroke="#8a8176" stroke-dasharray="4 3"/>`;
    s+=`<text x="${sx(b)}" y="${PT-6}" text-anchor="middle" font-size="9" fill="#8a8176">e${i+2}</text>`;});
  if(ylo<0&&yhi>0){s+=`<line x1="${PL}" y1="${sy(0)}" x2="${W-PR}" y2="${sy(0)}" stroke="#232426" stroke-width="1"/>`;}
  s+=`<line x1="${PL}" y1="${PT}" x2="${PL}" y2="${H-PB}" stroke="#c8c1b6"/>`;
  s+=`<line x1="${PL}" y1="${H-PB}" x2="${W-PR}" y2="${H-PB}" stroke="#c8c1b6"/>`;
  s+=`<text x="${(PL+W-PR)/2}" y="${H-6}" text-anchor="middle" font-size="10.5" fill="#686d73">training step</text>`;
  const ylabel = field==='gap'?'gap (val−train)':(field==='train'?'train loss':'val loss');
  s+=`<text x="14" y="${(PT+H-PB)/2}" text-anchor="middle" font-size="10.5" fill="#686d73" transform="rotate(-90 14 ${(PT+H-PB)/2})">${ylabel}</text>`;
  runs.forEach(r=>{
    if(!r.curves.length) return;
    const col=seriesColor(r.key); const dash=seriesDash(r.key);
    const pts=r.curves.map(p=>sx(p.step).toFixed(1)+','+sy(p[field]).toFixed(1)).join(' ');
    const w = r.key.includes('baseline')?1.8:2.2;
    s+=`<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round" stroke-dasharray="${dash}" opacity="0.92"/>`;
  });
  s+=`</svg>`; svg.innerHTML=s;
  $('#line-title').textContent = `${ylabel} 随训练步数（${STATE.shell==='nanogpt_original'?'nanogpt_original':'current-shell'}）`;
}
function renderTable(){
  const t=$('#gap-table');
  const sh=STATE.shell;
  const baseG = sh==='nanogpt_original' ? DATA.baselines.nanogpt_original.epoch_gaps : {1:{max:null},2:{max:1.300},3:{max:3.937},final:{gap:3.658}};
  let html='<thead><tr><th>run</th><th>epoch1 max gap</th><th>epoch2 max gap</th><th>epoch3 max gap</th><th>final gap</th></tr></thead><tbody>';
  html+=`<tr class="baseline"><td>${DATA.baselines[sh].label}</td><td>${baseG[1]&&baseG[1].max!=null?baseG[1].max.toFixed(3):'—'}</td><td>${baseG[2]?baseG[2].max.toFixed(3):'—'}</td><td>${baseG[3]?baseG[3].max.toFixed(3):'—'}</td><td>${baseG.final&&baseG.final.gap!=null?baseG.final.gap.toFixed(3):'—'}</td></tr>`;
  const isCur = sh==='current_shell';
  for(const r of DATA.runs){
    if(r.key.includes('_current')!==isCur) continue;
    const g=r.epoch_gaps;
    const fg=g.final.gap;
    const baseFg = baseG.final&&baseG.final.gap!=null?baseG.final.gap:0;
    const cls = fg < 0.3*baseFg ? 'gapr' : (fg < 0.7*baseFg ? 'gap0' : 'gapw');
    html+=`<tr><td style="text-align:left">${r.label}</td><td>${g[1]?g[1].max.toFixed(3):'—'}</td><td>${g[2]?g[2].max.toFixed(3):'—'}</td><td class="${cls}">${g[3]?g[3].max.toFixed(3):'—'}</td><td class="${cls}">${fg.toFixed(3)}</td></tr>`;
  }
  html+='</tbody>'; t.innerHTML=html;
}
function renderNote(){
  const sh=STATE.shell==='nanogpt_original'?'nanogpt_original':'current-shell';
  $('#note').innerHTML = `<b>${sh} 结论</b>：`
    + (STATE.shell==='nanogpt_original'
      ? `exp4（per-epoch hash reseed）把 epoch3 max gap 从 <b>0.688 降到 0.371</b>、final gap 从 0.688 降到 <b>0.047</b>（−93%）；exp5（低频 gate=0）把 epoch3 max gap 从 0.688 降到 <b>0.102</b>、final gap 降到 <b>0.040</b>（−94%）。<b>两个干预都基本消除了 gap</b>——支持"table 跨 epoch 累积 train-specific pattern 是 gap 根因"，且"低频 n-gram context 是主要 driver"。`
      : `exp4 把 epoch3 max gap 从 <b>3.937 降到 0.351</b>（−91%）、final gap 从 3.658 降到 <b>0.252</b>；exp5 把 epoch3 max gap 降到 <b>1.523</b>（−61%）、final gap <b>1.523</b>。current-shell 上 exp4 仍几乎完全消除 gap，exp5 显著减弱但未消除（低频 gate=0 只挡住低频 context，current-shell 更强的注入通道让中高频仍能过拟合）。`);
}
document.querySelectorAll('#curve-btns .btn').forEach(b=>b.onclick=()=>{STATE.curve=b.dataset.v;renderBtns('#curve-btns','curve');renderLine();});
document.querySelectorAll('#shell-btns .btn').forEach(b=>b.onclick=()=>{STATE.shell=b.dataset.v;renderBtns('#shell-btns','shell');renderLine();renderTable();renderNote();});
renderLine();renderTable();renderNote();
</script></body></html>
