.note{font-size:12px;color:var(--muted);line-height:1.6;background:var(--panel);border-left:3px solid var(--anchor);

.tip{position:absolute;background:rgba(35,36,38,.96);color:#fff;padding:8px 11px;border-radius:6px;

  });
  // y range
  let ylo=Math.min(0,...all.filter(v=>isFinite(v))), yhi=Math.max(...all.filter(v=>isFinite(v)));
  if(!isFinite(ylo)||!isFinite(yhi)){ylo=0;yhi=1;}
  const pad=(yhi-ylo)*0.1||0.5; ylo-=pad; yhi+=pad;
  if(STATE.metric==='total'||STATE.curve==='gap'){ylo=Math.min(0,ylo);}
  const xlo=-0.5, xhi=labels.length-0.5;
  const sx=x=>PL+(x-xlo)/(xhi-xlo)*(W-PL-PR);
  const sy=y=>PT+(1-(y-ylo)/(yhi-ylo))*(H-PT-PB);
  let s=`<rect width="${W}" height="${H}" fill="#fffdf8"/>`;
  // grid + y ticks
  const ny=5;
  for(let i=0;i<=ny;i++){const v=ylo+(yhi-ylo)*i/ny; const y=sy(v);
    s+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#ece5d8" stroke-width="1"/>`;
    s+=`<text x="${PL-8}" y="${y+3}" text-anchor="end" font-size="10" fill="#686d73">${v.toFixed(STATE.metric==='total'?3:2)}</text>`;}
  // zero axis
  if(ylo<0&&yhi>0){s+=`<line x1="${PL}" y1="${sy(0)}" x2="${W-PR}" y2="${sy(0)}" stroke="#232426" stroke-width="1"/>`;}
  // x axis
  const bw=(W-PL-PR)/labels.length;
  labels.forEach((lab,i)=>{
    const x=sx(i);
    s+=`<line x1="${x}" y1="${H-PB}" x2="${x}" y2="${H-PB+4}" stroke="#c8c1b6"/>`;
    const fs = labels.length>15?8.5:9.5;
    const rot = labels.length>12? 'transform="rotate(-35 '+x+' '+(H-PB+16)+')"':'';
    s+=`<text x="${x}" y="${H-PB+16}" text-anchor="end" font-size="${fs}" fill="#686d73" ${rot}>${lab}</text>`;
  });
  s+=`<line x1="${PL}" y1="${PT}" x2="${PL}" y2="${H-PB}" stroke="#c8c1b6"/>`;
  s+=`<line x1="${PL}" y1="${H-PB}" x2="${W-PR}" y2="${H-PB}" stroke="#c8c1b6"/>`;
  // axis labels
  s+=`<text x="${(PL+W-PR)/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="#686d73">context 在单 train epoch 内的命中次数（精确分桶）</text>`;
  const yLabel = STATE.metric==='per_token'
    ? (STATE.curve==='gap'?'gap (val−train) per-token loss':'per-token loss')
    : '总贡献 (frac × loss)';
  s+=`<text x="18" y="${(PT+H-PB)/2}" text-anchor="middle" font-size="11" fill="#686d73" transform="rotate(-90 18 ${(PT+H-PB)/2})">${yLabel}</text>`;
  // draw curves
  function drawLine(pts,color,dash,opacity){
    if(pts.length<1)return;
    const valid=pts.filter(p=>p[1]!=null&&isFinite(p[1]));
    if(valid.length<1)return;
    s+=`<polyline points="${valid.map(p=>sx(p[0]).toFixed(1)+','+sy(p[1]).toFixed(1)).join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" ${dash?'stroke-dasharray="'+dash+'"':''} opacity="${opacity||0.92}"/>`;
    valid.forEach(p=>{s+=`<circle cx="${sx(p[0]).toFixed(1)}" cy="${sy(p[1]).toFixed(1)}" r="3" fill="${color}" opacity="${opacity||0.92}"/>`;});
  }
  if(STATE.curve==='train') drawLine(trainPts,'#2d6f9f',null,0.95);
  else if(STATE.curve==='val') drawLine(valPts,'#c4493d',null,0.95);
  else if(STATE.curve==='gap') drawLine(gapPts,'#c4493d','5 3',0.95);
  else { drawLine(trainPts,'#2d6f9f',null,0.92); drawLine(valPts,'#c4493d','5 3',0.92); }
  s+=`</svg>`;
  svg.innerHTML=s;
  // legend
  const lg=$('#legend');
  if(STATE.curve==='both'){
    lg.innerHTML='<span><i class="sw" style="background:#2d6f9f"></i>train（蓝实线）</span><span><i class="sw" style="background:#c4493d"></i>val（红虚线）</span>';
  } else {
    const col=STATE.curve==='gap'?'#c4493d':(STATE.curve==='train'?'#2d6f9f':'#c4493d');
    const txt=STATE.curve==='gap'?'gap = val−train':STATE.curve;
    lg.innerHTML=`<span><i class="sw" style="background:${col}"></i>${txt}</span>`;
  }
  // hint
  const stepInfo = epData.step ? `（代表 step = ${epData.step}，该 epoch 最后一个 probe）` : '';
  $('#hint').innerHTML = `当前：<b>epoch ${STATE.epoch}</b>${stepInfo}· <b>${STATE.branch}</b> context · 频次 = 单 train epoch 内每个 context 的离线精确命中次数。`
    + (STATE.curve==='gap'
      ? (STATE.metric==='total'?'总贡献 = frac × gap（该桶对整体 gap 的贡献量级）。':'正值 = val 高于 train（过拟合），0 线固定为坐标轴。')
      : STATE.curve==='both'
        ? (STATE.metric==='total'?'总贡献 = frac × loss。':'train（蓝）与 val（红虚线）同图，按精确重复次数分桶。')
        : (STATE.metric==='total'?'总贡献 = frac × loss。':'per-token loss = 该桶内每个 token 的平均 loss。'));
  // note
  $('#note').innerHTML = STATE.branch==='trigram'
    ? `<b>trigram</b>：组合空间远大于训练文本，<b>novel 桶（train 中从未出现的 context）在 val 上占比约 30%</b>——是 val 翘起的主要来源。低频 context（1-10 次重复）gap 最大，高频（5k+）train/val 都拟合不好、gap 接近 0。`
    : `<b>bigram</b>：拥有完整频段。novel 桶（train-freq=0）train 中为 0，val 中占约 4%。频次定义仅在 train：val 的 token 按"其 context 在 train 中的频次"归类。低频 context（1-10 次）gap 最明显。`;
}

// wire buttons
document.querySelectorAll('#curve-btns .btn').forEach(b=>b.onclick=()=>{STATE.curve=b.dataset.v;renderBtns('#curve-btns','curve');render();});
document.querySelectorAll('#metric-btns .btn').forEach(b=>b.onclick=()=>{STATE.metric=b.dataset.v;renderBtns('#metric-btns','metric');render();});
document.querySelectorAll('#branch-btns .btn').forEach(b=>b.onclick=()=>{STATE.branch=b.dataset.v;renderBtns('#branch-btns','branch');render();});

// tooltip on hover
const svgEl=$('#chart'); const tip=$('#tip');
svgEl.addEventListener('mousemove',e=>{
  const r=svgEl.getBoundingClientRect();
  const xpix=e.clientX-r.left; const ypix=e.clientY-r.top;
  const W=960,PL=64,PR=20; const scale=W/r.width;
  const labels=DATA.bucket_labels;
  const bw=(W-PL-PR)/labels.length;
  const idx=Math.floor((xpix/scale-PL)/bw);
  if(idx<0||idx>=labels.length){tip.classList.remove('show');return;}
  const lab=labels[idx];
  const br=DATA.branches[STATE.branch];
  const epData=br&&br.epochs?br.epochs[STATE.epoch]:null;
  if(!epData){tip.classList.remove('show');return;}
  const b=epData.buckets[lab];
  if(!b){tip.classList.remove('show');return;}
  let rows=[];
  function fmt(v){return v==null?'—':v.toFixed(3);}
  if(STATE.metric==='per_token'){
    rows.push(['train',fmt(b.train_per_token),'#2d6f9f']);
    rows.push(['val',fmt(b.val_per_token),'#c4493d']);
    rows.push(['gap',fmt(b.gap_per_token),'#c4493d']);
    rows.push(['train frac',(b.train_frac*100).toFixed(2)+'%','#2d6f9f']);
    rows.push(['val frac',(b.val_frac*100).toFixed(2)+'%','#c4493d']);
  } else {
    rows.push(['train',fmt(b.train_total),'#2d6f9f']);
    rows.push(['val',fmt(b.val_total),'#c4493d']);
    rows.push(['gap',fmt(b.gap_total),'#c4493d']);
  }
  let html=`<b>桶 ${lab}</b> (epoch ${STATE.epoch}, step ${epData.step})<br>`+rows.map(r=>`<span style="display:inline-block;width:10px;height:10px;background:${r[2]};border-radius:2px;margin-right:5px"></span>${r[0]}: <b>${r[1]}</b>`).join('<br>');
  tip.innerHTML=html; tip.classList.add('show');
  const tw=tip.offsetWidth, th=tip.offsetHeight;
  let tx=e.clientX-tw-10, ty=e.clientY-th-10;
  if(tx<0)tx=e.clientX+10; if(ty<0)ty=e.clientY+10;
  tip.style.left=tx+'px'; tip.style.top=ty+'px';
});
svgEl.addEventListener('mouseleave',()=>tip.classList.remove('show'));

if(STATE.epoch!=null) render();
</script></body></html>
