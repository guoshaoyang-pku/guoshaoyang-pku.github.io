    s+=`<line x1="${PL}" y1="${py}" x2="${W-PR}" y2="${py}" stroke="#ece5d8"/>`;
    s+=`<text x="${PL-8}" y="${py+3}" font-size="10" text-anchor="end" fill="#236b70">${yy.toFixed(3)}</text>`;}
  const y0=(lLo<=0&&0<=lHi)?syl(0):syl(lLo);
  s+=`<line x1="${PL}" y1="${y0}" x2="${W-PR}" y2="${y0}" stroke="#c8c1b6" stroke-width="1.5"/>`;
  s+=`<line x1="${PL}" y1="${PT}" x2="${PL}" y2="${H-PB}" stroke="#c8c1b6" stroke-width="1.5"/>`;
  for(let i=0;i<=5;i++){const xx=xhi*i/5;s+=`<text x="${sx(xx)}" y="${H-PB+16}" font-size="10" text-anchor="middle" fill="#686d73">${Math.round(xx)}</text>`;}
  (DATA.epoch_boundaries||[]).forEach((b,i)=>{const px=sx(b);
    s+=`<line x1="${px}" y1="${PT}" x2="${px}" y2="${H-PB}" stroke="#8a8176" stroke-dasharray="4 3"/>`;
    s+=`<text x="${px+2}" y="${PT+10}" font-size="9" fill="#8a8176">e${i+2}</text>`;});
  if(DATA.gap_onset){const px=sx(DATA.gap_onset);
    s+=`<line x1="${px}" y1="${PT}" x2="${px}" y2="${H-PB}" stroke="#c4493d" stroke-dasharray="4 3"/>`;
    s+=`<text x="${px+2}" y="${PT+20}" font-size="9" fill="#c4493d">gap onset</text>`;}
  if(normXY.length){
    const d="M"+normXY.map(p=>`${sx(p[0]).toFixed(1)},${syn(p[1]).toFixed(1)}`).join(" L");
    s+=`<path d="${d}" fill="none" stroke="#236b70" stroke-width="2.2"/>`;
  }
  if(lossXY.length){
    const d="M"+lossXY.map(p=>`${sx(p[0]).toFixed(1)},${syl(p[1]).toFixed(1)}`).join(" L");
    s+=`<path d="${d}" fill="none" stroke="#c4493d" stroke-width="2.0" stroke-dasharray="5 3"/>`;
  }
  const metricLabel={gate_rms:"gate_rms",raw_value_rms:"table content RMS",gated_value_rms:"gated value RMS (注入)"}[state.metric];
  const lossLabel=state.loss==="gap"?"gap (val-train)":state.loss+" loss";
  s+=`<rect x="${W-PR+8}" y="${PT-2}" width="12" height="3" fill="#236b70"/>`;
  s+=`<text x="${W-PR+24}" y="${PT+2}" font-size="10" fill="#2b2b2b">${state.branch} ${metricLabel}</text>`;
  s+=`<rect x="${W-PR+8}" y="${PT+14}" width="12" height="3" fill="#c4493d"/>`;
  s+=`<text x="${W-PR+24}" y="${PT+18}" font-size="10" fill="#2b2b2b">${lossLabel}</text>`;
  s+=`<text x="${PL}" y="18" font-size="13" font-weight="600" fill="#2b2b2b">+ Muon (table AdamW) — ${state.branch} ${metricLabel} vs ${lossLabel}</text>`;
  s+=`<text x="12" y="${(PT+H-PB)/2}" font-size="10" fill="#236b70" transform="rotate(-90 12 ${(PT+H-PB)/2})">norm (left)</text>`;
  s+=`<text x="${W-8}" y="${(PT+H-PB)/2}" font-size="10" fill="#c4493d" text-anchor="end" transform="rotate(-90 ${W-8} ${(PT+H-PB)/2})">loss (right)</text>`;
  s+=`<text x="${PL}" y="${H-6}" font-size="10" fill="#686d73">step</text></svg>`;
  document.getElementById("chart").innerHTML=s;
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  const k=t.dataset.k;document.querySelectorAll(`.tab[data-k=${k}]`).forEach(x=>x.classList.remove("active"));
  t.classList.add("active");state[k]=t.dataset.v;
  render();
}));
render();
</script></body></html>
