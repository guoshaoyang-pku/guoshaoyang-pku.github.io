10.0,0.0171],[560.0,0.0227],[610.0,-0.0112],[660.0,-0.0016],[710.0,0.044],[760.0,0.0875],[810.0,0.1336],[860.0,0.1179],[910.0,0.0739],[960.0,0.1078]]},{"label":"5k+","color":"#c4493d","data":[[60.0,-0.0006],[110.0,-0.0168],[160.0,0.0019],[210.0,-0.0016],[260.0,-0.0082],[310.0,0.0009],[360.0,-0.0102],[410.0,-0.0001],[460.0,-0.0001],[510.0,-0.0021],[560.0,0.0116],[610.0,-0.0067],[660.0,0.007],[710.0,0.0106],[760.0,0.0121],[810.0,0.0334],[860.0,0.0303],[910.0,0.0435],[960.0,0.0095]]}]}};
const TITLES = {"per_token|train": "Train Loss (per-token) \u2014 key buckets", "per_token|val": "Val Loss (per-token) \u2014 key buckets", "per_token|gap": "Val \u2212 Train Gap (per-token) \u2014 all buckets", "total_contrib|train": "Train Loss Contribution (frac \u00d7 loss) \u2014 all buckets", "total_contrib|val": "Val Loss Contribution (frac \u00d7 loss) \u2014 all buckets", "total_contrib|gap": "Gap Contribution (frac \u00d7 (val\u2212train)) \u2014 all buckets"};

const NOTES = {
  "per_token|train": "Per-token train loss，只展示 6 个关键 bucket（数据来源于图 14.6）。注意 eq1（低频）train loss 最低，1k-5k/5k+ 在 epoch2 反而最高，直到 step 750 全部同步坍塌。",
  "per_token|val": "Per-token val loss，含 novel(0) bucket（数据来源于图 14.5）。5k+ 高频 bucket 的 val loss 反而最低且持续下降（QA pattern）；novel 和低中频 bucket 的 val loss 持续上升。",
  "per_token|gap": "Per-token gap = val_loss &#8722; train_loss（不含 novel，因为 train 中 novel 无定义）。除 5k+ 明显偏低（~2.4）外，其余 bucket 的 gap 在 epoch2-3 后都稳定在 4&#8211;5 附近，说明 gap 幅度本身在各频段接近。",
  "total_contrib|train": "Train loss contribution = frac &#215; train_loss（数据来源于图 14.3 对应的 train 版本，图 14.4）。Step 750 附近所有 bucket 同步坍塌，对应 LR warmdown。",
  "total_contrib|val": "Val loss contribution = frac &#215; val_loss（图 14.2）。Novel(0) bucket 从 epoch2 起贡献最大，最终占总 val loss 的 29.5%。",
  "total_contrib|gap": "Gap contribution = frac &#215; (val_loss &#8722; train_loss)，novel 用 frac &#215; val_loss（图 14.7）。这是回答“哪个 bucket 对 val 翘起贡献最大”的关键视角：novel 贡献最大(&#8776;34%)，其次是低中频 bucket；高频 bucket 几乎不贡献，因为它们在 train/val 上都拟合得同样好或同样差。"
};

let state = { series: "gap", metric: "total_contrib" };

const W = 880, H = 480, L = 70, R = 850, T = 40, B = 425;

function niceCeil(v, step) { return Math.ceil(v/step)*step; }
function niceFloor(v, step) { return Math.floor(v/step)*step; }

function render() {
  const key = state.metric + "|" + state.series;
  document.getElementById("chart-title").textContent = TITLES[key];
  document.getElementById("chart-note").innerHTML = NOTES[key];
  const series = DATASET[state.metric][state.series];

  let allX = [], allY = [];
  series.forEach(s => s.data.forEach(([x,y]) => { allX.push(x); allY.push(y); }));
  const xMin = Math.min(...allX), xMax = Math.max(...allX);
  const yMin = Math.min(...allY), yMax = Math.max(...allY);

  let yTop = niceCeil(yMax * 1.08, yMax > 3 ? 0.5 : (yMax > 1 ? 0.2 : 0.05));
  let yBot = yMin < 0 ? niceFloor(yMin - 0.03, 0.05) : 0;

  function xPx(x) { return L + (x - xMin) / (xMax - xMin) * (R - L); }
  function yPx(y) { return T + (yTop - y) / (yTop - yBot) * (B - T); }

  const svgParts = [];
  svgParts.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto;">`);
  svgParts.push(`<rect width="${W}" height="${H}" fill="#fffdf8"/>`);

  const nGrid = 6;
  for (let i=0;i<nGrid;i++) {
    const gv = yTop - i*(yTop-yBot)/(nGrid-1);
    const py = yPx(gv);
    svgParts.push(`<line x1="70" y1="${py.toFixed(1)}" x2="850" y2="${py.toFixed(1)}" stroke="#e8e5df" stroke-width="0.6"/>`);
    svgParts.push(`<text x="62" y="${(py+4).toFixed(1)}" text-anchor="end" font-size="10" fill="#686d73">${gv.toFixed(2)}</text>`);
  }
  if (yBot < 0) {
    const zpy = yPx(0);
    svgParts.push(`<line x1="70" y1="${zpy.toFixed(1)}" x2="850" y2="${zpy.toFixed(1)}" stroke="#232426" stroke-width="1.4"/>`);
  }

  const xTicks = 6;
  for (let i=0;i<=xTicks;i++) {
    const xv = xMin + i*(xMax-xMin)/xTicks;
    const px = xPx(xv);
    svgParts.push(`<line x1="${px.toFixed(1)}" y1="40" x2="${px.toFixed(1)}" y2="425" stroke="#e8e5df" stroke-width="0.6"/>`);
    svgParts.push(`<text x="${px.toFixed(1)}" y="443" text-anchor="middle" font-size="10" fill="#686d73">${Math.round(xv)}</text>`);
  }

  svgParts.push(`<line x1="70" y1="40" x2="70" y2="425" stroke="#232426" stroke-width="1.2"/>`);
  svgParts.push(`<line x1="70" y1="425" x2="850" y2="425" stroke="#232426" stroke-width="1.2"/>`);
  svgParts.push(`<text x="460" y="466" text-anchor="middle" font-size="11" fill="#232426">step</text>`);

  let legendY = 45;
  series.forEach(s => {
    const pts = s.data.map(([x,y]) => `${xPx(x).toFixed(1)},${yPx(y).toFixed(1)}`).join(" ");
    const lw = s.label.includes("novel") || s.label === "overall" ? 2.6 : 1.8;
    svgParts.push(`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="${lw}" stroke-linejoin="round"/>`);
    svgParts.push(`<rect x="690" y="${legendY}" width="14" height="3" fill="${s.color}"/>`);
    svgParts.push(`<text x="708" y="${legendY+5}" font-size="9" fill="#232426">${s.label}</text>`);
    legendY += 14;
  });

  svgParts.push(`</svg>`);
  document.getElementById("chart-wrap").innerHTML = svgParts.join("");
}

document.querySelectorAll('[data-series]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-series]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.series = btn.dataset.series;
    render();
  });
});
document.querySelectorAll('[data-metric]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-metric]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.metric = btn.dataset.metric;
    render();
  });
});

render();
</script>
