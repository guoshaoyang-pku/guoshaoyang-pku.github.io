<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>命中频次分布 + 末态 gap</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 12px; background: #fafafa; }
  h2 { font-size: 1.1em; }
  .chart { width: 100%; max-width: 900px; height: 480px; margin: 12px 0; }
  .controls { margin: 8px 0; font-size: 0.9em; }
  .controls button { padding: 4px 10px; margin: 2px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #fff; }
  .controls button.active { background: #333; color: #fff; }
  .note { font-size: 0.85em; color: #666; margin: 8px 0; }
</style></head><body>
<h2>命中频次分布 + 末态 gap</h2>
<p class="note">柱：train/val token fraction；曲线：最后一个 checkpoint 的 per-bucket gap = val loss − train loss。</p>

    <div class="controls">
      <b>context:</b>
      <button class="active" onclick="plotDist('bigram', this)">bigram</button>
      <button onclick="plotDist('trigram', this)">trigram</button>
    </div>
    <div id="dist_chart" class="chart"></div>
    
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<script>
    var gapData = {"bigram": [{"bucket": "novel", "gap": 8.28105370953001, "train_loss": 0.0, "val_loss": 8.28105370953001, "train_frac": 0.0, "val_frac": 0.04272291395399305}, {"bucket": "1", "gap": 6.785251381827873, "train_loss": 0.5438847368233451, "val_loss": 7.329136118651218, "train_frac": 0.03581576877170139, "val_frac": 0.021916707356770832}, {"bucket": "2", "gap": 5.969865998536828, "train_loss": 0.7755377557021657, "val_loss": 6.7454037542389935, "train_frac": 0.022347344292534724, "val_frac": 0.015535142686631944}, {"bucket": "3", "gap": 5.386239739716862, "train_loss": 0.9687661993033159, "val_loss": 6.355005939020177, "train_frac": 0.016413370768229168, "val_frac": 0.012551201714409722}, {"bucket": "4", "gap": 5.128094416229725, "train_loss": 1.1413034100249224, "val_loss": 6.2693978262546475, "train_frac": 0.012883504231770834, "val_frac": 0.010594685872395834}, {"bucket": "5", "gap": 4.746099447980123, "train_loss": 1.2234429050607267, "val_loss": 5.9695423530408505, "train_frac": 0.0110015869140625, "val_frac": 0.009000990125868056}, {"bucket": "6-10", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "11-20", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "21-50", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "51-100", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "101-200", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "201-500", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "501-1k", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "1k-5k", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "5k+", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}], "trigram": [{"bucket": "novel", "gap": 1.028957548380924, "train_loss": 4.755034911752547, "val_loss": 5.783992460133471, "train_frac": 0.0007578531901041666, "val_frac": 0.3118608262803819}, {"bucket": "1", "gap": 2.873116485445718, "train_loss": 1.9835661207010704, "val_loss": 4.856682606146788, "train_frac": 0.2779201931423611, "val_frac": 0.08398946126302083}, {"bucket": "2", "gap": 2.3986257628791687, "train_loss": 2.226653294439388, "val_loss": 4.625279057318557, "train_frac": 0.09493001302083333, "val_frac": 0.049870808919270836}, {"bucket": "3", "gap": 2.106251294163262, "train_loss": 2.3841852734540048, "val_loss": 4.490436567617267, "train_frac": 0.05465528700086805, "val_frac": 0.034659491644965276}, {"bucket": "4", "gap": 1.8899356074542268, "train_loss": 2.529333015324447, "val_loss": 4.419268622778674, "train_frac": 0.038487752278645836, "val_frac": 0.026989407009548612}, {"bucket": "5", "gap": 1.788801479213559, "train_loss": 2.5953799197078933, "val_loss": 4.384181398921452, "train_frac": 0.029313829210069444, "val_frac": 0.022013346354166668}, {"bucket": "6-10", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "11-20", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "21-50", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "51-100", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "101-200", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "201-500", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "501-1k", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "1k-5k", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "5k+", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}]};
    var bucketOrder = ["novel", "1", "2", "3", "4", "5", "6-10", "11-20", "21-50", "51-100", "101-200", "201-500", "501-1k", "1k-5k", "5k+"];

    function plotDist(branch, button) {
      if (button) {
        document.querySelectorAll('.controls button').forEach(function(b) {
          b.classList.remove('active');
        });
        button.classList.add('active');
      }
      var d = gapData[branch];
      var trainTrace = {
        x: d.map(function(x){return x.bucket}),
        y: d.map(function(x){return x.train_frac}),
        customdata: d.map(function(x){return [x.train_loss, x.val_loss, x.gap]}),
        type: "bar",
        name: "train fraction",
        marker: {color: "#2d6f9f"},
        hovertemplate: "bucket=%{x}<br>train fraction=%{y:.2%}<br>train loss=%{customdata[0]:.3f}<br>val loss=%{customdata[1]:.3f}<br>gap=%{customdata[2]:.3f}<extra></extra>"
      };
      var valTrace = {
        x: d.map(function(x){return x.bucket}),
        y: d.map(function(x){return x.val_frac}),
        customdata: d.map(function(x){return [x.train_loss, x.val_loss, x.gap]}),
        type: "bar",
        name: "val fraction",
        marker: {color: "#c4493d"},
        hovertemplate: "bucket=%{x}<br>val fraction=%{y:.2%}<br>train loss=%{customdata[0]:.3f}<br>val loss=%{customdata[1]:.3f}<br>gap=%{customdata[2]:.3f}<extra></extra>"
      };
      var gapTrace = {
        x: d.map(function(x){return x.bucket}),
        y: d.map(function(x){return x.gap}),
        customdata: d.map(function(x){return [x.train_frac, x.val_frac, x.train_loss, x.val_loss]}),
        mode: "lines+markers",
        name: "final gap",
        line: {color: "#353d79", width: 3},
        marker: {color: "#353d79", size: 7},
        yaxis: "y2",
        hovertemplate: "bucket=%{x}<br>final gap=%{y:.3f}<br>train fraction=%{customdata[0]:.2%}<br>val fraction=%{customdata[1]:.2%}<br>train loss=%{customdata[2]:.3f}<br>val loss=%{customdata[3]:.3f}<extra></extra>"
      };
      Plotly.newPlot("dist_chart", [trainTrace, valTrace, gapTrace], {
        title: "命中频次分布 + 末态 gap · " + branch,
        barmode: "group",
        xaxis: {title: "hit count bucket", type: "category", categoryorder: "array",
                categoryarray: bucketOrder, tickangle: -42},
        yaxis: {title: "token fraction", rangemode: "tozero"},
        yaxis2: {title: "final gap = val loss − train loss", side: "right",
                 overlaying: "y", zeroline: true, zerolinecolor: "#232426",
                 zerolinewidth: 1},
        margin: {l:70,r:85,t:50,b:90}, showlegend: true
      });
    }
    plotDist("bigram", document.querySelector('.controls button'));
    </script>
</body></html>
