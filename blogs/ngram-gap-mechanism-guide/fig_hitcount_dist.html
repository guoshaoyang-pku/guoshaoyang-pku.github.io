<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>命中频次分布 + 末态 gap</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 12px; background: #fafafa; }
  h2 { font-size: 1.1em; }
  .chart { width: 100%; max-width: 900px; height: 480px; margin: 12px 0; }
  .controls { margin: 8px 0; font-size: 0.9em; }
  .controls button { padding: 4px 10px; margin: 2px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #fff; }
  .controls button.active { background: #333; color: #fff; }
  .note { font-size: 0.85em; color: #666; margin: 8px 0; }
</style></head><body>
<h2>命中频次分布 + 末态 gap</h2>
<p class="note">柱：train/val token fraction；曲线：最后一个 checkpoint 的 per-bucket gap = val loss − train loss。</p>

    <div class="controls">
      <b>context:</b>
      <button class="active" onclick="plotDist('bigram', this)">bigram</button>
      <button onclick="plotDist('trigram', this)">trigram</button>
    </div>
    <div id="dist_chart" class="chart"></div>
    
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<script>
    var gapData = {"bigram": [{"bucket": "novel", "gap": 8.255768134318487, "train_loss": 0.0, "val_loss": 8.255768134318487, "train_frac": 0.0, "val_frac": 0.04272291395399305}, {"bucket": "1", "gap": 5.97206363784553, "train_loss": 1.311069898055323, "val_loss": 7.283133535900853, "train_frac": 0.035515679253472224, "val_frac": 0.021916707356770832}, {"bucket": "2", "gap": 5.042769607986561, "train_loss": 1.613182135996215, "val_loss": 6.655951743982777, "train_frac": 0.021904839409722224, "val_frac": 0.015535142686631944}, {"bucket": "3", "gap": 4.468146921282487, "train_loss": 1.8453994039022588, "val_loss": 6.3135463251847455, "train_frac": 0.015758938259548612, "val_frac": 0.012551201714409722}, {"bucket": "4", "gap": 4.2235542840851075, "train_loss": 1.986807300748414, "val_loss": 6.210361584833522, "train_frac": 0.013192070855034722, "val_frac": 0.010594685872395834}, {"bucket": "5", "gap": 3.851333133227747, "train_loss": 2.097720560381467, "val_loss": 5.949053693609214, "train_frac": 0.011101616753472222, "val_frac": 0.009000990125868056}, {"bucket": "6-10", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "11-20", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "21-50", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "51-100", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "101-200", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "201-500", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "501-1k", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "1k-5k", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "5k+", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}], "trigram": [{"bucket": "novel", "gap": 1.022765945958164, "train_loss": 4.701220362066684, "val_loss": 5.723986308024848, "train_frac": 0.0007510715060763889, "val_frac": 0.3118608262803819}, {"bucket": "1", "gap": 2.235115409285144, "train_loss": 2.5239500385415985, "val_loss": 4.7590654478267425, "train_frac": 0.2776743570963542, "val_frac": 0.08398946126302083}, {"bucket": "2", "gap": 1.8750050576552941, "train_loss": 2.655868590450105, "val_loss": 4.530873648105399, "train_frac": 0.0950469970703125, "val_frac": 0.049870808919270836}, {"bucket": "3", "gap": 1.6249142556332665, "train_loss": 2.814628447425417, "val_loss": 4.439542703058684, "train_frac": 0.053934733072916664, "val_frac": 0.034659491644965276}, {"bucket": "4", "gap": 1.434882062694157, "train_loss": 2.8906778231360533, "val_loss": 4.32555988583021, "train_frac": 0.03850131564670139, "val_frac": 0.026989407009548612}, {"bucket": "5", "gap": 1.3204720404862718, "train_loss": 3.0062733017070995, "val_loss": 4.326745342193371, "train_frac": 0.029354519314236112, "val_frac": 0.022013346354166668}, {"bucket": "6-10", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "11-20", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "21-50", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "51-100", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "101-200", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "201-500", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "501-1k", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "1k-5k", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "5k+", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}]};
    var bucketOrder = ["novel", "1", "2", "3", "4", "5", "6-10", "11-20", "21-50", "51-100", "101-200", "201-500", "501-1k", "1k-5k", "5k+"];

    function plotDist(branch, button) {
      if (button) {
        document.querySelectorAll('.controls button').forEach(function(b) {
          b.classList.remove('active');
        });
        button.classList.add('active');
      }
      var d = gapData[branch];
      var trainTrace = {
        x: d.map(function(x){return x.bucket}),
        y: d.map(function(x){return x.train_frac}),
        customdata: d.map(function(x){return [x.train_loss, x.val_loss, x.gap]}),
        type: "bar",
        name: "train fraction",
        marker: {color: "#2d6f9f"},
        hovertemplate: "bucket=%{x}<br>train fraction=%{y:.2%}<br>train loss=%{customdata[0]:.3f}<br>val loss=%{customdata[1]:.3f}<br>gap=%{customdata[2]:.3f}<extra></extra>"
      };
      var valTrace = {
        x: d.map(function(x){return x.bucket}),
        y: d.map(function(x){return x.val_frac}),
        customdata: d.map(function(x){return [x.train_loss, x.val_loss, x.gap]}),
        type: "bar",
        name: "val fraction",
        marker: {color: "#c4493d"},
        hovertemplate: "bucket=%{x}<br>val fraction=%{y:.2%}<br>train loss=%{customdata[0]:.3f}<br>val loss=%{customdata[1]:.3f}<br>gap=%{customdata[2]:.3f}<extra></extra>"
      };
      var gapTrace = {
        x: d.map(function(x){return x.bucket}),
        y: d.map(function(x){return x.gap}),
        customdata: d.map(function(x){return [x.train_frac, x.val_frac, x.train_loss, x.val_loss]}),
        mode: "lines+markers",
        name: "final gap",
        line: {color: "#353d79", width: 3},
        marker: {color: "#353d79", size: 7},
        yaxis: "y2",
        hovertemplate: "bucket=%{x}<br>final gap=%{y:.3f}<br>train fraction=%{customdata[0]:.2%}<br>val fraction=%{customdata[1]:.2%}<br>train loss=%{customdata[2]:.3f}<br>val loss=%{customdata[3]:.3f}<extra></extra>"
      };
      Plotly.newPlot("dist_chart", [trainTrace, valTrace, gapTrace], {
        title: "命中频次分布 + 末态 gap · " + branch,
        barmode: "group",
        xaxis: {title: "hit count bucket", type: "category", categoryorder: "array",
                categoryarray: bucketOrder, tickangle: -42},
        yaxis: {title: "token fraction", rangemode: "tozero"},
        yaxis2: {title: "final gap = val loss − train loss", side: "right",
                 overlaying: "y", zeroline: true, zerolinecolor: "#232426",
                 zerolinewidth: 1},
        margin: {l:70,r:85,t:50,b:90}, showlegend: true
      });
    }
    plotDist("bigram", document.querySelector('.controls button'));
    </script>
</body></html>
