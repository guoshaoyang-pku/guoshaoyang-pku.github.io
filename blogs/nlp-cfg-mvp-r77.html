tial.to(v)\n        ys = []\n        for t in range(r.shape[1]):\n            old_value = (state*removal[:, t, :, None, :]).sum(-1)\n            state = (state*w[:, t, :, None, :] - old_value[..., None]*(rate[:, t]*removal[:, t])[:, :, None, :]\n                     + v[:, t, :, :, None]*k[:, t, :, None, :])\n            ys.append((state*r[:, t, :, None, :]).sum(-1))\n        return torch.stack(ys, 1), state\n\n\ndef fft_causal(x, filt):\n    \"\"\"x[B,T,D], filt[T,D]; zero-padded linear convolution, not circular.\"\"\"\n    with torch.autocast(device_type=x.device.type, enabled=False):\n        output_dtype = compute_dtype(x)\n        # Reference FFT uses FP64: FP32 global transforms can lose a small\n        # causal prefix beside much larger late outputs. Cast back afterward;\n        # target accelerated kernels require a separate precision comparison.\n        x, filt = x.double(), filt.double()\n        length = x.shape[1]\n        n = 1 \u003c\u003c (2*length-2).bit_length()\n        return torch.fft.irfft(torch.fft.rfft(x, n=n, dim=1)*torch.fft.rfft(filt, n=n, dim=0)[None], n=n, dim=1)[:, :length].to(output_dtype)\n\n\nclass Attention(nn.Module):\n    def __init__(self, m, spec):\n        super().__init__()\n        d = m['d_model']\n        self.h, self.kh, self.p = m['heads'], m['kv_heads'], d//m['heads']\n        self.rope, self.gain = m['attn']['rope_dims'], m['attn']['qk_gain']\n        self.q, self.k = nn.Linear(d, d, bias=False), nn.Linear(d, self.kh*self.p, bias=False)\n        self.v, self.out = nn.Linear(d, self.kh*self.p, bias=False), nn.Linear(d, d, bias=False)\n\n    def forward(self, x):\n        b, t, d = x.shape\n        q = self.q(x).view(b,t,self.h,self.p).transpose(1,2)\n        k, v = [f(x).view(b,t,self.kh,self.p).transpose(1,2) for f in (self.k, self.v)]\n        q, k = rope(rms_norm(q), self.rope)*self.gain, rope(rms_norm(k), self.rope)\n        k, v = [z.repeat_interleave(self.h//self.kh, 1) for z in (k,v)]\n        y = F.scaled_dot_p class RWKV7(nn.Module):\n    def __init__(self,m,spec):\n        super().__init__()\n        d, rank = m['d_model'], spec['rank']\n        self.p, self.h = spec['head_dim'], d//spec['head_dim']\n        self.mix = nn.Parameter(torch.full((6,d),.5))\n        self.r, self.k, self.v, self.out = [nn.Linear(d,d,bias=False) for _ in range(4)]\n        self.a, self.decay, self.g = LowRank(d,rank), LowRank(d,rank), LowRank(d,rank,bias=False)\n        self.xi, self.boost, self.bonus = [nn.Parameter(torch.ones(d)) for _ in range(3)]\n        self.norm_weight, self.norm_bias = nn.Parameter(torch.ones(self.h,self.p)), nn.Parameter(torch.zeros(self.h,self.p))\n\n    def forward(self,x):\n        shifted = F.pad(x[:,:-1],(0,0,1,0))\n        xr,xk,xv,xd,xa,xg = [x+(shifted-x)*mu for mu in self.mix]\n        r,k,v = self.r(xr),self.k(xk),self.v(xv)\n        with torch.autocast(device_type=x.device.type, enabled=False):\n            # Gate projections also retain full precision under autocast.\n            def lr(f,z,act):\n                dtype=compute_dtype(x)\n                h=act(F.linear(z.to(dtype),f.up.weight.to(dtype)))\n                return F.linear(h,f.down.weight.to(dtype),None if f.down.bias is None else f.down.bias.to(dtype))\n            rate = lr(self.a,xa,lambda z:z).sigmoid()\n            w = (-math.exp(-.5)*lr(self.decay,xd,torch.tanh).sigmoid()).exp()\n            gate = lr(self.g,xg,torch.sigmoid)\n            def heads(z):\n                return z.to(compute_dtype(x)).reshape(*x.shape[:2],self.h,self.p)\n            removal = F.normalize(heads(k*self.xi),dim=-1,eps=1e-6)\n            key = heads(k*(1+(rate-1)*self.boost))\n            r,v = heads(r),heads(v)\n            y,_ = rwkv_scan(r,key,v,heads(w),removal,heads(rate))\n            y = F.layer_norm(y,(self.p,),eps=1e-5)*self.norm_weight + self.norm_bias\n            y = y+(r*key*self.bonus.reshape(self.h,self.p)).sum(-1,keepdim=True)*v\n            y = y.flatten(-2)*gate\n        return self.out(y.to(x.dtype))\n\n\nclass SwiGLU(nn.Module):\n    def __init__(self,d,hidden):\n        super().__init__()\n        self.up,self.down=nn.Linear(d,2*hidden,bias=False),nn.Linear(hidden,d,bias=False)\n        nn.init.orthogonal_(self.up.weight)\n        nn.init.zeros_(self.down.weight)\n\n    def forward(self,x):\n        gate,value=self.up(x).chunk(2,-1)\n        return self.down(F.silu(gate)*value)\n\n\nclass Bigram(nn.Module):\n    def __init__(self,d,spec):\n        super().__init__()\n        self.rows=spec['rows']\n        self.table=nn.Embedding(self.rows,spec['dim'])\n        self.projection=nn.Linear(spec['dim'],d,bias=False)\n        nn.init.zeros_(self.table.weight)\n        nn.init.orthogonal_(self.projection.weight)\n\n    def forward(self,tokens):\n        keys=(tokens[:,:-1].long()*1024+tokens[:,1:].long())%self.rows\n        return F.pad(self.projection(self.table(keys)),(0,0,1,0))\n\n\nMIXERS={'attention':Attention,'conv':ShortConv,'mamba2':Mamba2,'hyena':Hyena,'rwkv7':RWKV7,'gdn':GatedDelta}\n\n\nclass Block(nn.Module):\n    def __init__(self,m,layer):\n        super().__init__()\n        spec=layer['mixer']\n        self.mixer=None if spec['type']=='none' else MIXERS[spec['type']](m,spec)\n        self.mlp=SwiGLU(m['d_model'],layer['mlp']['hidden'])\n\n    def forward(self,x):\n        if self.mixer is not None:\n            x=x+self.mixer(rms_norm(x))\n        return x+self.mlp(rms_norm(x))\n\n\nclass PGModel(nn.Module):\n    def __init__(self,setting):\n        super().__init__()\n        self.setting=copy.deepcopy(setting)\n        self.optim_config=dict(setting['optim'])\n        m=setting['model']\n        self.seq_len,self.softcap=m['seq_len'],m['logit_softcap']\n        self.embedding=nn.Embedding(1024,m['d_model'])\n        self.memory=None if m['ngram'] is None else Bigram(m['d_model'],m['ngram'])\n        self.layers=nn.ModuleList(Block(m,layer) for layer in m['layers'])\n\n    def forward(self,tokens):\n        if tokens.ndim!=2 or tokens.shape[0]\u003c1 or not 1\u003c=tokens.shape[1]\u003c=self.seq_len:\n            raise ValueError('tokens: expected nonempty [batch,length] within seq_len')\n        x=self.embedding(tokens)\n        if self.memory is not None:\n            x=x+self.memory(tokens)\n        x=rms_norm(x)\n        for layer in self.layers:\n            x=layer(x)\n        logits=F.linear(rms_norm(x),self.embedding.weight)\n        return self.softcap*torch.tanh(logits/self.softcap)\n\n    def loss(self,tokens,targets):\n        if targets.shape!=tokens.shape:\n            raise ValueError('targets: expected aligned next-token labels')\n        return F.cross_entropy(self(tokens).float().flatten(0,1),targets.flatten())\n\n    def parameter_groups(self):\n        # Only Linear weight matrices go to Muon; embeddings, conv kernels,\n        # decays, shifts, norm weights and all biases go to AdamW.\n        matrices={id(m.weight) for m in self.modules() if isinstance(m,nn.Linear)}\n        return {name:[p for p in self.parameters() if (id(p) in matrices)==flag]\n                for name,flag in (('muon',True),('adamw',False))}\n\nMODEL_KEY = 'nlp-pg-v12-local-v1:fcda60cd6f55a0c101ae581a1ba6fee42ceaea72d03efb393c7ecc4d5f2f0532'\nSETTING = {'model': {'d_model': 16, 'heads': 4, 'kv_heads': 2, 'layers': [{'mixer': {'type': 'conv'}, 'mlp': {'hidden': 32, 'type': 'swiglu'}, 'type': 'own'}, {'mixer': {'filter_width': 16, 'type': 'hyena'}, 'mlp': {'hidden': 32, 'type': 'swiglu'}, 'type': 'own'}], 'ngram': None, 'seq_len': 192, 'value_residual': False, 'loop': None, 'parallel_from': None, 'smear': False, 'skip_gates': False, 'ln_scale': False, 'logit_softcap': 11.5, 'attn': {'out_gate': 'none', 'kv_conv': 0, 'xsa_last': 0, 'qk_gain': 1.0, 'rope_dims': 4}}, 'optim': {'adamw_lr': 0.003, 'muon_lr': 0.003}}\n\ndef build_model():\n    return PGModel(SETTING)\n"}}}</script><script>
const data=JSON.parse(document.getElementById('data').textContent),el=id=>document.getElementById(id);
for(const t of new Set(data.rows.map(r=>r.task))){const o=document.createElement('option');o.textContent=t;el('task').append(o);}
for(const k of Object.keys(data.models)){const o=document.createElement('option');o.value=k;o.textContent=k;el('candidate').append(o);}
function show(k){const m=data.models[k];el('key').textContent=k;el('candidate').value=k;el('setting').textContent=JSON.stringify(m.envelope,null,2);el('code').textContent=m.code;}
function draw(){const rs=data.rows.filter(r=>r.task===el('task').value);el('rows').replaceChildren();for(const r of rs){const tr=document.createElement('tr');tr.dataset.key=r.key;for(const v of [r.method,r.step,r.key.slice(-16),r.ce.toPrecision(7),r.best.toPrecision(7),r.decision.toFixed(4),r.worker.toFixed(3)]){const td=document.createElement('td');td.textContent=v;tr.append(td);}tr.onclick=()=>show(r.key);el('rows').append(tr);}show(rs[0].key);}
el('task').onchange=draw;el('candidate').onchange=()=>show(el('candidate').value);draw();
</script></html>
