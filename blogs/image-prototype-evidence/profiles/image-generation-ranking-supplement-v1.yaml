  selection_policy: data/task_expansion/vision_batch/image_ranking_v1_20261015/generation/supplement_proposal/selection_policy.json
  selection_policy_sha256: b9d104c2474895543a9159e723e9112d2d6a19214fe940d763a6492f963b75f4
  selection_evidence: data/task_expansion/vision_batch/image_ranking_v1_20261015/generation/supplement_proposal/selection_evidence.json
  selection_evidence_sha256: 01768104dc3c38a11175697129407e1c5a4b853bac0dbfa7b76560396aafcf79
  selector_sha256: 661858113970e129c33d9c91889a8d7d7c8dd7ceba953de77fd188916ee30cef
  only_metric: original discovery final_validation_metric
