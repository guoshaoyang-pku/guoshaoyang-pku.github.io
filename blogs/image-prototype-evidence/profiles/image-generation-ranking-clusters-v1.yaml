    model_ref: conv
    model_updates:
      coordinates: relative
    training_updates:
      prediction_type: x0
      training_steps: 6000
  controls:
  - Complete 2x2 clean/velocity target by 3000/6000 update grid.
  - Same data, model architecture, optimizer, mini-batch and diffusion-noise streams.
  - Prediction-target losses are not comparable; rank only actual sample energy score.
  shortcut_checks:
  - always prefer clean-image prediction
  - always prefer velocity prediction
  - more training steps
  explanation_target: Separate matched-budget target effects and same-target budget effects. Conditional silhouettes
    can improve while appearance diversity shrinks; inspect sample energy, geometry and variance together.
  admission: Freeze discovery order before independent confirmation; do not replace rejected cells.
