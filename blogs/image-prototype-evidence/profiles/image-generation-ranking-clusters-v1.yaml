schema_version: vision_question_clusters_v1
description: Conditional synthetic image generation ranking with true diffusion training and sampling. Analyst hypotheses
  are excluded from prompts. Energy score is comparable across parameterizations; denoising losses are not ranked.
dataset_family: conditional_image_generation
selection_metric: test_energy_score
base_profile: image-generation-ranking-base-v1.yaml
default_num_choices: 3
allowed_num_choices:
- 3
- 4
- 5
instance_seeds:
- 851901
- 851902
- 851903
discovery_training_seeds:
- 20
- 21
- 22
- 23
confirmation_training_seeds:
- 200
- 201
- 202
- 203
- 204
- 205
- 206
- 207
- 208
- 209
- 210
- 211
- 212
- 213
- 214
- 215
statistics:
  discovery:
    n_seeds: 4
    split: validation
    method: direction_estimation
    ordering: mean_validation_energy_score
    admission_gate: false
    purpose: Freeze adjacent ranking directions before independent confirmation; no significance claim from four
      discovery seeds.
  confirmation:
    n_seeds: 16
    split: test
    test: one_sided_paired_sign_test
    alpha: 0.05
    correction: holm
    minimum_mean_gap: 0.003
  estimand: Training-seed paired direction stability conditional on one fixed dataset and fixed evaluation-noise/reference
    stream, with observed mean energy-score gap; not a test of expected-score mean difference or a natural-image
    population claim.
selection_contract:
  discovery_split: validation
  confirmation_split: test
  minimum_mean_gap: 0.003
  require_nonoverlap: false
  multiplicity: Holm across every frozen adjacent hypothesis including rejected templates
  claim_scope: Fixed synthetic image distribution and fixed independent evaluation sample streams; training-seed
    robustness only.
  difficulty_policy: Evaluate every admitted triple and report rejected templates without replacement.
defaults:
  dataset:
    size: 16
    noise_steps: 32
    condition_dim: 6
    brightness_min: 0.65
    brightness_max: 1.0
    texture_strength: 0.12
    radius_min: 0.25
    radius_max: 0.42
    position_extent: 0.45
    reference_samples: 4
    train_size: 1024
    validation_size: 64
    test_size: 64
    ood_size: 32
    evaluation_shift: {}
    ood_shift:
      position_extent: 0.55
  optimizer:
    type: AdamW
    lr: 0.001
    weight_decay: 0.01
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    foreach: false
  loss:
    loss_id: diffusion_mse
  training:
    batch_size: 16
    training_steps: 3000
    total_samples_seen: 48000
    gradient_accumulation: 1
    clip_norm: 1.0
    schedule: constant
    precision: fp32
    tf32: false
    deterministic_algorithms: true
    warmup_updates: 0
    batch_rng_device: cpu
    paired_cpu_batch_stream: true
    persist_initial_state: true
    batch_seed_offset: 500000
    noise_seed_offset: 600000
    evaluation_split: validation
    eval_steps:
    - 750
    - 1500
    - 3000
    prediction_type: x0
    noise_steps: 32
    noise_schedule: cosine
    loss_weighting: uniform
    min_snr_gamma: 5.0
    sampling_steps: 16
    sampling_eta: 0.0
    evaluation_samples_per_condition: 4
    evaluation_seed: 314159
    evaluation_batch_conditions: 16
models:
  conv:
    type: image_generation_denoiser
    mode: conv
    width: 24
    depth: 3
    kernel: 3
    norm: group
    activation: silu
    residual: true
    block: dense
    conditioning: concat
    coordinates: absolute
    time_embedding: sinusoidal
    max_parameters: 2000000
  unet:
    type: image_generation_denoiser
    mode: unet
    width: 24
    depth: 3
    kernel: 3
    norm: group
    activation: silu
    residual: true
    block: dense
    skip: true
    conditioning: concat
    coordinates: absolute
    time_embedding: sinusoidal
    max_parameters: 2000000
  mlp:
    type: image_generation_denoiser
    mode: mlp
    width: 24
    depth: 3
    activation: silu
    conditioning: concat
    coordinates: absolute
    time_embedding: sinusoidal
    max_parameters: 2000000
  transformer:
    type: image_generation_denoiser
    mode: patch_transformer
    width: 24
    depth: 3
    activation: gelu
    conditioning: concat
    coordinates: absolute
    time_embedding: sinusoidal
    patch_size: 2
    max_parameters: 2000000
    num_heads: 4
    ff_multiplier: 2
contexts:
  textured: {}
  clean:
    texture_strength: 0.0
  small_data:
    train_size: 96
  shifted:
    evaluation_shift:
      position_extent: 0.55
surface_heuristics:
- id: more_parameters
  field: parameter_count
  higher_is_better: true
- id: more_training_steps
  field: training.training_steps
  higher_is_better: true
- id: more_sampling_steps
  field: training.sampling_steps
  higher_is_better: true
templates:
- id: operator_local_global
  category: operator
  context_ref: textured
  budget_semantics: matched_steps
  hypothesis: Local convolution, down/up processing and global patch attention differ in spatial bias and finite-budget
    optimization.
  varying_axes:
  - model.mode
  choices:
  - id: conv
    model_ref: conv
  - id: unet
    model_ref: unet
  - id: transformer
    model_ref: transformer
  diagnostics: []
  controls:
  - Identical materialized train/validation/test distribution within a question.
  - All unlisted settings inherit explicit defaults; measured parameter counts are shown.
  - Sample quality uses the same fixed conditional reference draws and initial-noise streams.
  shortcut_checks:
  - larger network
  - more sampling steps
  - matching generator geometry
  explanation_target: Use the isolated local controls and actual sampling/condition/diversity diagnostics; distinguish
    optimization from distribution quality.
  admission: Freeze discovery order before independent confirmation; retain rejected triples without replacement.
- id: operator_coordinates
  category: operator
