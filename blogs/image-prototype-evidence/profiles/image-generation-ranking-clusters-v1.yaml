- id: budget_parameterization
  category: budget_objective
  context_ref: textured
  budget_semantics: per_choice_steps
  hypothesis: A noise-robust conditional mean can learn quickly while a stochastic conditional distribution requires
    more updates; parameterization rankings can change with budget.
  varying_axes:
  - training.prediction_type
  - training.training_steps
  choices:
  - id: relative_x0_3000
    model_ref: conv
    model_updates:
      coordinates: relative
    training_updates:
      prediction_type: x0
      training_steps: 3000
  - id: relative_v3000
    model_ref: conv
    model_updates:
