  decision_before_formal_runs: true
  calibration_runs:
  - generation/calibration
  - generation/calibration_long
  - generation/calibration_v6000
  decision: Use 3000-step x0 default after independent calibration showed useful geometry. Retain 700-step short
    budget and add full x0/v by 3000/6000 controls to include a stochastic generation anchor. No requirement that
    every candidate fit the distribution well; weak controlled variants are retained.
  limits: The v6000 relative-coordinate pilot is useful but remains above oracle energy score; image variance is
    not proof of correctly learned texture modes. The calibration test split is exploratory only and never used
    as formal evidence.
