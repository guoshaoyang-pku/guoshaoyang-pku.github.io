schema_version: vision_question_clusters_v1
description: Synthetic image classification prototype with explicit primary triples, local intervention
  controls, three data seeds, and fixed statistical admission. Analyst-only hypothesis text must never
  enter prompts.
base_profile: task-expansion-image-classification.yaml
dataset_family: image_classification
selection_metric: test_cross_entropy
default_num_choices: 3
allowed_num_choices:
- 3
- 4
- 5
instance_seeds:
- 841901
- 841902
- 841903
discovery_training_seeds:
- 20
- 21
- 22
- 23
confirmation_training_seeds:
- 200
- 201
- 202
- 203
- 204
- 205
- 206
- 207
- 208
- 209
- 210
- 211
- 212
- 213
- 214
- 215
statistics:
  discovery:
    n_seeds: 4
    split: validation
    purpose: direction_estimation_only
    ranking_rule: ascending_mean_validation_cross_entropy
    significance_gate: false
  confirmation:
    n_seeds: 16
    split: test
    test: one_sided_paired_sign_test
    alpha: 0.05
    correction: holm
    min_mean_paired_gap: 0.005
  estimand: Paired per-seed win/loss stability plus observed mean CE gap for a fixed materialized dataset.
    Not a test of expected CE differences or natural-image generalization.
selection_contract:
  discovery_split: validation
  confirmation_split: test
  freeze_before_confirmation:
  - candidate IDs
  - adjacent ranking directions
  - comparison family
  - gap threshold
  - seed list
  multiplicity: Holm across every frozen adjacent hypothesis, including rejected templates
  minimum_mean_gap: 0.005
  require_nonoverlap: false
  claim_scope: Synthetic task and fixed image-instance conditional training seed robustness. No natural-image
    claim.
  difficulty_policy: Evaluate every admitted triple; retain rejected triples without replacement.
defaults:
  dataset:
    size: 24
    num_classes: 4
    task: relative_position
    radius_range:
    - 2.5
    - 4.5
    frequency_range:
    - 1.5
    - 3.0
    intensity_range:
    - 0.8
    - 1.2
    normalize_mass: true
    train_size: 1024
    validation_size: 512
    test_size: 512
    ood_size: 128
    edge_softness: 0.5
  optimizer:
    type: AdamW
    lr: 0.001
    weight_decay: 0.01
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    foreach: false
  loss:
    loss_id: cross_entropy
  training:
    batch_size: 32
    training_steps: 300
    total_samples_seen: 9600
    gradient_accumulation: 1
    clip_norm: 1.0
    schedule: constant
    precision: fp32
    tf32: false
    deterministic_algorithms: true
    warmup_updates: 0
    batch_rng_device: cpu
    paired_cpu_batch_stream: true
    persist_initial_state: true
    batch_seed_offset: 500000
    evaluation_split: validation
    eval_steps:
    - 0
    - 100
    - 300
    record_training_diagnostics: true
models:
  cnn:
    type: image_classifier
    mode: cnn
    width: 24
    depth: 2
    activation: gelu
    residual: true
    norm: layer
    norm_first: true
    ff_ratio: 2
    kernel_size: 3
    convolution: dense
    pooling: spatial
    pool_grid: 3
    coordinates: false
    stem_stride: 1
    max_parameters: 2000000
  vit:
    type: image_classifier
    mode: patch_transformer
    width: 32
    depth: 2
    activation: gelu
    residual: true
    norm: layer
    norm_first: true
    ff_ratio: 2
    heads: 4
    patch_size: 4
    position: learned
    max_parameters: 2000000
  mlp:
    type: image_classifier
    mode: mlp
    width: 96
    depth: 2
    activation: gelu
    residual: true
    max_parameters: 2000000
contexts:
  relations: {}
  shapes:
    task: local_shape
  textures:
    task: texture_orientation
  fine_textures:
    task: texture_orientation
    frequency_range:
    - 4.0
    - 6.0
  small_shapes:
    task: local_shape
    train_size: 64
templates:
- id: receptive_field_depth
  category: spatial_support
  context_ref: relations
  budget_semantics: matched_steps
  varying_axes:
  - model.kernel_size
  - model.depth
  choices:
  - id: k3_d1
    model_ref: cnn
    model_updates:
      depth: 1
  - id: k3_d4
    model_ref: cnn
    model_updates:
      depth: 4
  - id: k7_d1
    model_ref: cnn
    model_updates:
      kernel_size: 7
      depth: 1
  diagnostics:
  - id: k7_d4
    model_ref: cnn
    model_updates:
      kernel_size: 7
      depth: 4
  hypothesis: Kernel support and depth interact under finite optimization.
  explanation_target: Use the full 2x2 kernel/depth control; spatial pooling itself preserves coarse positions,
    so kernel support is not the sole available route.
  controls:
  - Same fixed materialized image splits within each question.
  - All unlisted fields inherit the explicit defaults.
  - Measured parameter counts are displayed; matching width does not match parameters or computation.
  shortcut_checks:
  - larger model always wins
  - more steps always wins
  - matching task name to architecture
  admission: Freeze discovery-ranked primary triple before independent confirmation. Never replace choices
    after rejection.
