      coordinates: true
  hypothesis: Coordinate input and spatial readout provide different location information.
  explanation_target: Use the completed 2x2 control and distinguish representation availability from optimization;
    convolution boundary effects mean finite images are not exactly translation invariant.
  controls:
  - Same fixed materialized image splits within each question.
