<script>
var STC={verified:'#147357',running:'#b45309',queued:'#2b6f8e',blocked:'#c0392b'};
var GNAME={L1:'Lean 基线',L2:'上游适配',L3:'解析关键路径',L4:'几何关键路径',L5:'拓扑与审计'};
var TASKS=[
['D1–D6 release 链','L1','verified','0 · 已完成','6 份 release manifest','proved / audited'],
['Pinned Lean 构建','L1','verified','0 · 已完成','61 个 Lean 文件','compiled'],
['Axiom gate','L1','verified','0 · 已完成','0 个违禁公理','axiom audit'],
['每周 release 集成','L1','running','每周 2 h','publication 分支','compile gate'],
['工具链兼容 v4.32.1→v4.34','L2','queued','1 d','pin 兼容矩阵','statement-only'],
['MorganTian / Topping 适配','L2','queued','1–2 d','2 份 adapter 计划','upstream source claim'],
['热核域修复','L3','queued','1–2 d','test-function 接口','conditional'],
['抛物局部存在','L3','running','2–4 d','半群桥接口','conditional'],
['DeTurck producer','L3','queued','3–5 d','U8 frontier','statement-only'],
['流形体积 / IBP','L4','running','2–3 d','I4 / U7 结果卡','conditional'],
['比较几何 · Bishop–Gromov','L4','queued','1–2 d','模型级定理','model'],
['GH 紧性判据','L4','verified','0 · 已完成','一般度量判据','general metric'],
['手术识别','L5','verified','0 · 已完成','3 处闭合','conditional'],
['三角剖分拓扑','L5','queued','1–2 d','6 处闭合','compiled'],
['交叉审计账本','L5','running','1–3 d','U1–U12 / I1–I8 账本','audit pending']
];
var gf='all',sf='all';
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function stCell(st){return '<span class="st"><i style="background:'+STC[st]+'"></i>'+st+'</span>'}
function render(){
  var rows='',n=0;
  TASKS.forEach(function(t){
    if(gf!=='all'&&t[1]!==gf)return;
    if(sf!=='all'&&t[2]!==sf)return;
    n++;
    rows+='<tr><td>'+esc(t[0])+'</td><td class="mono">'+t[1]+'</td><td>'+stCell(t[2])+
      '</td><td class="mono">'+esc(t[3])+'</td><td>'+esc(t[4])+'</td><td class="mono">'+esc(t[5])+'</td></tr>';
  });
  document.getElementById('taskBody').innerHTML=rows;
  document.getElementById('count').textContent='显示 '+n+' / '+TASKS.length+' 个任务';
  document.querySelectorAll('.supernode').forEach(function(g){
    g.classList.toggle('sel',g.dataset.group===gf);
  });
}
function setFilter(kind,val){
  if(kind==='g')gf=val;else sf=val;
  document.querySelectorAll('button[data-'+kind+']').forEach(function(b){
    b.classList.toggle('active',b.dataset[kind]===val);
  });
  render();
}
document.querySelectorAll('button[data-g]').forEach(function(b){
  b.addEventListener('click',function(){setFilter('g',b.dataset.g)});
});
document.querySelectorAll('button[data-s]').forEach(function(b){
  b.addEventListener('click',function(){setFilter('s',b.dataset.s)});
});
document.querySelectorAll('.supernode').forEach(function(g){
  g.addEventListener('click',function(){
    setFilter('g',g.dataset.group===gf?'all':g.dataset.group);
  });
});
render();
</script>
