:root{color-scheme:light;--panel:#fff;--ink:#172033;--heading:#102a5e;--muted:#667085;--line:#d9dee8;--soft:#eef2f7;--blue:#315fa8;--green:#147357;--orange:#b45309;--purple:#7354ad;--red:#b34b4b;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body,#swarm-app{margin:0;min-height:100%;background:transparent}body{color:var(--ink)}button{font:inherit}.swarm-shell{max-width:1220px;margin:auto;padding:30px 28px 42px}.topbar{display:flex;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line);padding-bottom:24px}.eyebrow{display:block;color:var(--blue);font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.topbar h1{margin:7px 0 5px;color:var(--heading);font:700 32px/1.1 Georgia,"Times New Roman",serif}.topbar p{margin:0;color:var(--muted);font-size:14px}.capture{min-width:145px;text-align:right;color:var(--muted);font-size:11px}.capture strong,.capture small{display:block}.capture strong{margin-top:6px;color:var(--ink);font-size:13px}.capture small{margin-top:4px}.metric-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;margin:20px 0;background:var(--line);border:1px solid var(--line)}.metric-strip>div{min-height:92px;padding:15px 16px;background:var(--panel)}.metric-strip span,.metric-strip small{display:block;color:var(--muted);font-size:11px}.metric-strip strong{display:block;margin:7px 0 3px;color:var(--heading);font-size:24px;font-variant-numeric:tabular-nums}.workspace{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,.85fr);gap:16px}.graph-panel,.detail-panel,.task-panel{background:color-mix(in srgb,var(--panel) 96%,var(--soft));border:1px solid var(--line)}.graph-panel,.detail-panel{min-height:400px;padding:20px}.panel-head,.task-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.panel-head h2,.task-head h2{margin:4px 0 0;color:var(--heading);font-size:18px}.legend{display:flex;gap:12px;fl
