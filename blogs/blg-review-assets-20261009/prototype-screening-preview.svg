<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 390" role="img" aria-labelledby="title desc"><title id="title">共享屏蔽机制的计算与反例</title><desc id="desc">电场、层电荷、内部层势与能带相连。两个相近谱隙点的电导相差11.9倍，冻结预测在较高密度失效。</desc><rect width="860" height="390" fill="white"/><g fill="#141413" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="16"><rect x="22" y="22" width="178" height="45" rx="3" fill="#faf9f5" stroke="#b0aea5"/><text x="111" y="51" text-anchor="middle">外部电场</text><path d="M204 44h25m-7-5 7 5-7 5" fill="none" stroke="#5e5d59" stroke-width="1.6"/><rect x="235" y="22" width="178" height="45" rx="3" fill="#faf9f5" stroke="#b0aea5"/><text x="324" y="51" text-anchor="middle">层电荷与屏蔽</text><path d="M417 44h25m-7-5 7 5-7 5" fill="none" stroke="#5e5d59" stroke-width="1.6"/><rect x="448" y="22" width="178" height="45" rx="3" fill="#faf9f5" stroke="#b0aea5"/><text x="537" y="51" text-anchor="middle">内部层势</text><path d="M630 44h25m-7-5 7 5-7 5" fill="none" stroke="#5e5d59" stroke-width="1.6"/><rect x="661" y="22" width="178" height="45" rx="3" fill="#faf9f5" stroke="#b0aea5"/><text x="750" y="51" text-anchor="middle">能带与占据</text><text x="22" y="101" font-size="14" fill="#5e5d59">McCann：屏蔽理论 · Mak / Zhang / Kuzmenko：光谱 · Oostinga / Icking：输运</text><text x="22" y="143">同一样品、同一外场：相近带隙，导电不同</text><text x="22" y="180">中性点 · 谱隙 10.659 meV</text><rect x="22" y="192" width="20.10" height="16" fill="#6a9bcc"/><text x="48.10" y="206" font-size="14">0.521 e²/h</text><text x="22" y="258">加入空穴 · 谱隙 11.085 meV</text><rect x="22" y="270" width="239.55" height="16" fill="#6a9bcc"/><text x="267.55" y="284" font-size="14">6.211 e²/h</text><text x="450" y="143">新条件：最大层势预测误差（meV）</text><path d="M585 312H815" stroke="#b0aea5"/><path d="M660 160V315" stroke="#5e5d59" stroke-dasharray="5 4"/><text x="660" y="339" text-anchor="middle" font-size="14">冻结范围 0.5</text><text x="450" y="198">低密度</text><rect x="585" y="180" width="30.39" height="13" fill="#6a9bcc"/><text x="621.39" y="191" font-size="13">0.203</text><rect x="585" y="202" width="43.35" height="13" fill="#d97757"/><text x="634.35" y="213" font-size="13">0.289</text><text x="450" y="274">高密度</text><rect x="585" y="256" width="197.46" height="13" fill="#6a9bcc"/><text x="788.46" y="267" font-size="13">1.316</text><rect x="585" y="278" width="209.60" height="13" fill="#d97757"/><text x="800.60" y="289" font-size="13">1.397</text><text x="22" y="367" font-size="14" fill="#5e5d59">实际计算 · 零磁场，20 K，固定散射时间 · 共享理论的数值重建，未联合拟合实验</text></g></svg>
