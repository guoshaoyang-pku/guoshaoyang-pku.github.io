<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#f0eff8"/>
  <!-- axes -->
  <g stroke="#1e3a5f" stroke-opacity="0.25" stroke-width="2">
    <path d="M120 480 H700"/>
    <path d="M120 480 V120"/>
  </g>
  <text x="690" y="510" font-family="Inter, sans-serif" font-size="14" fill="#57534e" text-anchor="end">replay steps</text>
  <text x="100" y="130" font-family="Inter, sans-serif" font-size="14" fill="#57534e" text-anchor="start">loss</text>
  <!-- shared trunk then forking curves -->
  <path d="M140 380 C 240 370, 300 350, 340 330" stroke="#1e3a5f" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M340 330 C 420 300, 520 260, 660 230" stroke="#1e3a5f" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M340 330 C 420 360, 500 420, 660 452" stroke="#c2410c" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- fork point -->
  <circle cx="340" cy="330" r="9" fill="#fdfcfa" stroke="#1e3a5f" stroke-width="3"/>
  <!-- end labels -->
  <text x="672" y="234" font-family="Inter, sans-serif" font-size="14" fill="#1e3a5f" text-anchor="start">generalizes</text>
  <text x="672" y="456" font-family="Inter, sans-serif" font-size="14" fill="#c2410c" text-anchor="start">forked</text>
  <!-- replay marker -->
  <g opacity="0.5">
    <path d="M340 300 V480" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="5 6"/>
    <text x="340" y="292" font-family="Inter, sans-serif" font-size="13" fill="#c2410c" text-anchor="middle">replay begins</text>
  </g>
  <text x="400" y="80" font-family="Inter, sans-serif" font-size="32" font-weight="600" fill="#1e3a5f" text-anchor="middle">Forking</text>
  <text x="400" y="114" font-family="Inter, sans-serif" font-size="16" fill="#57534e" text-anchor="middle">Sudden overfitting under replay</text>
</svg>
