<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#f0eff8"/>
  <!-- three recipe cards, one chosen -->
  <g transform="translate(110, 190)">
    <rect x="0" y="0" width="170" height="220" rx="12" fill="white" stroke="#1e3a5f" stroke-opacity="0.15"/>
    <text x="85" y="42" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#57534e" text-anchor="middle">Recipe A</text>
    <path d="M30 160 C 60 150, 90 110, 140 90" stroke="#1e3a5f" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round"/>
  </g>
  <g transform="translate(315, 190)">
    <rect x="0" y="0" width="170" height="220" rx="12" fill="white" stroke="#c2410c" stroke-width="2.5"/>
    <text x="85" y="42" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#1e3a5f" text-anchor="middle">Recipe B</text>
    <path d="M30 170 C 60 160, 95 80, 140 55" stroke="#c2410c" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="140" cy="20" r="14" fill="#c2410c"/>
    <path d="M133 20 l5 5 l9 -10" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(520, 190)">
    <rect x="0" y="0" width="170" height="220" rx="12" fill="white" stroke="#1e3a5f" stroke-opacity="0.15"/>
    <text x="85" y="42" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#57534e" text-anchor="middle">Recipe C</text>
    <path d="M30 120 C 65 130, 95 150, 140 160" stroke="#1e3a5f" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round"/>
  </g>
  <!-- human vs model accuracy bars -->
  <g transform="translate(230, 470)">
    <rect x="0" y="0" width="150" height="18" rx="9" fill="#1e3a5f" opacity="0.25"/>
    <rect x="0" y="0" width="99" height="18" rx="9" fill="#1e3a5f"/>
    <text x="0" y="-8" font-family="Inter, sans-serif" font-size="13" fill="#57534e">Human best 66%</text>
    <rect x="200" y="0" width="150" height="18" rx="9" fill="#c2410c" opacity="0.25"/>
    <rect x="200" y="0" width="114" height="18" rx="9" fill="#c2410c"/>
    <text x="200" y="-8" font-family="Inter, sans-serif" font-size="13" fill="#57534e">Frontier LLM 76%</text>
  </g>
  <text x="400" y="90" font-family="Inter, sans-serif" font-size="32" font-weight="600" fill="#1e3a5f" text-anchor="middle">ArchitectureIQ</text>
  <text x="400" y="124" font-family="Inter, sans-serif" font-size="16" fill="#57534e" text-anchor="middle">On the measure of training intuition</text>
</svg>
