<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#f0eff8"/>
  <!-- layered model-card sheets -->
  <g transform="translate(250, 150)">
    <rect x="24" y="-24" width="300" height="330" rx="14" fill="white" stroke="#1e3a5f" stroke-opacity="0.1"/>
    <rect x="12" y="-12" width="300" height="330" rx="14" fill="white" stroke="#1e3a5f" stroke-opacity="0.15"/>
    <rect x="0" y="0" width="300" height="330" rx="14" fill="white" stroke="#1e3a5f" stroke-opacity="0.2"/>
    <!-- card content lines -->
    <rect x="28" y="34" width="150" height="16" rx="8" fill="#1e3a5f" opacity="0.8"/>
    <rect x="28" y="70" width="244" height="9" rx="4.5" fill="#1e3a5f" opacity="0.2"/>
    <rect x="28" y="90" width="220" height="9" rx="4.5" fill="#1e3a5f" opacity="0.2"/>
    <rect x="28" y="110" width="236" height="9" rx="4.5" fill="#1e3a5f" opacity="0.2"/>
    <!-- capability bars -->
    <g transform="translate(28, 160)">
      <rect x="0" y="0" width="200" height="12" rx="6" fill="#1e3a5f" opacity="0.75"/>
      <rect x="0" y="26" width="160" height="12" rx="6" fill="#1e3a5f" opacity="0.55"/>
      <rect x="0" y="52" width="180" height="12" rx="6" fill="#1e3a5f" opacity="0.65"/>
      <rect x="0" y="78" width="120" height="12" rx="6" fill="#c2410c" opacity="0.8"/>
    </g>
    <!-- seed dot -->
    <circle cx="262" cy="42" r="10" fill="#c2410c"/>
  </g>
  <text x="400" y="80" font-family="Inter, sans-serif" font-size="32" font-weight="600" fill="#1e3a5f" text-anchor="middle">Seed Model Cards</text>
  <text x="400" y="114" font-family="Inter, sans-serif" font-size="16" fill="#57534e" text-anchor="middle">ByteDance Seed team contribution</text>
</svg>
