<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#f4f7f6"/>
  <!-- Title -->
  <text x="400" y="58" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#111614" text-anchor="middle">Paper Podcast</text>
  <text x="400" y="88" font-family="Inter, sans-serif" font-size="13" fill="#57534e" text-anchor="middle">论文深度解读 · 双音色对话 · 85 期</text>
  <!-- Section cards -->
  <g font-family="Inter, sans-serif" text-anchor="middle">
    <!-- 1 Embodied -->
    <rect x="40" y="120" width="160" height="150" rx="12" fill="white" stroke="#0f766e" stroke-width="2"/>
    <circle cx="120" cy="160" r="21" fill="#eaf5f2"/>
    <text x="120" y="165" font-size="14" font-weight="600" fill="#0f766e">01</text>
    <text x="120" y="205" font-size="15" font-weight="600" fill="#111614">具身智能</text>
    <text x="120" y="224" font-size="10" fill="#a8a29e">Embodied</text>
    <text x="120" y="250" font-size="12" fill="#57534e">12 期</text>
    <!-- 2 Interpretability -->
    <rect x="230" y="120" width="160" height="150" rx="12" fill="white" stroke="#1e3a5f" stroke-width="2"/>
    <circle cx="310" cy="160" r="21" fill="#eaf1f8"/>
    <text x="310" y="165" font-size="14" font-weight="600" fill="#1e3a5f">02</text>
    <text x="310" y="205" font-size="15" font-weight="600" fill="#111614">可解释性</text>
    <text x="310" y="224" font-size="10" fill="#a8a29e">Interpretability</text>
    <text x="310" y="250" font-size="12" fill="#57534e">15 期</text>
    <!-- 3 Agent -->
    <rect x="420" y="120" width="160" height="150" rx="12" fill="white" stroke="#c2410c" stroke-width="2"/>
    <circle cx="500" cy="160" r="21" fill="#fdf0e7"/>
    <text x="500" y="165" font-size="14" font-weight="600" fill="#c2410c">03</text>
    <text x="500" y="205" font-size="15" font-weight="600" fill="#111614">Agent·自进化</text>
    <text x="500" y="224" font-size="10" fill="#a8a29e">Agent</text>
    <text x="500" y="250" font-size="12" fill="#57534e">21 期</text>
    <!-- 4 Core -->
    <rect x="610" y="120" width="160" height="150" rx="12" fill="white" stroke="#6d28d9" stroke-width="2"/>
    <circle cx="690" cy="160" r="21" fill="#f3edfc"/>
    <text x="690" y="165" font-size="14" font-weight="600" fill="#6d28d9">04</text>
    <text x="690" y="205" font-size="15" font-weight="600" fill="#111614">核心必读</text>
    <text x="690" y="224" font-size="10" fill="#a8a29e">Core</text>
    <text x="690" y="250" font-size="12" fill="#57534e">37 期</text>
  </g>
  <!-- Play pill -->
  <g transform="translate(288, 320)">
    <rect width="224" height="46" rx="23" fill="#0f766e"/>
    <path d="M92 15 L116 23 L92 31 Z" fill="white"/>
    <text x="132" y="29" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="white" text-anchor="start">立即收听</text>
  </g>
  <!-- Footer -->
  <text x="400" y="415" font-family="Inter, sans-serif" font-size="11" fill="#a8a29e" text-anchor="middle">每期 20–35 分钟 · 深度拆解 · 免费收听</text>
</svg>
